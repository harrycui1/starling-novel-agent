<style>
:root{--bg:#f6f4ef;--paper:#fffdf8;--ink:#1f1d1a;--ink2:#57534c;--ink3:#8f8a80;--line:#e6e1d6;--soft:#efebe2;--accent:#b4432c;--warn:#b7791f;--warn-soft:#fbf0d9;
 --serif:"Songti SC","Noto Serif SC",serif;--sans:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#161513;--paper:#1e1c19;--ink:#ece8df;--ink2:#b5afa3;--ink3:#7d786e;--line:#2f2c27;--soft:#26241f;--accent:#e07a5f;--warn:#e0a84a;--warn-soft:#352a17}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.7 var(--sans);display:flex;flex-direction:column}
.muted{color:var(--ink3)}
.top{flex:none;background:var(--paper);border-bottom:1px solid var(--line)}
.in{max-width:1100px;margin:0 auto;padding:0 32px}
.top .bar{padding-top:14px;display:flex;gap:16px;align-items:baseline}
.top .bar b{font:600 16px var(--serif)}
.top .bar span{font-size:13px;color:var(--ink3)}
nav{display:flex;margin-top:10px}
nav button{flex:1;border:0;border-bottom:2px solid transparent;background:none;font:inherit;font-size:14px;color:var(--ink3);cursor:pointer;padding:6px 0 10px;text-align:left}
nav button small{display:block;font-size:11px}
nav button:hover{color:var(--ink)}
nav button.on{color:var(--ink);border-color:var(--ink);font-weight:600}
.stage{flex:1;overflow:auto}
.page{padding-top:36px;padding-bottom:48px}
h1{font:600 28px/1.3 var(--serif);margin:0 0 8px}
.what{font-size:16px;color:var(--ink2);max-width:46em;margin:0 0 6px}
.io{font-size:14px;color:var(--ink3);margin:0 0 32px}
h3{font-size:14px;font-weight:600;color:var(--ink2);margin:32px 0 10px}
dl.kv{display:grid;grid-template-columns:140px 1fr;gap:10px 20px;margin:0}
dl.kv dt{color:var(--ink3)}dl.kv dd{margin:0}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;vertical-align:top;padding:9px 16px 9px 0;border-bottom:1px solid var(--line)}
th{font-weight:500;color:var(--ink3);font-size:13px;white-space:nowrap}
td.n{white-space:nowrap;color:var(--ink3)}
tr.dim td{color:var(--ink3)}
details{margin-top:28px}
summary{cursor:pointer;color:var(--ink3);font-size:14px}
summary:hover{color:var(--accent)}
pre{background:var(--soft);border-radius:8px;padding:12px;font:12px/1.6 ui-monospace,Menlo,monospace;white-space:pre-wrap;word-break:break-word;max-height:60vh;overflow:auto}
.checks{margin-top:32px;padding-top:16px;border-top:1px solid var(--line);font-size:14px}
.checks .bad{color:var(--warn)}
.checks ul{list-style:none;margin:6px 0 0;padding:0}
/* 方向 */
.dirs{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.dir{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:20px}
.dir.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.dir .kind{font-size:13px;color:var(--ink3);display:flex;justify-content:space-between}
.dir.sel .kind b{color:var(--accent)}
.dir h4{font:600 19px/1.4 var(--serif);margin:6px 0 8px}
.dir p{color:var(--ink2);margin:0 0 14px}
.dir dl{display:grid;grid-template-columns:52px 1fr;gap:6px 10px;margin:0;font-size:14px;border-top:1px solid var(--line);padding-top:12px}
.dir dt{color:var(--ink3)}.dir dd{margin:0}
.dir .bad{margin-top:12px;font-size:13px;color:var(--warn)}
/* 伏笔、正文 */
.ctx{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:20px 24px;font:16px/1.9 var(--serif);white-space:pre-line;margin-bottom:12px}
mark{background:var(--warn-soft);color:inherit;border-bottom:2px solid var(--warn)}
.reader{display:grid;grid-template-columns:180px 1fr;gap:32px;align-items:start}
.toc{position:sticky;top:0;font-size:14px}
.toc .g{font-size:12px;color:var(--ink3);margin:12px 0 4px}
.toc button{display:block;width:100%;border:0;background:none;color:var(--ink2);font:inherit;text-align:left;padding:4px 10px;border-radius:6px;cursor:pointer}
.toc button:hover{background:var(--soft)}
.toc button.on{background:var(--ink);color:var(--paper)}
.toc button[disabled]{opacity:.4;cursor:default;background:none}
.sheet{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:40px 52px}
.sheet .meta{font-size:13px;color:var(--ink3);margin-bottom:24px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.sheet .meta .bad{color:var(--warn)}
.prose{font:17px/2 var(--serif);max-width:34em}
.prose p{margin:0 0 .9em}
.foot{flex:none;border-top:1px solid var(--line);background:var(--paper)}
.foot .in{display:flex;justify-content:space-between;padding-top:10px;padding-bottom:10px}
.foot button{border:0;background:none;font:inherit;font-size:14px;color:var(--ink2);cursor:pointer}
.foot button:hover{color:var(--accent)}
.foot button[disabled]{visibility:hidden}
</style>
</head>

<script>
const D={"s0_input": {"stage": "S0 输入与形式基线", "book": "01_穿成全网群嘲明星，看我大心脏力挽狂澜.txt", "title": "穿成全网群嘲明星，看我大心脏力挽狂澜", "config": {"target_words": 20000, "free_chapters": 4, "tags": "无", "direction": "steady", "editor_note": "无", "models": {"s1": "deepseek/deepseek-chat-v3.1", "s2": "deepseek/deepseek-chat-v3.1", "s3": "deepseek/deepseek-chat-v3.1", "s4": "deepseek/deepseek-chat-v3.1", "s5a": "deepseek/deepseek-chat-v3.1", "s5b": "deepseek/deepseek-chat-v3.1"}}, "baseline": {"chapters": [{"words": 1228, "dialogue_ratio": 0.233, "para_avg": 17.3, "last_line": "这分明就是几张不同照片强行拼接出来的工业垃圾。", "ends_with_dialogue": false, "index": 1}, {"words": 811, "dialogue_ratio": 0.228, "para_avg": 18.9, "last_line": "“明天医院里的老太太，可能会不小心刷到一些很有意思的新闻。”", "ends_with_dialogue": true, "index": 2}, {"words": 1054, "dialogue_ratio": 0.242, "para_avg": 18.2, "last_line": "我将胸针别在黑色风衣的暗褶处，开车去了夜色。", "ends_with_dialogue": false, "index": 3}, {"words": 998, "dialogue_ratio": 0.314, "para_avg": 17.2, "last_line": "“你还是准备好，担心担心你自己吧。”", "ends_with_dialogue": true, "index": 4}, {"words": 938, "dialogue_ratio": 0.253, "para_avg": 17.7, "last_line": "三封加密邮件，滑入了三家深度调查媒体主编的收件箱。", "ends_with_dialogue": false, "index": 5}, {"words": 1004, "dialogue_ratio": 0.137, "para_avg": 22.8, "last_line": "我盯着这条热搜，眼睛微微眯起。", "ends_with_dialogue": false, "index": 6}, {"words": 1146, "dialogue_ratio": 0.352, "para_avg": 19.4, "last_line": "来电显示，居然是严寒本人。", "ends_with_dialogue": false, "index": 7}, {"words": 1018, "dialogue_ratio": 0.126, "para_avg": 18.2, "last_line": "“你现在立刻来一趟医院，你奶奶她……”", "ends_with_dialogue": true, "index": 8}, {"words": 898, "dialogue_ratio": 0.081, "para_avg": 21.4, "last_line": "“你不是我的栀栀……对不对？”", "ends_with_dialogue": true, "index": 9}, {"words": 1058, "dialogue_ratio": 0.237, "para_avg": 18.2, "last_line": "我转过身，大步向着光亮处走去，再也没有回头。", "ends_with_dialogue": false, "index": 10}], "total_words": 10153, "median_words": 1011, "dialogue_ratio": 0.223, "para_avg": 18.7, "pov": "第一人称"}}, "s1_understand": {"stage": "S1 原文理解", "prompt_name": "s1_understand", "prompt_version": "2026-10-28.demo.1", "model": "deepseek/deepseek-chat-v3.1", "temperature": 0.3, "prompt": "# 角色\n你是中文短篇网文平台的资深责编，擅长拆解短篇的类型、读者情绪、事件结构和可续写空间。\n\n# 背景\n这篇短篇约一万字，已经写完结局。后续会保留前面一部分原文，删掉结尾部分，再续写约两万字，成品约三万字，一次性投放给新读者。你的分析是后续选切点、设计续写方向、排大纲的唯一依据，所以要准确、具体、有原文依据，不要套话。\n\n所有\"位置\"都用章号（chapters 里的 index）表示。\n\n# 强度标尺\n本文所有 strength 都用同一把尺，一本书可以有多个 5：\n- 5：改变主角命运，或主要反派彻底出局，或核心身份、核心真相揭晓\n- 4：主要反派遭受重大损失，或关键关系定局（决裂、相认、表白）\n- 3：次要反派出局，或一次完整的当众打脸\n- 2：局部小胜，或一次明显的情绪波动\n- 1：铺垫性的小爽点\n\n# 任务\n通读全部原文，完成以下分析。\n\n## 1. 类型契约 genre_contract\n- genre：具体类型，例如\"穿越·娱乐圈·技术流打脸复仇\"\"婚恋背叛·追妻火葬场\"。不要只写\"爽文\"。\n- mood：爽文 / 虐文 / 甜宠 / 其他，选一个。\n- core_emotion：读者追看的核心情绪，一句话。例如\"看女主替原身把害她的人一个个打脸清算\"。\n- reader_expectations：读者期待看到的 3～5 件事。\n- villain_fate_expected：读者期待反派最终落到什么下场；villain_fate_actual：原作实际给到了什么程度。没有反派写\"无\"。\n- forbidden_drifts：续写绝对不能滑向的走向，至少 4 条。必须包含与本类型冲突的走向，例如把复仇写成和解、把爽文写成女性自我成长、让反派洗白、让坏人一出场就认错、换成另一种情绪基调。\n- tag_conflict：如果 tags（文纲标签）和你的判断不一致，写出不一致之处；一致或没有标签则留空。\n\n## 2. 事件结构 event_structure\n- big_events：跨章的大事件。每个写 id（E1、E2……）、name、chapters（起止章号，如 [1,2]）、summary、function（开局受压 / 蓄力 / 反击 / 高潮 / 收尾 / 情感落点 等）。\n- chapters：逐章写 small_events（这一章里发生的小事件，每条一句话；一个小事件 = 在一个场景里，有明确参与者，发生了一件推动剧情的事。同一场景里有重要人物进场、局面改变，算新事件）和 ending（章尾落在哪：type 为 event / dialogue / reflection，content 为章尾那一句或那一刻）。\n\n## 3. 高光与低谷\n- highlights：按章号列出原作中让读者情绪达到峰值的段落。每条写 id（H1、H2……）、chapter、kind（payoff 爽点兑现 / emotion 情感高光 / twist 反转或揭秘）、content（具体到人物和事件）、strength。不要只盯爽点，被亲人认出身份、\"原来是将计就计\"这类同样是高光。\n- low_points：主角受辱、亲人遇险这类情绪低谷，写 chapter、content、duration_chapters（从受压到翻盘持续几章）。\n\n## 4. 门关上 door_closed_after\n故事宣告\"一切尘埃落定\"的那一章：主要矛盾解决，主角不再有迫切欲望，反派已经出局。写 chapter 和 reason。\n\n## 5. 剩余势能 potentials\n原作里还能支撑新冲突的素材。只从以下五类中找，每条必须有原文依据，找不到依据的不要写：\n- loose_villain：没受到足够惩罚、或惩罚没写透的反派和帮凶\n- unfulfilled_threat：说过但没兑现的狠话、威胁\n- unused_setup：埋了没用完的设定、身份、道具、秘密，包括原文没解答的谜团\n- undeveloped_character：提到过但没展开的人物\n- protagonist_weakness：主角的软肋或把柄，例如在乎的人、自身的违规行为、不能暴露的秘密\n每条写 id（P1、P2……）、kind、content、evid "index\": 2,\n  \"words\": 811,\n  \"text\": \"有了结论，我开始溯源。\\n顺着首发这些黑图的几个匿名爆料账号，\\n我搭建了一个数据爬虫，追踪他们的转发层级和IP地址。\\n不出所料，这批营销号常年抱团，互相点赞转发形成矩阵。\\n我沿着网络节点的资金流向一路扒到底，\\n屏幕上最终跳出了一家注册在海外的空壳公关公司。\\n而这家公司的实际控股人，叫严寒\\n严总？\\n说的难道就是他？\\n我黑进原主的网银和医保系统，调出近五年的消费和就医流水。\\n账单干干净净，只有基本生活开销和每月汇往医院的大额医药费。\\n我正整理着数据，微博后台疯狂弹窗。\\n对家小花苏菲刚发了一条新动态：\\n“纯天然才经得起大荧幕的考验，奉劝某些人别把心思动在歪门邪道上。”\\n配图是她在健身房的自拍。\\n这条微博被水军顶上了热门。\\n紧接着，苏菲的私信跳了出来：\\n“许栀，被万人唾骂的滋味好受吗？”\\n“严总早说过，不识抬举就是这个下场。”\\n“你现在跪下来求我也没用了。”\\n我扯了扯嘴角，截下这条私信存进加密文件夹。\\n手机再次震动，是中心医院的王医生发来的信息。\\n“许小姐，奶奶今天精神不错，血压平稳。”\\n“网上的事我们都瞒着她，病房里没让她接触手机。”\\n“你放心处理工作，别太有压力。”\\n看着屏幕上的字，原主残留的情绪涌上心头，眼眶泛起一阵酸涩。\\n我深吸一口气，回复道：\\n“谢谢王医生。”\\n我转身拉开抽屉，翻出了一只带锁的铁盒。\\n用螺丝刀暴力撬开，里面是一本日记和一堆医院的催缴单。\\n一页页翻看，原主短暂而痛苦的一生在我面前展开：\\n她是个孤儿，奶奶是她在这世上唯一的亲人。\\n为了支付奶奶高昂的靶向药费用，她才咬牙签了公司进娱乐圈。\\n她拼命接戏，连轴转跑通告，\\n却不想，被资本大佬严寒盯上了。\\n严寒看中了她的清纯，提出包养。\\n原主严词拒绝，换来的却是被恶意造谣。\\n这个傻姑娘扛下了所有的脏水，直到心理防线崩溃。\\n我合上日记本，目光落在电脑屏幕上严寒的名字上。\\n桌上的手机亮起，一条没有署名的短信跳入眼帘：\\n“许栀，你的时间不多了。”\\n“如果你还继续头铁……”\\n“明天医院里的老太太，可能会不小心刷到一些很有意思的新闻。”\"\n },\n {\n  \"index\": 3,\n  \"words\": 1054,\n  \"text\": \"我在论坛接了两个高薪加急的代码修补单。\\n拿到虚拟币酬金后，我迅速变现，\\n连同原主卡里剩余的积蓄，全部打入了医院的对公账户。\\n这笔钱，足够一次性预付奶奶未来三十年的VIP医疗费用。\\n我拿出手机开启直播。\\n镜头亮起，凭借全网黑的热度，几万吃瓜网友涌入直播间。\\n“大家好，我是许栀。”\\n“关于网上的无端造谣，我现在要放出第一批澄清证据……”\\n我把整理好的图片造假鉴定报告举到镜头前。\\n屏幕画面突然卡顿，紧接着直接黑屏。\\n系统弹窗跳了出来：\\n【您的账号已被异地强制登录。】\\n经纪公司的动作太快了。\\n不出五分钟，微博上被水军刷起新一轮的热搜词条：\\n许栀开播作秀\\n许栀被封禁后垂死挣扎演烂戏。\\n桌上的备用手机狂震起来。\\n“许小姐，你快来医院！”\\n“刚才不知道怎么混进来了几个极端黑粉，跑到病房门口拉横幅大骂！”\\n“老太太心脏本就不好，受了刺激，已经送进急救室抢救了！”\\n王医生的声音透着焦急。\\n我心脏骤缩，抓起大衣疯了一样冲出家门。\\n冲出公寓楼的大门，黑压压的狗仔和代拍便涌了上来。\\n代拍为了博眼球，竟然把镜头压低，恶劣地往我胸前的隐私部位怼。\\n“许栀！网上说你被金主抛弃了，是真的吗？”\\n“你毁容的照片是不是真的？回应一下！”\\n“滚！”\\n我眼神一厉，拍掉面前的单反，拉开车门直奔医院。\\n急救室门外的每一分每一秒都像是在被凌迟。\\n直到四个小时后，抢救室的红灯熄灭。，\\n奶奶挺了过来。\\n我虚脱地滑坐在长椅上。\\n确认奶奶被安全转移到重症监护室后，我拖着沉重的步伐离开医院。\\n迈出医疗大楼的旋转门时，几声快门声从花坛后传来。\\n等我回到公寓，网上掀起了更加狂暴的风浪。\\n热搜榜首赫然挂着：\\n许栀现身医院，疑似刚做完修复手术\\n配图正是我脸色苍白走出医疗大楼的抓拍。\\n断章取义，指鹿为马。\\n进入客厅，执行经纪林姐正坐在我的沙发上。\\n林姐踩着高跟鞋走过来，夺过我的手机拔出电话卡，\\n当着我的面，将其折成两半扔进垃圾桶。\\n“许栀，公司已经把你所有社交账号退登并修改了密码。”\\n“这期间，你休想再上网发一个字。”\\n林姐冷笑一声，\\n“严总耐心有限。”\\n n严寒在视频那头气急败坏。\\n我挂断视频，按下桌上的遥控器，天花板四个角落的摄像头同时亮起红灯。\\n“这是我的私人云端实时同步录像。”\\n“另外，十分钟前我已经报了警。”\\n我晃了晃手机，窗外刚好传来由远及近的警笛声，\\n“要试试这钢管砸下来，你们能判几年吗？”\\n三人脸色一变，对视一眼，骂骂咧咧地夺门而逃。\\n危机解除。\\n我跨过一地狼藉，重新坐回电脑前，拨通了律师的电话。\\n“动手吧。”\\n五分钟后，一份盖着公章的律师函发送到了经纪公司高层的邮箱里。\\n除了解约声明，里面还附带了一份“大礼包”：\\n林姐知情，且纵容协助严寒潜规则旗下艺人的聊天记录和邮件往来。\\n另一边，严寒察觉到了部分证据已经开始外泄。\\n我的网络监测探针显示，各大平台的敏感词库正在被更新。\\n严寒急眼了。\\n雷霆大怒之下，他开始疯狂砸钱，动用庞大的公关力量全网删帖。\\n热搜榜上，关于他公司的词条迅速被撤下，\\n吃瓜群众发出的质疑贴不到一分钟就被删，\\n大批高级水军下场，强行把水搅浑。\\n叮的一声，严寒的短信发了过来：\\n“只要钱到位，互联网就不会有你的记忆！”\\n“你奶奶躲得过初一躲不过十五，走着瞧！”\\n看着这句狠话，我只觉得可笑。\\n我已经切断了他打探病房信息的渠道。\\n他现在的威胁，不过是落空后的无能狂怒。\\n电脑屏幕右下角，一个红色的倒计时窗口正在安静地跳动。\\n“3、2、1……”\\n进度条拉满，定时投递脚本触发成功。\\n三封加密邮件，滑入了三家深度调查媒体主编的收件箱。\"\n },\n {\n  \"index\": 6,\n  \"words\": 1004,\n  \"text\": \"这三家媒体以不畏强权、死磕真相在业内著称。\\n严寒的资本手腕能买通营销号，却买不动这些真正的新闻人。\\n两小时后，早上八点整，早高峰通勤的节点。\\n原本被严寒水军搅得乌烟瘴气的社交平台，撕开了一道口子。\\n没有预热，没有娱乐圈惯用的八卦噱头，\\n三家深度调查媒体全网同步推送了一篇万字长文。\\n标题字字见血：\\n《赛博猎巫的背后：资本胁迫、技术造假与一场完美的网络谋杀》。\\n文章开篇，甩出了我那份长达三十页的图像技术鉴定报告。\\n作为资深码农，我给出的证据链是降维打击级别的。\\n报告里放大了所谓“医美现场图”的所有噪点，详细展示了ELA热力图，\\n甚至直接提取了图片底层的EXIF数据，\\n将拼接合成的操作痕迹、修改时间和部分硬件特征，展示得清清楚楚。\\n这篇报道像一枚深水炸弹，引爆了整个网络。\\n“卧槽！作为一个十年后期修图师的我头皮发麻。”\\n“这报告太硬了，这根本不是什么吃瓜，这是高技术犯罪啊！”\\n“看懂了，图片是P的，就医记录是假的，连所谓的知情人士是虚拟账号。”\\n“我去，我们全被当枪使了！”\\n“细思极恐……如果许栀拿不出这份报告，她现在是不是已经被逼上绝路了？”\\n风向变了。\\n原本满屏的荡妇羞辱和谩骂，转变成了对资本只手遮天的恐惧与愤怒。\\n这不再是一桩茶余饭后的戏子黑料，\\n而是被严肃定性为一桩涉及资本胁迫的网络暴力案件。\\n那些原本跟着带节奏的大V们悄悄删除微博，理智的路人成批觉醒。\\n严寒慌了。\\n后台监测仪上，我看到大量异常流量正在冲击这三家媒体的服务器。\\n严寒的水军涌入评论区，试图用以往那种胡搅蛮缠的方式把水再次搅浑。\\n他甚至动用了最高级别的公关预案，试图花重金强行撤掉热搜词条。\\n但这次，他踢到了铁板。\\n这三家硬核媒体背后，是坚不可摧的公信力和新闻底线。\\n严寒的团队绝望地发现，他们的资本权限在这里根本不管用。\\n不仅文章删不掉，反而因为短时间内触发了平台的异常压制机制，\\n被系统判定为重大社会事件，强推上了各大首页的置顶位，全网飘红。\\n真相如同决堤的洪水，势不可挡。\\n我坐在电脑前，看着数据监控面板。\\n代表“许栀澄清”、“资本网暴”的词条指数正在呈指数级狂飙，\\n而严寒关联实业公司的网络风评和股市预期，则断崖式暴跌。\\n局势逆转，一切都在计算之中。\\n我正准备关掉网页，去医院看望奶奶，\\n电脑屏幕右下角的监控雷达突然发出一声尖锐的红色警报。\\n一条全新的词条，突破了媒体的封锁，空降热搜榜第一。\\n词条后面，跟着一个刺眼的的深红色“爆”字。\\n许栀主动投怀送抱，会所监控流出\\n我盯着这条热搜，眼睛微微眯起。\"\n },\n {\n  \"index\": 7,\n  \"words\": 1146,\n  \"text\": \"鼠标点开那个刺目的“爆”字。\\n屏幕上弹出一段三十秒的无声监控视频。\\n画面正是我昨晚走进那家私人会所包厢的场景。\\n因为角度刁钻，视频里的我 \\n不过半天时间，她代言的五个高奢品牌排队宣布解约，\\n即将进组的S级大剧也光速换人。\\n紧接着，官方重拳出击。\\n各大平台开始大批量封禁涉事的营销号和水军账号，\\n那几个常年抱团收钱带节奏的水军头子，更是被通报立案调查。\\n网上的妖风，终于被荡平了。\\n“叮咚。”\\n电脑右下角弹出一封新邮件。\\n是经纪公司发来的。\\n面对全网的口诛笔伐和可能面临的刑事连带责任，公司高层怂了。\\n他们不仅在官微上发布了盖着公章的致歉信，\\n把责任全推给了执行经纪林姐，\\n还随信附上了一份无条件解约协议书。\\n没有千万违约金，没有任何附加条款，\\n他们现在只想赶紧把我这个能把天捅破的活阎王送走，撇清干系。\\n我下载了PDF，签上大名，按下了发送键。\\n压在原主身上的大山，终于被我掀翻了。\\n我长舒了一口气，想站起身活动一下僵硬的脖颈，\\n桌上的手机发出震动声。\\n来电显示，是我给奶奶安排的那家医院的高级安保病房。\\n我的心揪紧，抓起手机按下接听键。\\n“许小姐，”\\n电话那头，主治医生声音里透着急促，\\n“你现在立刻来一趟医院，你奶奶她……”\"\n },\n {\n  \"index\": 9,\n  \"words\": 898,\n  \"text\": \"我抓起车钥匙冲出家门，开车去往医院。\\n一路山，脑子里回荡着医生电话里那句没说完的话。\\n半小时后，我撞开病房外侧的隔离门。\\n“许小姐，你别急。”\\n主治医生见我满头大汗，立刻迎上来，\\n“是好事。”\\n“老太太醒了，各项生命体征不仅稳定下来，精神状态还罕见的好。”\\n“就是她刚睁眼，闹着要马上见你。”\\n我绷紧的神经松开，后背渗出冷汗。\\n隔着玻璃确认奶奶安稳睡下后，我才驱车回家。\\n推开公寓门，屋子里依然是令人窒息的昏暗。\\n我走到落地窗前，双手攥住那扇原主从不敢碰的遮光窗帘，用力向两边一拉。\\n刺眼的阳光涌入，将整个客厅照得透亮。\\n我微微眯起眼睛，低头俯视楼下。\\n那些曾经像苍蝇一样二十四小时蹲守的狗仔车，早就跑得干干净净。\\n严寒倒台，资本的赏金断了，再也没人敢来招惹我这块硬骨头。\\n脱离了原经纪公司，我自己搭建了个人工作室的工作邮箱。\\n此刻，收件箱里正不断涌入新的工作邀约。\\n娱乐圈是个最现实的名利场，但也最慕强。\\n圈内人都看懂了整场风暴的始末，我宁死不屈的做派，反倒成了最好的名片。\\n那些真正想做内容的导演和制片人，纷纷向我抛来了橄榄枝。\\n我坐在电脑前，写了个筛选脚本，把那些带有附加条款的流水线剧本拦截。\\n我没有选择借着这波热度去接最容易爆火的流量剧。\\n比起大红大紫，原主缺的是真正能站得住脚的底气。\\n我挑了一个现实主义题材的悬疑本子，\\n角色是个外表冷漠，却逻辑缜密的反杀者。\\n接下来的大半年，我从热搜上销声匿迹，一头扎进实景剧组。\\n我拆解人物的每一个微表情，用反侦察的思维去重塑角色的行为动机。\\n不用应酬，我只用纯粹的作品说话。\\n电影公映后，我那个灰头土脸却极具张力的角色，\\n获得了全网影评人铺天盖地的好评。\\n我终于把贴在原主身上的废柴花瓶标签撕得粉碎。\\n一切都在按部就班地变好。\\n这天下午，我抱着一束康乃馨推开病房的门，准备把新电影杀青的消息告诉奶奶。\\n可脚步我的刚迈进病房，病床旁那台心电监护仪，发出刺耳的长鸣。\\n屏幕上的波浪线骤然变平，数值正在以肉眼可见的速度下跌。\\n而病床上的奶奶，却在这濒死的警报声中，缓慢地转过头。\\n那双常年浑浊的眼睛里，此刻竟透着一股令人心悸的清明。\\n她干枯的手指缓缓抬起，抓住了我的手腕。\\n“孩子……”\\n她气若游丝，\\n“你不是我的栀栀……对不对？”\"\n },\n {\n  \"index\": 10,\n  \"words\": 1058,\n  \"text\": \"我浑身一僵，原本要按呼叫铃的手悬在半空。\\n病房里只有监护仪尖锐的长鸣在回荡。\\n我定在原地，嗓子眼像是被塞了一团粗糙的干海绵。\\n我想扯出一个笑脸，用原主的语气糊弄过去，\\n可对上奶奶那双突然褪去浑浊的眼睛时，我一个字也编不出来。\\n回光返照。\\n我脑子里只剩下这四个字。\\n“我……”\\n我张了张嘴，声音沙哑。\\n奶奶干枯的手指摩挲着我的脉搏，嘴角扯出一抹释然的笑意。\\n她摇了摇头，制止了我的辩解。\\n“别怕，好孩子。”\\n她喘息着，每一个字都说得很慢，\\n“我的栀栀，从小就软弱，她斗不过那些吃人的野兽。”\\n“你跟她不一样，你骨头硬，眼里有刀子。”\\n眼眶毫无预兆地酸涩起来。\\n我咬住下唇，任由眼泪砸在白色的床单上。\\n“我知道她不在了。”\\n奶奶浑浊的眼底泛起泪光，\\n“可你替她守住了干净，你把那些泼在她身上的脏水全洗掉了。”\\n“你还护着我这个没用的老太婆活到了今天。”\\n“你一定吃了很多苦吧，替我们去拼命……”\\n奶奶的手指渐渐失去了力气，从我的手腕上滑落。\\n我反手握住她冰凉的手，拼命摇头。\\n“谢谢你啊，孩子。”\\n“你是个好姑娘，你要好好活着。”\\n她的视线越过我看向虚空，眼神变得无比温柔，\\n“但我得走了。”\\n“我的栀栀胆子小，一个人在下面会害怕的，我得去找她了……”\\n话音未落，她胸口的起伏归于平息。\\n心电监护仪上的波浪线变成了一条刺直线。\\n长鸣声刺破了病房的死寂，医生和护士冲了进来。\\n我松开手，安静地退到角落。\\n她撑着最后一口气，只是为了亲口对我说一声谢谢。\\n三天后，我替奶奶办了葬礼。\\n我谢绝了所有媒体的采访，也没通知圈内那些见风使舵的同行，\\n我选了郊区一处最安静的墓园。\\n天空飘着细碎的秋雨，我穿着一身黑色的风衣，\\n撑着黑伞，独自站在墓碑前。\\n我弯下腰，将怀里的两束纯白色的雏菊，放在了黑色大理石上。\\n一束，给这位善良坚韧，为了孙女倾尽所有的老人。\\n另一束，给那个在宁死也不肯向资本恶势力低头的清白女孩。\\n“奶奶，许栀，恶人都已经付出了代价，你们在这边不用再担惊受怕了。”\\n我蹲下身，伸手擦去墓碑照片上的雨水。\\n照片里的老人笑得很慈祥。\\n风吹过墓园，卷起几片金黄的落叶。\\n我站起身，深吸了一口带着泥土腥气的空气。\\n那个为了碎银几两在工位上猝死的码农，\\n和被全网网暴逼上绝路的明星许栀，\\n在这一刻，命运终于完成了交接与和解。\\n我替她讨回了公道，替她尽了孝，替她扫平了所有的障碍。\\n“放心吧。”\\n我看着并排摆放的两束雏菊，在心里默默许下承诺，\\n“我会替你在这个世界，堂堂正正地活下去。”\\n“连带着你们那一份，好好看看这大千世界。”\\n雨停了。\\n厚重的云层被撕开一道口子，阳光倾泻而下，照亮了下山的路。\\n我转过身，大步向着光亮处走去，再也没有回头。\"\n }\n]\n\n# 输出\n只输出一个 JSON 对象，不要输出任何其他文字。结构如下：\n{\n  \"synopsis\": \"\",\n  \"genre_contract\": {\"genre\": \"\", \"mood\": \"\", \"core_emotion\": \"\", \"reader_expectations\": [\"\"], \"villain_fate_expected\": \"\", \"villain_fate_actual\": \"\", \"forbidden_drifts\": [\"\"], \"tag_conflict\": \"\"},\n  \"event_structure\": {\n    \"big_events\": [{\"id\": \"E1\", \"name\": \"\", \"chapters\": [1, 2], \"summary\": \"\", \"function\": \"\"}],\n    \"chapters\": [{\"index\": 1, \"small_events\": [\"\"], \"ending\": {\"type\": \"event\", \"content\": \"\"}}]\n  },\n  \"highlights\": [{\"id\": \"H1\", \"chapter\": 1, \"kind\": \"payoff\", \"content\": \"\", \"strength\": 3}],\n  \"low_points\": [{\"chapter\": 1, \"content\": \"\", \"duration_chapters\": 1}],\n  \"door_closed_after\": {\"chapter\": 1, \"reason\": \"\"},\n  \"potentials\": [{\"id\": \"P1\", \"kind\": \"loose_villain\", \"content\": \"\", \"evidence\": \"\", \"evidence_chapter\": 1, \"strength\": 3}],\n  \"characters\": [{\"name\": \"\", \"role\": \"\", \"traits\": [{\"trait\": \"\", \"evidence_chapter\": 1}], \"fate\": \"\"}],\n  \"tone_anchors  9\n    }\n   ],\n   \"fate\": \"安详离世，临终识破主角穿越真相\"\n  },\n  {\n   \"name\": \"林姐\",\n   \"role\": \"执行经纪/帮凶\",\n   \"traits\": [\n    {\n     \"trait\": \"服从公司压迫艺人\",\n     \"evidence_chapter\": 3\n    },\n    {\n     \"trait\": \"威胁折毁电话卡\",\n     \"evidence_chapter\": 3\n    }\n   ],\n   \"fate\": \"被公司推卸责任，未明确个人结局\"\n  },\n  {\n   \"name\": \"苏菲\",\n   \"role\": \"对家小花/帮凶\",\n   \"traits\": [\n    {\n     \"trait\": \"买水军黑主角\",\n     \"evidence_chapter\": 8\n    },\n    {\n     \"trait\": \"发文内涵主角\",\n     \"evidence_chapter\": 2\n    }\n   ],\n   \"fate\": \"人设崩塌，代言解约，剧组换人\"\n  }\n ],\n \"tone_anchors\": [\n  {\n   \"chapter\": 1,\n   \"kind\": \"反派嘴脸\",\n   \"quote\": \"公司暂时不打算澄清，但你得先装死一段时间\"\n  },\n  {\n   \"chapter\": 2,\n   \"kind\": \"威胁\",\n   \"quote\": \"明天医院里的老太太，可能会不小心刷到一些很有意思的新闻\"\n  },\n  {\n   \"chapter\": 4,\n   \"kind\": \"反派嘴脸\",\n   \"quote\": \"只要你今晚留下，所有的黑料我十分钟内就能让它们消失\"\n  },\n  {\n   \"chapter\": 5,\n   \"kind\": \"狠话\",\n   \"quote\": \"你奶奶躲得过初一躲不过十五，走着瞧\"\n  },\n  {\n   \"chapter\": 7,\n   \"kind\": \"打脸\",\n   \"quote\": \"这段录音，我已经同步发给了警方\"\n  },\n  {\n   \"chapter\": 8,\n   \"kind\": \"打脸\",\n   \"quote\": \"我不和涉嫌敲诈勒索的犯罪嫌疑人对话\"\n  }\n ]\n}\n原文 chapters：\n[\n {\n  \"index\": 1,\n  \"words\": 1228,\n  \"text\": \"上一秒，我还在公司厕所摸鱼，\\n吃全网路人缘最差女明星许栀的瓜。\\n某知名医疗机构工作人员甩出内部病历，\\n爆料她偷偷隆胸，却因医疗事故导致胸部坏死。\\n热搜瞬间爆了，评论区全在群嘲：\\n“报应！”\\n“假货终于翻车！花瓶连最后一点优势都没了。”\\n我刚点完赞，\\n下一秒便躺进豪华公寓的浴缸，成了许栀本人。\\n低头一看，曲线天生，皮肤完整，\\n别说坏死，连个针眼都没有。\\n手机忽然弹出经纪人的消息：\\n“公司暂时不打算澄清，但你得先装死一段时间，误工费公司会赔给你。”\\n“一直联系不到你，我很担心。”\\n“栀栀，千万别做傻事，先在家休息。”\\n作为连续加班三个月、凌晨两点还在改漏洞的码农，\\n我盯着“在家休息”四个字，差点笑出声。\\n这不就是带薪休假吗？\\n我立刻点了炸鸡奶茶，准备先睡个三天三夜。\\n可外卖还没到，邮箱便收到一份匿名文件，\\n所谓内部病历的创建时间，竟在爆料之后。\\n巧了，查数据、抓漏洞、锤造假，\\n都是我的老本行。\\n胃里一阵绞痛，我睁开眼干呕。\\n手边碰倒了几个空酒瓶，\\n滚到角落撞上一堆安眠药空壳。\\n原身脑海里残留的绝望情绪，压得我喘不过气。\\n摔在一旁的手机屏幕亮起，\\n满屏都是污言秽语的私信和热搜推送。\\n手指滑动，\\n在热搜榜最底部的一个不起眼角落，\\n我看到了那条简短的新闻：\\n【某互联网大厂30岁女程序员连续加班48小时后，猝死工位。】\\n真讽刺。\\n我拿命拼搏换来一句无人问津的猝死。\\n回想穿越前，我刷到过原主的热搜。\\n当时为了发泄工作压力，我也曾跟风敲下过一行字：\\n“说实在的，她演技确实不行，看几集给我看力竭了。”\\n一想到这，\\n我将地上的药瓶和酒瓶扫进垃圾袋，扎紧袋口。\\n我走到窗前，刚将厚重的遮光窗帘拉开一条缝隙。\\n“咔嚓！咔嚓咔嚓！”\\n楼下灌木丛里亮起几道刺眼的闪光灯，几名长焦镜头正对准我的窗口。\\n我反手将窗帘重新拉上。\\n真是好大的阵仗。\\n手机震动起来，是执行经纪林姐发来的语音，\\n“许栀，你给我老实待在家里，外面全是狗仔！”\\n“现在网上的舆论你别看，公司决定冷处理。”\\n“黑红也是红，等风头过去，咱们直接变现涨粉。”\\n紧接着，第二条语音弹了出来：\\n“你也别倔了，胳膊拧不过大腿。”\\n“严总那边我帮你递了话，只要你今晚去服个软，热搜明天就能撤干净。”\\n严总？\\n我揉了揉发酸的手腕，手指飞快地在屏幕上敲击：\\n“不可能。”\\n林姐那边显示“正在输入中”。\\n我没等她发难，又发了一条指令过去：\\n“通知工作室，停止现在的无脑沉默。”\\n“第二，不要雇水军控评。”\\n“第三，绝不允许发任何模棱两可的道歉声明。”\\n对面停顿了足足五分钟，没再回复\\n我坐到书桌前，掀开笔记本电脑，熟练地切入后台。\\n全网疯传的那组“许栀整容实锤图”被推上了好几个热搜位。\\n作为一个资深码农，我排查过无数bug，这种图片在我眼里简直漏洞百出。\\n我写了几行脚本，把热传的图片批量抓取下来，拖进图像分析工具里。\\n鼠标滑过，数值不断跳动。\\n我盯着屏幕：\\n发现图片的曝光数据和光影折射存在明显的断层。\\n放大到像素级，下颌角的边缘被强行做了平滑处理。\\n最可笑的是背景，手术台和无影灯的透视比例完全失调。\\n这分明就是几张不同照片强行拼接出来的工业垃圾。\"\n },\n {\n  \"index\": 2,\n  \"words\": 811,\n  \"text\": \"有了结论，我开始溯源。\\n顺着首发这些黑图的几个匿名爆料账号，\\n我搭建了一个数据爬虫，追踪他们的转发层级和IP地址。\\n不出所料，这批营销号常年抱团，互相点赞转发形成矩阵。\\n我沿着网络节点的资金流向一路扒到底，\\n屏幕上最终跳出了一家注册在海外的空壳公关公司。\\n而这家公司的实际控股人，叫严寒\\n严总？\\n说的难道就是他？\\n我黑进原主的网银和医保系统，调出近五年的消费和就医流水。\\n账单干干净净，只有基本生活开销和每月汇往医院的大额医药费。\\n我正整理着数据，微博后台疯狂弹窗。\\n对家小花苏菲刚发了一条新动态：\\n“纯天然才经得起大荧幕的考验，奉劝某些人别把心思动在歪门邪道上。”\\n配图是她在健身房的自拍。\\n这条微博被水军顶上了热门。\\n紧接着，苏菲的私信跳了出来：\\n“许栀，被万人唾骂的滋味好受吗？”\\n“严总早说过，不识抬举就是这个下场。”\\n“你现在跪下来求我也没用了。”\\n我扯了扯嘴角，截下这条私信存进加密文件夹。\\n手机再次震动，是中心医院的王医生发来的信息。\\n“许小姐，奶奶今天精神不错，血压平稳。”\\n“网上的事我们都瞒着她，病房里没让她接触手机。”\\n“你放心处理工作，别太有压力。”\\n看着屏幕上的字，原主残留的情绪涌上心头，眼眶泛起一阵酸涩。\\n我深吸一口气，回复道：\\n“谢谢王医生。”\\n我转身拉开抽屉，翻出了一只带锁的铁盒。\\n用螺丝刀暴力撬开，里面是一本日记和一堆医院的催缴单。\\n一页页翻看，原主短暂而痛苦的一生在我面前展开：\\n她是个孤儿，奶奶是她在这世上唯一的亲人。\\n为了支付奶奶高昂的靶向药费用，她才咬牙签了公司进娱乐圈。\\n她拼命接戏，连轴转跑通告，\\n却不想，被资本大佬严寒盯上了。\\n严寒看中了她的清纯，提出包养。\\n原主严词拒绝，换来的却是被恶意造谣。\\n这个傻姑娘扛下了所有的脏水，直到心理防线崩溃。\\n我合上日记本，目光落在电脑屏幕上严寒的名字上。\\n桌上的手机亮起，一条没有署名的短信跳入眼帘：\\n“许栀，你的时间不多了。”\\n“如果你还继续头铁……”\\n“明天医院里的老太太，可能会不小心刷到一些很有意思的新闻。”\"\n },\n {\n  \"index\": 3,\n  \"words\": 1054,\n  \"text\": \"我在论坛接了两个高薪加急的代码修补单。\\n拿到虚拟币酬金后，我迅速变现，\\n连同原主卡里剩余的积蓄，全部打入了医院的对公账户。\\n这笔钱，足够一次性预付奶奶未来三十年的VIP医疗费用。\\n我拿出手机开启直播。\\n镜头亮起，凭借全网黑的热度，几万吃瓜网友涌入直播间。\\n“大家好，我是许栀。”\\n“关于网上的无端造谣，我现在要放出第一批澄清证据……”\\n我把整理好的图片造假鉴定报告举到镜头前。\\n屏幕画面突然卡顿，紧接着直接黑屏。\\n系统弹窗跳了出来：\\n【您的账号已被异地强制登录。】\\n经纪公司的动作太快了。\\n不出五分钟，微博上被水军刷起新一轮的热搜词条：\\n许栀开播作秀\\n许栀被封禁后垂死挣扎演烂戏。\\n桌上的备用手机狂震起来。\\n“许小姐，你快来医院！”\\n“刚才不知道怎么混进来了几个极端黑粉，跑到病房门口拉横幅大骂！”\\n“老太太心脏本就不好，受了刺激，已经送进急救室抢救了！”\\n王医生的声音透着焦急。\\n我心脏骤缩，抓起大衣疯了一样冲出家门。\\n冲出公寓楼的大门，黑压压的狗仔和代拍便涌了上来。\\n代拍为了博眼球，竟然把镜头压低，恶劣地往我胸前的隐私部位怼。\\n“许栀！网上说你被金主抛弃了，是真的吗？”\\n“你毁容的照片是不是真的？回应一下！”\\n“滚！”\\n我眼神一厉，拍掉面前的单反，拉开车门直奔医院。\\n急救室门外的每一分每一秒都像是在被凌迟。\\n直到四个小时后，抢救室的红灯熄灭。，\\n奶奶挺了过来。\\n我虚脱地滑坐在长椅上。\\n确认奶奶被安全转移到重症监护室后，我拖着沉重的步伐离开医院。\\n迈出医疗大楼的旋转门时，几声快门声从花坛后传来。\\n等我回到公寓，网上掀起了更加狂暴的风浪。\\n热搜榜首赫然挂着：\\n许栀现身医院，疑似刚做完修复手术\\n配图正是我脸色苍白走出医疗大楼的抓拍。\\n断章取义，指鹿为马。\\n进入客厅，执行经纪林姐正坐在我的沙发上。\\n林姐踩着高跟鞋走过来，夺过我的手机拔出电话卡，\\n当着我的面，将其折成两半扔进垃圾桶。\\n“许栀，公司已经把你所有社交账号退登并修改了密码。”\\n“这期间，你休想再上网发一个字。”\\n林姐冷笑一声，\\n“严总耐心有限。”\\n“今晚八点，夜色顶层包厢，这是你最后的机会。”\\n“如果今晚你还不识抬举，明天会发生什么，我们也不知道。”\\n林姐摔门离开，房间恢复死寂。\\n我打开电脑，连上WiFi，微信跳出一条严寒发来的语音：\\n“许栀，挣扎好玩吗？今晚打扮得漂亮点。”\\n我敲下一行字点击发送：\\n“好，今晚见。”\\n我起身走到梳妆台前，拿起原主的水钻胸针。\\n我用刀片撬开后盖，将一枚指甲盖大小的微型芯片嵌入其中。\\n这是我亲自编写的加密录音程序。\\n只要开启，音频会实时加密并同步上传至我的私有云端。\\n\\n我将胸针别在黑色风衣的暗褶处，开车去了夜色。\"\n },\n {\n  \"index\": 4,\n  \"words\": 998,\n  \"text\": \"夜色会所顶层，安保森严。\\n刚出电梯，两个穿黑西装的保镖就拦住了我。\\n“许小姐，规矩您懂。”\\n“手机交出来，例行搜身。”\\n我把手机扔进托盘，张开双臂。\\n女保镖上上下下摸索了一遍，随即放行。\\n推开包厢门，刺鼻的雪茄味扑面而来。\\n严寒坐在真皮沙发里，手里晃着半杯威士忌。\\n“终于学乖了？”\\n他拍了拍身边的空位，\\n“坐过来。”\\n我没动，站在离他三步远的地方：\\n“网上的那些黑料，你到底要怎样才肯撤掉？”\\n严寒冷笑一声：\\n“许栀，别装傻。”\\n“那几张图，还有你靠奶奶卖惨的通稿，全是我让人放出去的。”\\n“只要我一句话，水军立刻停手，你奶奶也能在医院睡个安稳觉。”\\n“所以，这一切都是你逼我就范的手段？”\\n我暗中调整站姿，确保胸针的麦克风孔正对他。\\n“不然呢？”\\n他站起身，步步逼近，\\n“在这个圈子里，没有我的点头，你寸步难行。”\\n“陪我，是你唯一的出路。”\\n“只要你乖乖听话，昨天的黑热搜，明天就能变成洗白通稿。”\\n他走到我面前，伸手摸向我的脸。\\n我侧身抄起桌上的冰水，假装手滑泼在了他的高定西裤上。\\n“严总，抱歉。”\\n我后退两步，迅速拉开安全距离，\\n“这件事太突然了，我需要一晚上的时间考虑。”\\n严寒脸色铁青，眼中戾气翻涌。\\n但他似乎很享受这种猫捉老鼠的掌控感，拿过纸巾擦了擦手。\\n“行，我给你一晚上。”\\n“明天早上，我要听到你的回复。”\\n“否则，你知道我的手段。”\\n回到公寓，我反锁房门，打开电脑。\\n切入私有云端，刚才那段长达十五分钟的对话音频已经躺在加密区。\\n我敲击键盘输入密钥，将乱码解码为清晰的音频文件。\\n接着，我翻出原主之前备份的早期威胁短信截图。\\n我明白，利用主流网站揭露这些行不通，\\n那我只好采取些非常手段。\\n为了避开经纪公司的网络监控，我从口袋里摸出一张电话卡。\\n这是今天去医院时，我趁乱从奶奶的旧手机里拔出来的。\\n插卡，联网。\\n我切入暗网，购买了三个境外的僵尸网络节点作跳板，\\n将音频和短信截图，连同图片造假鉴定报告进行多重加密打包。\\n一份通过内网通道直达网信办举报中心；\\n一份发给早已拟定好合同的顶尖 : 1018,\n  \"text\": \"严寒的ID在几百万人的注视下显得格外刺眼。\\n弹幕已经疯了，都在刷屏催我接通，所有人都想看资本大佬在线翻车。\\n我冷笑一声，鼠标挪到红色的拒绝键上按下。\\n“不好意思，我不和涉嫌敲诈勒索的犯罪嫌疑人对话。”\\n我直视着镜头，\\n“这段完整的未剪辑录音，以及你涉嫌伪造证据、买卖网络水军的数据链。”\\n“我已经打包发给了警方。”\\n“互联网不是法外之地，严总，留着你的话去跟警察解释吧。”\\n说完，我切断了直播。\\n屏幕黑了下去，但全网的狂欢才刚刚开始。\\n不过短短十分钟，\\n许栀绝地反击\\n严寒潜规则录音\\n几个词条空降热搜前三，庞大的流量涌入，一度让服务器宕机。\\n我敲击着键盘，屏幕上跳动着我写好的爬虫脚本抓取来的实时数据。\\n严寒名下的实业公司，首当其冲迎来了反噬。\\n舆论发酵不到两小时，几个近期签约的商业合作方，\\n吓得连夜提桶跑路，纷纷在官微上发布解约声明。\\n严氏集团的股价在开盘瞬间，一字跌停。\\n看着断崖式下跌的K线图，我顿感畅快。\\n既然他喜欢用资本压人，那就让他尝尝资本反噬的滋味。\\n但这还不算完。\\n我点开了对家小花苏菲的微博。\\n半小时前，她还在发自拍内涵我，现在评论区已经失守。\\n我没给她装死的机会。\\n之前顺着匿名账号溯源时，\\n我就截获了严寒的皮包公司给苏菲工作室打款的流水账单，\\n以及她大号切小号亲自下场买水军黑我的后台记录。\\n点击，上传，发送。\\n一个名为“苏菲女士，你的回旋镖到了”的数据包，被我扔在了各大论坛。\\n底层数据造不了假。\\n苏菲苦心经营的人淡如菊人设崩塌。\\n不过半天时间，她代言的五个高奢品牌排队宣布解约，\\n即将进组的S级大剧也光速换人。\\n紧接着，官方重拳出击。\\n各大平台开始大批量封禁涉事的营销号和水军账号，\\n那几个常年抱团收钱带节奏的水军头子，更是被通报立案调查。\\n网上的妖风，终于被荡平了。\\n“叮咚。”\\n电脑右下角弹出一封新邮件。\\n是经纪公司发来的。\\n面对全网的口诛笔伐和可能面临的刑事连带责任，公司高层怂了。\\n他们不仅在官微上发布了盖着公章的致歉信，\\n把责任全推给了执行经纪林姐，\\n还随信附上了一份无条件解约协议书。\\n没有千万违约金，没有任何附加条款，\\n他们现在只想赶紧把我这个能把天捅破的活阎王送走，撇清干系。\\n我下载了PDF，签上大名，按下了发送键。\\n压在原主身上的大山，终于被我掀翻了。\\n我长舒了一口气，想站起身活动一下僵硬的脖颈，\\n桌上的手机发出震动声。\\n来电显示，是我给奶奶安排的那家医院的高级安保病房。\\n我的心揪紧，抓起手机按下接听键。\\n“许小姐，”\\n电话那头，主治医生声音里透着急促，\\n“你现在立刻来一趟医院，你奶奶她……”\"\n },\n {\n  \"index\": 9,\n  \"words\": 898,\n  \"text\": \"我抓起车钥匙冲出家门，开车去往医院。\\n一路山，脑子里回荡着医生电话里那句没说完的话。\\n半小时后，我撞开病房外侧的隔离门。\\n“许小姐，你别急。”\\n主治医生见我满头大汗，立刻迎上来，\\n“是好事。”\\n“老太太醒了，各项生命体征不仅稳定下来，精神状态还罕见的好。”\\n“就是她刚睁眼，闹着要马上见你。”\\n我绷紧的神经松开，后背渗出冷汗。\\n隔着玻璃确认奶奶安稳睡下后，我才驱车回家。\\n推开公寓门，屋子里依然是令人窒息的昏暗。\\n我走到落地窗前，双手攥住那扇原主从不敢碰的遮光窗帘，用力向两边一拉。\\n刺眼的阳光涌入，将整个客厅照得透亮。\\n我微微眯起眼睛，低头俯视楼下。\\n那些曾经像苍蝇一样二十四小时蹲守的狗仔车，早就跑得干干净净。\\n严寒倒台，资本的赏金断了，再也没人敢来招惹我这块硬骨头。\\n脱离了原经纪公司，我自己搭建了个人工作室的工作邮箱。\\n此刻，收件箱里正不断涌入新的工作邀约。\\n娱乐圈是个最现实的名利场，但也最慕强。\\n圈内人都看懂了整场风暴的始末，我宁死不屈的做派，反倒成了最好的名片。\\n那些真正想做内容的导演和制片人，纷纷向我抛来了橄榄枝。\\n我坐在电脑前，写了个筛选脚本，把那些带有附加条款的流水线剧本拦截。\\n我没有选择借着这波热度去接最容易爆火的流量剧。\\n比起大红大紫，原主缺的是真正能站得住脚的底气。\\n我挑了一个现实主义题材的悬疑本子，\\n角色是个外表冷漠，却逻辑缜密的反杀者。\\n接下来的大半年，我从热搜上销声匿迹，一头扎进实景剧组。\\n我拆解人物的每一个微表情，用反侦察的思维去重塑角色的行为动机。\\n不用应酬，我只用纯粹的作品说话。\\n电影公映后，我那个灰头土脸却极具张力的角色，\\n获得了全网影评人铺天盖地的好评。\\n我终于把贴在原主身上的废柴花瓶标签撕得粉碎。\\n一切都在按部就班地变好。\\n这天下午，我抱着一束康乃馨推开病房的门，准备把新电影杀青的消息告诉奶奶。\\n可脚步我的刚迈进病房，病床旁那台心电监护仪，发出刺耳的长鸣。\\n屏幕上的波浪线骤然变平，数值正在以肉眼可见的速度下跌。\\n而病床上的奶奶，却在这濒死的警报声中，缓慢地转过头。\\n那双常年浑浊的眼睛里，此刻竟透着一股令人心悸的清明。\\n她干枯的手指缓缓抬起，抓住了我的手腕。\\n“孩子……”\\n她气若游丝，\\n“你不是我的栀栀……对不对？”\"\n },\n {\n  \"index\": 10,\n  \"words\": 1058,\n  \"text\": \"我浑身一僵，原本要按呼叫铃的手悬在半空。\\n病房里只有监护仪尖锐的长鸣在回荡。\\n我定在原地，嗓子眼像是被塞了一团粗糙的干海绵。\\n我想扯出一个笑脸，用原主的语气糊弄过去，\\n可对上奶奶那双突然褪去浑浊的眼睛时，我一个字也编不出来。\\n回光返照。\\n我脑子里只剩下这四个字。\\n“我……”\\n我张了张嘴，声音沙哑。\\n奶奶干枯的手指摩挲着我的脉搏，嘴角扯出一抹释然的笑意。\\n她摇了摇头，制止了我的辩解。\\n“别怕，好孩子。”\\n她喘息着，每一个字都说得很慢，\\n“我的栀栀，从小就软弱，她斗不过那些吃人的野兽。”\\n“你跟她不一样，你骨头硬，眼里有刀子。”\\n眼眶毫无预兆地酸涩起来。\\n我咬住下唇，任由眼泪砸在白色的床单上。\\n“我知道她不在了。”\\n奶奶浑浊的眼底泛起泪光，\\n“可你替她守住了干净，你把那些泼在她身上的脏水全洗掉了。”\\n“你还护着我这个没用的老太婆活到了今天。”\\n“你一定吃了很多苦吧，替我们去拼命……”\\n奶奶的手指渐渐失去了力气，从我的手腕上滑落。\\n我反手握住她冰凉的手，拼命摇头。\\n“谢谢你啊，孩子。”\\n“你是个好姑娘，你要好好活着。”\\n她的视线越过我看向虚空，眼神变得无比温柔，\\n“但我得走了。”\\n“我的栀栀胆子小，一个人在下面会害怕的，我得去找她了……”\\n话音未落，她胸口的起伏归于平息。\\n心电监护仪上的波浪线变成了一条刺直线。\\n长鸣声刺破了病房的死寂，医生和护士冲了进来。\\n我松开手，安静地退到角落。\\n她撑着最后一口气，只是为了亲口对我说一声谢谢。\\n三天后，我替奶奶办了葬礼。\\n我谢绝了所有媒体的采访，也没通知圈内那些见风使舵的同行，\\n我选了郊区一处最安静的墓园。\\n天空飘着细碎的秋雨，我穿着一身黑色的风衣，\\n撑着黑伞，独自站在墓碑前。\\n我弯下腰，将怀里的两束纯白色的雏菊，放在了黑色大理石上。\\n一束，给这位善良坚韧，为了孙女倾尽所有的老人。\\n另一束，给那个在宁死也不肯向资本恶势力低头的清白女孩。\\n“奶奶，许栀，恶人都已经付出了代价，你们在这边不用再担惊受怕了。”\\n我蹲下身，伸手擦去墓碑照片上的雨水。\\n照片里的老人笑得很慈祥。\\n风吹过墓园，卷起几片金黄的落叶。\\n我站起身，深吸了一口带着泥土腥气的空气。\\n那个为了碎银几两在工位上猝死的码农，\\n和被全网网暴逼上绝路的明星许栀，\\n在这一刻，命运终于完成了交接与和解。\\n我替她讨回了公道，替她尽了孝，替她扫平了所有的障碍。\\n“放心吧。”\\n我看着并排摆放的两束雏菊，在心里默默许下承诺，\\n“我会替你在这个世界，堂堂正正地活下去。”\\n“连带着你们那一份，好好看看这大千世界。”\\n雨停了。\\n厚重的云层被撕开一道口子，阳光倾泻而下，照亮了下山的路。\\n我转过身，大步向着光亮处走去，再也没有回头。\"\n }\n]\n\n# 输出\n只输出一个 JSON 对象，不要输出任何其他文字。每个方向分\"给编辑看\"和\"给机器用\"两部分字段，都要填写：\n{\n  \"directions\": [\n    {\n      \"strategy\": \"steady\",\n      \"title\": \"方向名，8 字以内\",\n      \"logline\": \"一句话说清这个方向\",\n      \"synopsis\": \"续写部分梗概，300～500 字\",\n      \"core_events\": [{\"name\": \"\", \"summary\": \"一两句\", \"chapters\": 4}],\n      \"new_characters\": [{\"name\": \"\", \"role\": \"\", \"potential_id\": \"P1\"}],\n      \"villain_fate\": \"\",\n      \"final_highlight\": \"\",\n      \"final_dimensions\": [\"stakes\"],\n\n      \"cut_after_chapter\": 7,\n      \"cut_reason\": \"为什么切在这里，删掉换来了什么空间\",\n      \"second_conflict\": \"第二冲突是什么、谁发起、赌注是什么\",\n      \"potential_used\": \"P1\",\n      \"highlight_ledger\": [{\"highlight_id\": \"H5\", \"treatment\": \"keep\", \"dimensions\": [], \"new_position\": \"终局\", \"how\": \"\"}],\n      \"carried_facts\": [{\"fact\": \"\", \"source_chapter\": 8, \"replant\": \"在续写前段怎么重新交代\"}],\n      \"foreshadow_backfill\": [{\"chapter\": 5, \"content\": \"要补的伏笔，一两句\", \"purpose\": \"为哪个新人物或谜团铺垫\"}],\n      \"opening\": \"续写第一章从哪个动作、对话或场面接起\",\n      \"risks\": \"这个方向最可能写坏的地方\"\n    }\n  ],\n  \"notes\": \"\"\n}", "raw": "{\n  \"directions\": [\n    {\n      \"strategy\": \"steady\",\n      \"title\": \"法律清算\",\n      \"logline\": \"严寒垂死挣扎，利用司法漏洞反咬许栀，主角用技术证据将其彻底送入监狱\",\n      \"synopsis\": \"严寒虽舆论破产但未受法律制裁，他动用残余资本力量，通过关系网给警方调查施压，并反诉许栀伪造证据、侵犯商业秘密。警方调查陷入僵局，许栀面临巨额赔偿和刑事风险。她深入挖掘严寒的海外资金流水和暗网交易记录，发现其更严重的金融犯罪和跨境洗钱证据。最终在法庭上，许栀用技术手段实时破解严寒方提供的“原始监控视频”，证明其篡改证据，并提交完整犯罪链数据包。严寒当庭被捕，被判重刑，其保护伞也被一并揪出。\",\n      \"core_events\": [\n        {\"name\": \"严寒反诉\", \"summary\": \"严寒聘请律师团反诉许栀伪造录音证据\", \"chapters\": 2},\n        {\"name\": \"调查受阻\", \"summary\": \"警方调查因证据“瑕疵”和压力陷入停滞\", \"chapters\": 2},\n        {\"name\": \"深挖罪证\", \"summary\": \"许栀追踪严寒海外资金和暗网交易，发现金融犯罪\", \"chapters\": 3},\n        {\"name\": \"法庭对决\", \"summary\": \"庭审上技术破解对方证据，提交铁证\", \"chapters\": 2},\n        {\"name\": \"终局审判\", \"summary\": \"严寒被判重刑，保护伞落网，彻底清算\", \"chapters\": 1}\n      ],\n      \"new_characters\": [\n        {\"name\": \"张法官\", \"role\": \"初期受压力影响的主审法官\", \"potential_id\": \"P1\"},\n        {\"name\": \"黑帽黑客\", \"role\": \"被严寒雇佣试图销毁证据的技术反派\", \"potential_id\": \"P4\"}\n      ],\n      \"villain_fate\": \"严寒因金融犯罪、洗钱、胁迫等数罪并罚，被判二十年有期徒刑，全部非法资产被没收；其司法保护伞也被查处。\",\n      \"final_highlight\": \"法庭上，许栀用代码实时演算，当众揭穿严寒提供的“原始监控”是二次篡改的伪证，并播放其指挥洗钱的暗网通讯录音，铁证如山，法警当场给严寒戴上手铐。\",\n      \"final_dimensions\": [\"villain_loss\", \"publicity\"],\n      \"cut_after_chapter\": 7,\n      \"cut_reason\": \"切在直播结束、严寒连麦被拒时，保留直播高潮（H5），删除原后续快速收尾和奶奶离世线，腾出空间深化法律斗争，让反派得到更彻底的惩罚。\",\n      \"second_conflict\": \"严寒发起法律反扑，指控许栀伪造证据，赌注是许栀可能面临牢狱之灾和巨额赔偿，事业再次被毁。\",\n      \"potential_used\": \"P1\",\n      \"highlight_ledger\": [\n        {\"highlight_id\": \"H5\", \"treatment\": \"keep\", \"dimensions\": [], \"new_position\": \"开局高光\", \"how\": \"作为续写起点，直播高潮的余波直接引发第二冲突\"},\n        {\"highlight_id\": \"H7\", \"treatment\": \"replace\", \"dimensions\": [\"emotion_stack\"], \"new_position\": \"终局后情感落点\", \"how\": \"将原奶奶识破真相的情感力量，转化为许栀在彻底胜利后，于墓前告慰奶奶和原主，完成情感闭环\"}\n      ],\n      \"carried_facts\": [\n        {\"fact\": \"严寒涉嫌犯罪被警方调查，但未明确结果\", \"source_chapter\": 8, \"replant\": \"通过新闻报道或律师对话提及调查陷入停滞，严寒未被正式逮捕\"},\n        {\"fact\": \"奶奶病重在医院\", \"source_chapter\": 8, \"replant\": \"作为许栀战斗的动力源泉，在压力大时去医院探望（但避开原结局）\"}\n      ],\n      \"foreshadow_backfill\": [\n        {\"chapter\": 5, \"content\": \"严寒冷笑：“别忘了，司法鉴定中心也有我的人。”\", \"purpose\": \"为后续严寒能在证据上做手脚铺垫\"}\n      ],\n      \"opening\": \"直播黑屏后，手机响起，律师来电：“许小姐，严寒方面刚向法院提交了诉讼，指控您伪造录音证据。”\",\n      \"risks\": \"法律程序描写可能枯燥，需用技术破解和法庭对决的紧张感来平衡；要避免奶奶线干扰，需妥善处理其存在。\"\n    },\n    {\n      \"strategy\": \"deepen\",\n      \"title\": \"黑帽入侵\",\n      \"logline\": \"严寒雇佣顶尖黑客团队，发动网络攻击欲彻底毁灭许栀，技术对决升级\",\n      \"synopsis\": \"直播风波后，严寒并未束手就擒，他动用隐藏资金雇佣国际黑帽黑客团队，对许栀发动全面网络攻击：篡改她提交给警方的证据副本、入侵医院系统再次威胁奶奶安全、制造她的新黑料（如伪造她过往的负面记录）、甚至攻击她的银行账户。许栀陷入前所未有的技术战，她必须一边保护奶奶的医疗数据和安全，一边与这群看不见的敌人赛跑，修复被篡改的证据，并反向追踪黑客身份。最终，她利用一个精心设计的蜜罐系统锁定黑客位置，并曝光其与严寒的交易记录，在一场公开的技术直播中，将黑客团队一网打尽，并彻底切断严寒的所有后路。\",\n      \"core_events\": [\n        {\"name\": \"证据被篡改\", \"summary\": \"许栀发现云端和提交给警方的证据文件被恶意修改\", \"chapters\": 2},\n        {\"name\": \"医院危机\", \"summary\": \"黑客入侵医院系统，试图制造医疗事故威胁奶奶\", \"chapters\": 2},\n        {\"name\": \"金融攻击\", \"summary\": \"许栀的个人账户和工作室账户遭到攻击\", \"chapters\": 2},\n        {\"name\": \"布设蜜罐\", \"summary\": \"许栀故意泄露假漏洞，引诱黑客上钩\", \"chapters\": 2},\n 许栀，公司已经把你所有社交账号退登并修改了密码。”\n“这期间，你休想再上网发一个字。”\n林姐冷笑一声，\n“严总耐心有限。”\n“今晚八点，夜色顶层包厢，这是你最后的机会。”\n“如果今晚你还不识抬举，明天会发生什么，我们也不知道。”\n林姐摔门离开，房间恢复死寂。\n我打开电脑，连上WiFi，微信跳出一条严寒发来的语音：\n“许栀，挣扎好玩吗？今晚打扮得漂亮点。”\n我敲下一行字点击发送：\n“好，今晚见。”\n我起身走到梳妆台前，拿起原主的水钻胸针。\n我用刀片撬开后盖，将一枚指甲盖大小的微型芯片嵌入其中。\n这是我亲自编写的加密录音程序。\n只要开启，音频会实时加密并同步上传至我的私有云端。\n\n我将胸针别在黑色风衣的暗褶处，开车去了夜色。\n\n## 第4章\n夜色会所顶层，安保森严。\n刚出电梯，两个穿黑西装的保镖就拦住了我。\n“许小姐，规矩您懂。”\n“手机交出来，例行搜身。”\n我把手机扔进托盘，张开双臂。\n女保镖上上下下摸索了一遍，随即放行。\n推开包厢门，刺鼻的雪茄味扑面而来。\n严寒坐在真皮沙发里，手里晃着半杯威士忌。\n“终于学乖了？”\n他拍了拍身边的空位，\n“坐过来。”\n我没动，站在离他三步远的地方：\n“网上的那些黑料，你到底要怎样才肯撤掉？”\n严寒冷笑一声：\n“许栀，别装傻。”\n“那几张图，还有你靠奶奶卖惨的通稿，全是我让人放出去的。”\n“只要我一句话，水军立刻停手，你奶奶也能在医院睡个安稳觉。”\n“所以，这一切都是你逼我就范的手段？”\n我暗中调整站姿，确保胸针的麦克风孔正对他。\n“不然呢？”\n他站起身，步步逼近，\n“在这个圈子里，没有我的点头，你寸步难行。”\n“陪我，是你唯一的出路。”\n“只要你乖乖听话，昨天的黑热搜，明天就能变成洗白通稿。”\n他走到我面前，伸手摸向我的脸。\n我侧身抄起桌上的冰水，假装手滑泼在了他的高定西裤上。\n“严总，抱歉。”\n我后退两步，迅速拉开安全距离，\n“这件事太突然了，我需要一晚上的时间考虑。”\n严寒脸色铁青，眼中戾气翻涌。\n但他似乎很享受这种猫捉老鼠的掌控感，拿过纸巾擦了擦手。\n“行，我给你一晚上。”\n“明天早上，我要听到你的回复。”\n“否则，你知道我的手段。”\n回到公寓，我反锁房门，打开电脑。\n切入私有云端，刚才那段长达十五分钟的对话音频已经躺在加密区。\n我敲击键盘输入密钥，将乱码解码为清晰的音频文件。\n接着，我翻出原主之前备份的早期威胁短信截图。\n我明白，利用主流网站揭露这些行不通，\n那我只好采取些非常手段。\n为了避开经纪公司的网络监控，我从口袋里摸出一张电话卡。\n这是今天去医院时，我趁乱从奶奶的旧手机里拔出来的。\n插卡，联网。\n我切入暗网，购买了三个境外的僵尸网络节点作跳板，\n将音频和短信截图，连同图片造假鉴定报告进行多重加密打包。\n一份通过内网通道直达网信办举报中心；\n一份发给早已拟定好合同的顶尖维权律师；\n最后一份，我写了一个延时触发的脚本，\n匿名投递给国内三家以绝不妥协著称的媒体主编邮箱。\n做完这一切，天已经亮了。\n早上八点，严寒的微信准时发了过来：\n“考虑得怎么样了？”\n我果断地回复，\n“我考虑过了，我不同意。”\n“别敬酒不吃吃罚酒，得罪我，我保证让你在这个圈子里混不下去！”\n我冷笑一声，\n一边切屏给律师发送行动的指令，一边在对话框里敲下回复：\n“你还是准备好，担心担心你自己吧。”\n\n## 第5章\n“砰！”\n我公寓的防盗门传来一声巨响。\n紧接着，是严寒打来的视频通话。\n我按下接听，画面里，严寒身后的背景赫然是医院重症住院部的走廊！\n“许栀，你敢跟我耍花招？找死！”\n他将镜头对准前方几个黑衣壮汉\n与此同时，我公寓的防盗门锁报废，防盗门倒塌掀起一阵尘土。\n三个提着钢管的壮汉盯着我，步步逼近。\n手机屏幕里，严寒叫嚣的声音震得我耳膜生疼：\n“我让你装！我现在就拔了这老东西的管子！”\n我倚靠在椅背上，嘴角勾起嘲讽：\n“你拔啊。”\n视频中，黑衣人掀开病床上的被子。\n空的。\n严寒震惊地盯着屏幕里的空床。\n“人呢？！”\n“严总，你真以为我会放心把奶奶留在普通重症区？”\n我语气没有一丝起伏，\n“昨晚从会所出来，我就联系了私立医院。”\n“现在我奶奶躺在安保级别最高的特护病房。”\n“别说你的打手，连一只苍蝇都飞不进去。”\n“你想打扰她？下辈子吧。”\n“臭婊子，你敢耍我！”\n严寒在视频那头气急败坏。\n我挂断视频，按下桌上的遥控器，天花板四个角落的摄像头同时亮起红灯。\n他总吹嘘自己在司法系统有人，但这次他动不了我的证据。\n“这是我的私人云端实时同步录像。”\n“另外，十分钟前我已经报了警。”\n我晃了晃手机，窗外刚好传来由远及近的警笛声，\n“要试试这钢管砸下来，你们能判几年吗？”\n三人脸色一变，对视一眼，骂骂咧咧地夺门而逃。\n危机解除。\n我跨过一地狼藉，重新坐回电脑前，拨通了律师的电话。\n“动手吧。”\n五分钟后，一份盖着公章的律师函发送到了经纪公司高层的邮箱里。\n除了解约声明，里面还附带了一份“大礼包”：\n林姐知情，且纵容协助严寒潜规则旗下艺人的聊天记录和邮件往来。\n另一边，严寒察觉到了部分证据已经开始外泄。\n我的网络监测探针显示，各大平台的敏感词库正在被更新。\n严寒急眼了。\n雷霆大怒之下，他开始疯狂砸钱，动用庞大的公关力量全网删帖。\n热搜榜上，关于他公司的词条迅速被撤下，\n吃瓜群众发出的质疑贴不到一分钟就被删，\n大批高级水军下场，强行把水搅浑。\n叮的一声，严寒的短信发了过来：\n“只要钱到位，互联网就不会有你的记忆！”\n“你奶奶躲得过初一躲不过十五，走着瞧！”\n看着这句狠话，我只觉得可笑。\n我已经切断了他打探病房信息的渠道。\n他现在的威胁，不过是落空后的无能狂怒。\n电脑屏幕右下角，一个红色的倒计时窗口正在安静地跳动。\n“3、2、1……”\n进度条拉满，定时投递脚本触发成功。\n三封加密邮件，滑入了三家深度调查媒体主编的收件箱。\n\n## 第6章\n这三家媒体以不畏强权、死磕真相在业内著称。\n严寒的资本手腕能买通营销号，却买不动这些真正的新闻人。\n两小时后，早上八点整，早高峰通勤的节点。\n原本被严寒水军搅得乌烟瘴气的社交平台，撕开了一道口子。\n没有预热，没有娱乐圈惯用的八卦噱头，\n三家深度调查媒体全网同步推送了一篇万字长文。\n标题字字见血：\n《赛博猎巫的背后：资本胁迫、技术造假与一场完美的网络谋杀》。\n文章开篇，甩出了我那份长达三十页的图像技术鉴定报告。\n作为资深码农，我给出的证据链是降维打击级别的。\n报告里放大了所谓“医美现场图”的所有噪点，详细展示了ELA热力图，\n甚至直接提取了图片底层的EXIF数据，\n将拼接合成的操作痕迹、修改时间和部分硬件特征，展示得清清楚楚。\n这篇报道像一枚深水炸弹，引爆了整个网络。\n“卧槽！作为一个十年后期修图师的我头皮发麻。”\n“这报告太硬了，这根本不是什么吃瓜，这是高技术犯罪啊！”\n“看懂了，图片是P的，就医记录是假的，连所谓的知情人士是虚拟账号。”\n“我去，我们全被当枪使了！”\n“细思极恐……如果许栀拿不出这份报告，她现在是不是已经被逼上绝路了？”\n风向变了。\n原本满屏的荡妇羞辱和谩骂，转变成了对资本只手遮天的恐惧与愤怒。\n这不再是一桩茶余饭后的戏子黑料，\n而是被严肃定性为一桩涉及资本胁迫的网络暴力案件。\n那些原本跟着带节奏的大V们悄悄删除微博，理智的路人成批觉醒。\n严寒慌了。\n后台监测仪上，我看到大量异常流量正在冲击这三家媒体的服务器。\n严寒的水军涌入评论区，试图用以往那种胡搅蛮缠的方式把水再次搅浑。\n他甚至动用了最高级别的公关预案，试图花重金强行撤掉热搜词条。\n但这次，他踢到了铁板。\n这三家硬核媒体背后，是坚不可摧的公信力和新闻底线。\n严寒的团队绝望地发现，他们的资本权限在这里根本不管用。\n不仅文章删不掉，反而因为短时间内触发了平台的异常压制机制，\n被系统判定为重大社会事件，强推上了各大首页的置顶位，全网飘红。\n真相如同决堤的洪水，势不可挡。\n我坐在电脑前，看着数据监控面板。\n代表“许栀澄清”、“资本网暴”的词条指数正在呈指数级狂飙，\n而严寒关联实业公司的网络风评和股市预期，则断崖式暴跌。\n局势逆转，一切都在计算之中。\n我正准备关掉网页，去医院看望奶奶，\n电脑屏幕右下角的监控雷达突然发出一声尖锐的红色警报。\n一条全新的词条，突破了媒体的封锁，空降热搜榜第一。\n词条后面，跟着一个刺眼的的深红色“爆”字。\n许栀主动投怀送抱，会所监控流出\n我盯着这条热搜，眼睛微微眯起。\n\n## 第7章\n鼠标点开那个刺目的“爆”字。\n屏幕上弹出一段三十秒的无声监控视频。\n画面正是我昨晚走进那家私人会所包厢的场景。\n因为角度刁钻，视频里的我看起来像是顺从地交出手机，\n任由保镖搜身后走进了光线昏暗的包厢。\n视频末尾还被恶意剪辑了一段我靠近严寒倒水的画面，\n没有声音，加上模糊处理的滤镜，看起来就像是我在主动投怀送抱。\n营销号的配文更是恶毒：\n“所谓的技术流澄清不过是洗白手段。”\n“事实是许栀早已向资本低头，深夜主动赴约，企图用身体平息风波。”\n严寒这手脏牌打得真是时候。\n他想利用大众对娱乐圈潜规则的固有偏见，\n将我钉死在“当了婊子还立牌坊”的耻辱柱上。\n我没慌，反而笑了。\n等的就是他这步棋。\n现在全网都在盯着我，流量达到了巅峰。\n我打开手机，登上了公司归还的账号，点 有人，但这次他动不了我的证据。\n“这是我的私人云端实时同步录像。”\n“另外，十分钟前我已经报了警。”\n我晃了晃手机，窗外刚好传来由远及近的警笛声，\n“要试试这钢管砸下来，你们能判几年吗？”\n三人脸色一变，对视一眼，骂骂咧咧地夺门而逃。\n危机解除。\n我跨过一地狼藉，重新坐回电脑前，拨通了律师的电话。\n“动手吧。”\n五分钟后，一份盖着公章的律师函发送到了经纪公司高层的邮箱里。\n除了解约声明，里面还附带了一份“大礼包”：\n林姐知情，且纵容协助严寒潜规则旗下艺人的聊天记录和邮件往来。\n另一边，严寒察觉到了部分证据已经开始外泄。\n我的网络监测探针显示，各大平台的敏感词库正在被更新。\n严寒急眼了。\n雷霆大怒之下，他开始疯狂砸钱，动用庞大的公关力量全网删帖。\n热搜榜上，关于他公司的词条迅速被撤下，\n吃瓜群众发出的质疑贴不到一分钟就被删，\n大批高级水军下场，强行把水搅浑。\n叮的一声，严寒的短信发了过来：\n“只要钱到位，互联网就不会有你的记忆！”\n“你奶奶躲得过初一躲不过十五，走着瞧！”\n看着这句狠话，我只觉得可笑。\n我已经切断了他打探病房信息的渠道。\n他现在的威胁，不过是落空后的无能狂怒。\n电脑屏幕右下角，一个红色的倒计时窗口正在安静地跳动。\n“3、2、1……”\n进度条拉满，定时投递脚本触发成功。\n三封加密邮件，滑入了三家深度调查媒体主编的收件箱。\n\n## 第6章\n这三家媒体以不畏强权、死磕真相在业内著称。\n严寒的资本手腕能买通营销号，却买不动这些真正的新闻人。\n两小时后，早上八点整，早高峰通勤的节点。\n原本被严寒水军搅得乌烟瘴气的社交平台，撕开了一道口子。\n没有预热，没有娱乐圈惯用的八卦噱头，\n三家深度调查媒体全网同步推送了一篇万字长文。\n标题字字见血：\n《赛博猎巫的背后：资本胁迫、技术造假与一场完美的网络谋杀》。\n文章开篇，甩出了我那份长达三十页的图像技术鉴定报告。\n作为资深码农，我给出的证据链是降维打击级别的。\n报告里放大了所谓“医美现场图”的所有噪点，详细展示了ELA热力图，\n甚至直接提取了图片底层的EXIF数据，\n将拼接合成的操作痕迹、修改时间和部分硬件特征，展示得清清楚楚。\n这篇报道像一枚深水炸弹，引爆了整个网络。\n“卧槽！作为一个十年后期修图师的我头皮发麻。”\n“这报告太硬了，这根本不是什么吃瓜，这是高技术犯罪啊！”\n“看懂了，图片是P的，就医记录是假的，连所谓的知情人士是虚拟账号。”\n“我去，我们全被当枪使了！”\n“细思极恐……如果许栀拿不出这份报告，她现在是不是已经被逼上绝路了？”\n风向变了。\n原本满屏的荡妇羞辱和谩骂，转变成了对资本只手遮天的恐惧与愤怒。\n这不再是一桩茶余饭后的戏子黑料，\n而是被严肃定性为一桩涉及资本胁迫的网络暴力案件。\n那些原本跟着带节奏的大V们悄悄删除微博，理智的路人成批觉醒。\n严寒慌了。\n后台监测仪上，我看到大量异常流量正在冲击这三家媒体的服务器。\n严寒的水军涌入评论区，试图用以往那种胡搅蛮缠的方式把水再次搅浑。\n他甚至动用了最高级别的公关预案，试图花重金强行撤掉热搜词条。\n但这次，他踢到了铁板。\n这三家硬核媒体背后，是坚不可摧的公信力和新闻底线。\n严寒的团队绝望地发现，他们的资本权限在这里根本不管用。\n不仅文章删不掉，反而因为短时间内触发了平台的异常压制机制，\n被系统判定为重大社会事件，强推上了各大首页的置顶位，全网飘红。\n真相如同决堤的洪水，势不可挡。\n我坐在电脑前，看着数据监控面板。\n代表“许栀澄清”、“资本网暴”的词条指数正在呈指数级狂飙，\n而严寒关联实业公司的网络风评和股市预期，则断崖式暴跌。\n局势逆转，一切都在计算之中。\n我正准备关掉网页，去医院看望奶奶，\n电脑屏幕右下角的监控雷达突然发出一声尖锐的红色警报。\n一条全新的词条，突破了媒体的封锁，空降热搜榜第一。\n词条后面，跟着一个刺眼的的深红色“爆”字。\n许栀主动投怀送抱，会所监控流出\n我盯着这条热搜，眼睛微微眯起。\n\n## 第7章\n鼠标点开那个刺目的“爆”字。\n屏幕上弹出一段三十秒的无声监控视频。\n画面正是我昨晚走进那家私人会所包厢的场景。\n因为角度刁钻，视频里的我看起来像是顺从地交出手机，\n任由保镖搜身后走进了光线昏暗的包厢。\n视频末尾还被恶意剪辑了一段我靠近严寒倒水的画面，\n没有声音，加上模糊处理的滤镜，看起来就像是我在主动投怀送抱。\n营销号的配文更是恶毒：\n“所谓的技术流澄清不过是洗白手段。”\n“事实是许栀早已向资本低头，深夜主动赴约，企图用身体平息风波。”\n严寒这手脏牌打得真是时候。\n他想利用大众对娱乐圈潜规则的固有偏见，\n将我钉死在“当了婊子还立牌坊”的耻辱柱上。\n我没慌，反而笑了。\n等的就是他这步棋。\n现在全网都在盯着我，流量达到了巅峰。\n我打开手机，登上了公司归还的账号，点击开启直播。\n没有预热，开播瞬间直播间涌入了十万人。\n弹幕狂刷，夹杂着不堪入目的词汇。\n我没理会这些，把昨晚那枚胸针摘下来，摆在镜头前。\n“大家都在看严总放出的无声电影。”\n“既然剧情这么精彩，不配点原声怎么行？”\n我将胸针连接电脑，手指敲击回车键。\n我编写的加密程序，绕过防火墙，解压提取音频。\n一段清晰无比的对话，传遍了整个网络。\n“许栀，你是个聪明人。”\n“只要你今晚留下，所有的黑料我十分钟内就能让它们消失。”\n这是严寒的声音，带着不加掩饰的傲慢。\n紧接着，是我冷静的质问：\n“所以，那些医美假照还有买通营销号的造谣，全是你干的？”\n“是我又怎么样？”\n“在这个圈子里，资本就是规矩。\n“不顺从我，你连翻身的机会都没有！”\n“不仅是你，那个躺在医院里的老太婆也别想安生……”\n音频扒下了严寒衣冠楚楚的伪装，露出了他威逼利诱冷血嘴脸。\n弹幕在那一刻，出现了诡异的停顿。\n紧接着，整个直播间炸锅了。\n“草！这男的太恶心了！”\n“这哪里是潜规则，这是黑社会性质的敲诈勒索吧？！”\n“反转了！许栀是去录音取证的！她根本没妥协，她太刚了！”\n我看着飙升的热度，对着镜头开口：\n“严寒，你以为交出手机，搜了身，我就没办法了吗？”\n“这段录音，我已经同步发给了警方。”\n另一边，经纪公司的高层会议室里早已乱作一团。\n林姐和公司高管们看着直播间里引爆的舆论，冷汗直流。\n他们原本还想把原主当成礼物送给严寒，\n但现在事情的性质已经从娱乐八卦升级成了违法犯罪。\n严寒如今玩脱了。\n稍有不慎，公司都会作为拉皮条的从犯被牵连进去。\n“快！把之前所有的通稿全撤了！”\n公司高层在会议室里咆哮，\n“马上发声明，把公司和严寒的关系摘干净！快啊！”\n我的手机屏幕亮了，一条来自林姐的信息弹了出来：\n“小栀，公司决定挺你，严寒的事我们全不知情。”\n“你先下播，我们好好谈谈后续的公关。”\n我对着直播间的镜头，将手机屏幕怼到了镜头前。\n“看，原来落井下石的人，翻脸也可以这么快。”\n众人还在震惊于经纪公司的无耻时，直播间的连麦申请响了起来。\n来电显示，居然是严寒本人。\n\n需要带过来的事实 carried_facts：\n[\n {\n  \"fact\": \"严寒涉嫌犯罪被警方调查，但未明确结果\",\n  \"source_chapter\": 8,\n  \"replant\": \"通过新闻报道或律师对话提及调查陷入停滞，严寒未被正式逮捕\"\n },\n {\n  \"fact\": \"奶奶病重在医院\",\n  \"source_chapter\": 8,\n  \"replant\": \"作为许栀战斗的动力源泉，在压力大时去医院探望（但避开原结局）\"\n }\n]\n\n已写的续写章节：\n## 第8章\n我挂断严寒的连麦请求，直播结束的提示音在房间里格外清晰。屏幕暗下去的瞬间，手机震动起来，是李律师的紧急来电。\n\n“许小姐，情况有变。”李律师的声音罕见地急促，“严寒刚刚向法院提交了反诉，指控你伪造录音证据，涉嫌诽谤和非法窃听。”\n\n电脑屏幕自动亮起，邮箱提示音接连响起。我点开最新邮件，电子版法院传票和索赔文件赫然在目。\n\n索赔金额：八千万。\n\n“他指控你利用技术手段合成录音，并提供了所谓的‘专家初步意见’。”李律师继续说，“如果伪造证据罪名成立，不仅民事赔偿，你可能面临刑事责任。”\n\n我打开另一个文件夹，调出原始录音文件的属性面板。“录音是我亲自录制的，元数据完整。”\n\n“对方会质疑设备合法性，以及录音是否经过剪辑处理。”李律师提醒，“严寒聘请了顶尖的技术鉴定团队。”\n\n我快速检查文件创建时间和修改记录。“他们可能会从音频频谱的一致性入手，或者质疑环境噪音的连续性。”\n\n手指在键盘上飞快敲击，我将原始音频文件复制到三个加密硬盘。“我会准备好全套技术说明，包括录音设备的物理参数和加密上传的时间戳。”\n\n“最好尽快做司法鉴定，固定证据效力。”李律师说，“但要注意，严寒在司法系统确实有些人脉。”\n\n我接上便携式频谱分析仪，将音频文件导入。“我知道风险。所有电子证据已经多重备份，云端和本地都有加密存储。”\n\n屏幕右下角弹出新闻推送提示。\n\n标题醒目：严寒方发表声明，坚信法律会还其清白。\n\n人物卡：\n[\n {\n  \"name\": \"许栀\",\n  \"role\": \"主角\",\n  \"traits\": [\n   {\n    \"trait\": \"技术能力强善用代码工具\"   const h=cl.filter(c=>N(c.chapter)>=a&&N(c.chapter)<=z).map(c=>`<br><span class="muted">${esc(c.level)}（第 ${N(c.chapter)} 章）：${esc(c.content)}</span>`).join("");
  return `<tr><td class="n">第 ${a}${z>a?`–${z}`:""} 章</td><td><b>${esc(b.name)}</b><br>${(b.small_events||[]).map(esc).join(" → ")}${h}</td></tr>`}).join("");
 return page("大纲生成",`把选中的方向拆成 ${nNew} 章的大事件，定好高潮放在哪。`,[`方向「${esc(sel.title)}」`,`${(outline.big_events||[]).length} 个大事件`],`<table>${rows}</table>`,D.s3_outline)}},
{name:"细纲生成",s:"S4",render(){
 const rows=detail.map(c=>`<tr><td class="n">第 ${N(c.index)} 章</td><td><b>${esc(c.title)}</b>　<span class="muted">${(c.events||[]).length} 个事件</span><br>${esc(c.core_conflict)}<br><span class="muted">章尾：${esc(c.ending_hook?.content)}</span></td></tr>`).join("");
 return page("细纲生成",`给每一章定写什么、在哪收尾。每章事件数参照原作（平均 ${U.derived?.events_per_chapter} 个）。编辑在这里逐章确认（演示里自动确认）。`,["大纲",`${detail.length} 章细纲`],`<table>${rows}</table>`,D.s4_detail)}},
{name:"伏笔回填",s:"S5a",render(){
 const r=D.s5a_backfill||{},kt=r.kept_text||{};
 const items=(r.applied||[]).map(a=>{const t=kt[a.chapter]||"",i=a.applied?t.indexOf(a.insert_text):-1;
  return `<div class="muted" style="font-size:13px;margin-bottom:6px">第 ${N(a.chapter)} 章${a.applied?"":"（没找到插入位置，未插入）"}</div><div class="ctx">${i<0?esc(a.anchor):"…"+esc(t.slice(Math.max(0,i-120),i))+`<mark>${esc(a.insert_text)}</mark>`+esc(t.slice(i+a.insert_text.length,i+a.insert_text.length+80))+"…"}</div>`}).join("");
 return page("伏笔回填",`续写里新出现的东西，在保留的原文里先补一句暗示（标黄的是补的）。只补在免费的前 ${N(cfg.free_chapters)} 章之后，原文其他地方不动。`,["选中方向的伏笔清单 + 保留的原文","补好伏笔的原文"],r.skipped?`<p class="muted">${esc(r.skipped)}</p>`:items,r)}},
{name:"正文生成",s:"S5b",render(){
 const ws=new Set(written.map(c=>N(c.outline?.index)));
 const btn=(p,i)=>`<button data-ch="${i}" class="${i===cur?"on":""}">第 ${p.i} 章${p.orig?"":" "+esc(p.c.outline?.title||"")}</button>`;
 let toc=`<div class="g">保留的原作</div>`+chs.map((p,i)=>p.orig?btn(p,i):"").join("")+`<div class="g">续写</div>`+chs.map((p,i)=>p.orig?"":btn(p,i)).join("");
 toc+=detail.filter(c=>!ws.has(N(c.index))).map(c=>`<button disabled>第 ${N(c.index)} 章 ${esc(c.title)}</button>`).join("");
 const p=chs[cur];
 return page("正文生成",`按细纲一章一章写，已写 ${written.length} / ${nNew} 章。每章写完由代码对比字数、对话占比、段落长度是否接近原作。`,["保留的原文 + 已写的前几章 + 本章细纲","每章正文"],
 `<div class="reader"><div class="toc">${toc}</div><div class="sheet">${sheet(p)}</div></div>`,p&&!p.orig?p.c:null,p&&!p.orig?p.c.checks:[])}},
];

const kept=D.s5a_backfill?.kept_text||{},inserts=(D.s5a_backfill?.applied||[]).filter(a=>a.applied);
const chs=[...Object.keys(kept).map(N).sort((a,b)=>a-b).map(i=>({i,orig:true,text:kept[i]})),...written.map(c=>({i:N(c.outline?.index),orig:false,text:c.text,c}))];
let cur=Math.max(0,chs.findIndex(p=>!p.orig));
function sheet(p){if(!p)return "";
 const body=paras(p.text).map(s=>{let h=esc(s);inserts.filter(a=>N(a.chapter)===p.i).forEach(a=>h=h.replace(esc(a.insert_text),`<mark>${esc(a.insert_text)}</mark>`));return `<p>${h}</p>`}).join("");
 const s=p.c?.stats||{};
 const meta=p.orig?`原作第 ${p.i} 章`:`续写第 ${p.i} 章 · ${N(s.words)} 字（原作每章约 ${N(base.median_words)}）· 对话 ${pct(s.dialogue_ratio)}（原作 ${pct(base.dialogue_ratio)}）`;
 return `<div class="meta">${meta}</div><div class="prose">${body}</div>`}

let at=0;
function go(i,keep){at=Math.max(0,Math.min(P.length-1,i));
 document.getElementById("nav").innerHTML=P.map((p,j)=>`<button data-go="${j}" class="${j===at?"on":""}"><small>${p.s}</small>${p.name}</button>`).join("");
 document.getElementById("page").innerHTML=P[at].render();
 const pv=document.getElementById("prev"),nx=document.getElementById("next");
 pv.disabled=!at;nx.disabled=at===P.length-1;pv.textContent=at?`← ${P[at-1].name}`:"";nx.textContent=at<P.length-1?`${P[at+1].name} →`:"";
 if(!keep)document.getElementById("stage").scrollTop=0}
document.addEventListener("click",e=>{const g=e.target.closest("[data-go]");if(g)return go(N(g.dataset.go));const c=e.target.closest("[data-ch]");if(c){cur=N(c.dataset.ch);go(at,true)}});
document.getElementById("prev").onclick=()=>go(at-1);document.getElementById("next").onclick=()=>go(at+1);
document.addEventListener("keydown",e=>{if(e.metaKey||e.ctrlKey||e.altKey)return;if(e.key==="ArrowRight")go(at+1);if(e.key==="ArrowLeft")go(at-1)});
document.getElementById("book").textContent=s0.title||"";
document.getElementById("summary").textContent=`原作 ${origN} 章，保留前 ${cut} 章，续写 ${nNew} 章（已写 ${written.length} 章）`;
go(0);
</script>
</body>
</html>
