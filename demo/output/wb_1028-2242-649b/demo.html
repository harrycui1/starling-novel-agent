户信息，往下翻。\n\n实控人一栏，清清楚楚写着两个字。\n\n严寒。\n\n## 第14章\n林姐的转账记录不止一笔。\n\n我继续往下翻，收款方那家维京群岛空壳公司，半年内从林姐账户吸走了三百多万。每笔转账的时间节点，都卡在原主拒绝严寒之后的第三天、第五天、一周后。\n\n我调出林姐的邮件备份，之前从经纪公司服务器里一并爬下来的。\n\n搜索关键词：许栀。\n\n三百多封邮件，我按时间倒序排列，筛出她和严寒助理的往来。\n\n第一封，去年十一月。严寒助理发来一份名单，上面列了七个女艺人，许栀排在最后。\n\n林姐回复：“许栀最难搞，奶奶那边可以下手。”\n\n第二封，十二月。严寒助理发来一个压缩包，里面是伪造的医美病历和第一批黑图。\n\n林姐回复：“收到，明天安排营销号发。”\n\n第三封，今年一月。林姐主动发了一组许栀的私人行程表，包括奶奶住院的科室、床号、主治医生。\n\n邮件末尾加了一句：“严总放心，她跑不掉。”\n\n我把所有邮件按时间轴整理，配上转账记录、聊天截图，做成一份完整的证据链文档。\n\n三百七十四页。\n\n做完这些，天已经黑了。\n\n我没有急着发。\n\n现在发出去，最多让林姐进去蹲几年。严寒已经批捕，苏菲掉了代言，这些都不够。\n\n我要等。\n\n等到一个所有目光都聚焦的时刻，一次性清算。\n\n手机震了一下，苏菲发了条微博，配图是她在某品牌活动上的精修照。\n\n“清者自清，浊者自浊。有些人忙着编故事，有些人忙着往前走。”\n\n评论区水军整齐刷屏：“姐姐好美”“不跟糊咖计较”。\n\n我转发了她的微博，只加了四个字：“清者自清。”\n\n评论区瞬间两极分化。\n\n“许栀终于回应了！”\n\n“就四个字？疤的事不解释？”\n\n“人家忙着拍戏，谁像你们天天盯着别人左手看。”\n\n“我信她，那份技术鉴定报告不是一般人能拿出来的。”\n\n“信她个鬼，夺舍实锤！”\n\n我没有再看。舆论稳住了，两边吵得越凶，热度维持得越久。等终局到来，所有的质疑都会变成打向林姐和苏菲的子弹。\n\n第二天早上，一条微信好友申请弹出来。\n\n验证消息：“陈导。”\n\n我通过。\n\n对方直接发来一段语音，声音沙哑，带着片场特有的嘈杂背景音。\n\n“许栀，我看了你那场直播。别人看热闹，我看门道。”\n\n“你对着十万条辱骂，手没抖，声没颤，眼睛里全是算计。这种心理素质，我下部戏的女主角，非你不可。”\n\n紧接着，一份电子合同发过来。\n\n电影项目：《暗河》。\n\n现实主义悬疑题材，女主角是个被诬陷杀人的法医，全片一百二十七场戏，一百零三场有她。\n\n片酬那一栏，填的是S级顶格。\n\n我翻到合同最后一页，导演已经签了字。\n\n我回复：“陈导，我接。”\n\n他秒回：“下周三进组。把你左手的事处理好，别让剧组为难。”\n\n“明白。”\n\n我关掉对话框，把合同转发给律师存档。\n\n下午，我开车去了私立医院。\n\n奶奶躺在特护病房里，鼻氧管换成了面罩，脸色比上次好了一些。\n\n王医生在走廊拦住我。\n\n“许小姐，老太太的情况暂时稳住了。心衰的基础还在，但私立医院这边的设备和护理跟上了，短期内不会有危险。”\n\n他顿了顿。\n\n“不过她清醒的时间越来越少，你要有心理准备。”\n\n“我明白。”\n\n我走进病房，坐在床边。\n\n奶奶的眼皮动了动，没有睁开。嘴唇翕了两下，声音太轻，我听不清。\n\n我握住她的手。\n\n枯瘦，冰凉，指节因为常年输液而泛着青紫。\n\n“奶奶，我要去拍戏了。”\n\n她的手指在我掌心里微微动了动。\n\n“拍完这部戏，我就能洗掉所有脏水。”\n\n“到时候，我推你去看首映。”\n\n奶奶的嘴角好像弯了一下，又好像没有。\n\n我坐了很久，直到护士进来换药，才起身离开。\n\n走出病房，手机屏幕亮了。\n\n一条来自陌生号码的短信，只有六个字：“替身，颁奖礼见。”\n\n号码归属地查不到，但语气我认得。\n\n苏菲。\n\n我把短信截图，存进加密文件夹。\n\n文件夹命名：“终局”。\n\n里面整整齐齐码着林姐的三百七十四页证据链、苏菲的私信截图、陈雯在网吧的上机记录，还有奶奶病房被骚扰那天的监控备份。\n\n我删掉苏菲的短信，打开加密文件夹，最后检查了一遍文件结构。\n\n所有证据分成三份，设置了三个不同的定时触发节点。\n\n第一份，颁奖礼红毯开始前两小时，自动投递给三家媒体。\n\n第二份，颁奖礼最佳女主角揭晓的瞬间，自动上传至网信办举报平台。\n\n第三份，如果前两份被拦截，四十八小时后，自动群发至全网所有主流社交平台。\n\n文件名：终局。\n\n我合上电脑，把旧手机从抽屉里取出来，和加密硬盘一起锁进保险柜。\n\n站起身，走到窗前。\n\n楼下没有狗仔了。\n\n远处，城市的天际线亮起万家灯火。\n\n## 第15章\n进组第一天，陈导没让我试戏。\n\n他把剧本扔给我，指了指监视器旁边的折叠椅。“坐那儿看，看三天。”\n\n我没问为什么。坐下来，翻开剧本。\n\n女主角叫沈遥，法医，被指控伪造尸检报告。全片核心冲突是：她到底有没有篡改数据。\n\n陈导拍戏不用分镜脚本，现场走位全靠演员自己找。第一场审讯戏，他让男主即兴发挥，台词随便说。\n\n监视器里，男主拍桌怒吼：“你改了报告！你收了钱！”\n\n沈遥的台词本上只有一句：“我没有。”\n\n我盯着剧本上那三个字，忽然想到一件事。\n\n原主被全网骂的时候，说过最多的话也是“我没有”。没人信。\n\n我把剧本合上，掏出手机，打开备忘录。\n\n写下一行字：沈遥的动机不是自证清白，是让死者的数据开口说话。\n\n第二天，陈导拍沈遥在停尸房解剖尸体的戏。道具组准备了假人模型，内脏是硅胶做的。\n\n我戴上手套，拿起手术刀。\n\n陈导在监视器后面喊：“不用真解剖，你做个样子就行。”\n\n我没停。刀尖划过硅胶胸腔的时候，我开口：“沈遥不会做样子。”\n\n“她每割一刀，都是在跟死者对话。”\n\n“她关心的不是自己会不会坐牢，是这具尸体有没有被误判。”\n\n陈导没喊卡。\n\n监视器后面安静了十几秒。\n\n收工的时候，副导演跑过来递给我一杯咖啡。“陈导让我给你的。”\n\n我接过来，喝了一口。速溶的，三合一。\n\n“陈导还说，”副导演压低声音，“你昨天在备忘录写的那句话，他看到了。”\n\n我愣了一下。\n\n“他说，你眼里有东西。不是演出来的。”\n\n第三天，陈导加了一场戏。沈遥深夜独自在档案室翻卷宗，翻到一份被涂改的尸检记录。没有台词，全靠眼神和手部动作。\n\n我坐在档案架前，一页一页翻。\n\n翻到第七页的时候，手指停住。纸张边缘有一道被撕掉又粘回去的痕迹。\n\n我用指甲沿着胶水印刮了一下。\n\n陈导没喊停。摄影机推近，特写我的手指。\n\n我抬起头，目光落在档案架最顶层那排落灰的文件夹上。\n\n“卡。”\n\n陈导从监视器后面站起来，走到我面前。“你怎么知道那页有撕痕？”\n\n“道具组做旧的时候胶水涂多了，纸张膨胀系数不一样。”\n\n陈导看了我三秒，转头对制片人说：“看见没？这姑娘眼里有故事，不是花瓶。”\n\n制片人点头，在本子上记了什么。\n\n剧组生活规律得像代码。\n\n早上六点出工，晚上八点收工。盒饭两荤一素，我吃了两周，瘦了三斤。\n\n收工后回酒店，洗完澡，打开电脑。\n\n林姐的银行流水我已经爬完了。三百多万，分十七笔，全部转入那家维京群岛空壳公司。\n\n但空壳公司不止收了她的钱。\n\n我顺着那家公司的收款账户往下扒。注册地在海外，实际运营IP在境内。服务器日志里藏着更深的链路。\n\n凌晨一点，我写了个脚本，抓取该公司近一年的所有资金往来。\n\n数据跑完，屏幕上跳出一张关系图。\n\n三个节点：林姐、苏菲、严寒。\n\n三人的资金全部汇入同一家空壳公司，再由公司分散转出到十几个营销号账户。\n\n林姐打款时间，对应原主黑料爆发前三天。\n\n苏菲打款时间，对应她每次发阴阳微博的前一天。\n\n严寒打款时间，贯穿始终。\n\n证据链闭环。\n\n我把关系图截图，连同银行流水、邮件备份、聊天记录，打包成一个加密压缩包。\n\n然后分三份存。\n\n一份拷进离线硬盘，锁进酒店保险柜。\n\n一份上传私有云端，设置二次验证。\n\n一份发给律师，附言：“终局证据，等我指令。”\n\n做完这些，凌晨三点。\n\n我合上电脑，躺在床上。\n\n手机屏幕亮了。林姐发了条微博，配图是一张模糊的聊天记录截图。\n\n“下周，许栀的真面目将全网公开。有些事，不是会写代码就能盖住的。”\n\n评论区水军整齐刷屏：“坐等实锤”“这次看她怎么洗”。\n\n我截了图，存进“终局”文件夹。\n\n没有回复。没有动作。\n\n舆论继续发酵。林姐的爆料预告挂在热搜尾巴上，像一颗定时炸弹。\n\n我不急。她手里的牌，我全知道。\n\n第四周，陈导拍最后一场重头戏。沈遥在法庭上做最终陈述。\n\n剧本只有半页纸，陈导说：“你自己写词。”\n\n我站在法庭布景的证人席上，灯光打过来。\n\n“我解剖过一百三十七具尸体。”\n\n“每一具，都带着真相。只是有人不想听。”\n\n“我改报告，是因为原报告错了。我坚持，是因为死者不会说谎。”\n\n“如果坚持真相是一种罪，那我认。”\n\n陈导没喊卡。全场安静。\n\n他站起来，鼓掌。\n\n收工回酒店，我打开保险柜，取出原主的旧手机。\n\n屏幕还是碎的，但系统能跑。我插上数据线，把之前修复出来的文件挨个点开。\n\n相册、备忘录、通话记录。\n\n最后一个文件夹，名字是“给奶奶”。\n\n我点开。\n\n里面只有一段语音，录制时间是原主去世前一周。\n\n我按下播放键。\n\n原主的声音很轻，带着笑。\n\n“奶奶，等我红了就接你回家。”\n\n“我给你买个大房子，带花园的那种。”\n\n“你每天晒晒太阳，我收工回来给你做饭。”\n\n“你一定要等我啊。”\n\n语音结束。\n\n我攥着手机，喉咙发紧。\n\n屏幕暗下去。\n\n人物卡：\n[\n {\n  \"name\": \"许栀（穿越者）\",\n  \"role\": \"主角\",\n  \"traits\": [\n   {\n    \"trait\": \"技术流，用代码排查图片造假\",\n    \"evidence_chapter\": 1\n   },\n   {\n    \"trait\": \"冷静果断，会所录音取证\",\n    \"evidence_chapter\": 4\n   },\n   {\n    \"trait\": \"护短，拼命守护奶奶\",\n    \"evidence_chapter\": 3\n   }\n  ],\n  \"fate\": \"替原主复仇成功，解约，事业翻身，奶奶去世，决心好好活。\"\n },\n {\n  \"name\": \"严寒\",\n  \"role\": \"反派，资本大佬\",\n  \"traits\": [\n   {\n    \"trait\": \"傲慢控制欲，威胁潜规则\",\n    \"evidence_chapter\": 4\n   },\n   {\n    \"trait\": \"阴狠，用奶奶威胁\",\n    \"evidence_chapter\": 2\n   },\n   {\n    \"trait\": \"资本操控舆论\",\n    \"evidence_chapter\": 1\n   }\n  ],\n  \"fate\": \"录音曝光，股价跌停，合作解约，警方介入，身败名裂。\"\n },\n {\n  \"name\": \"奶奶\",\n  \"role\": \"原主唯一亲人，主角守护对象\",\n  \"traits\": [\n   {\n    \"trait\": \"善良坚韧，为孙女倾尽所有\",\n    \"evidence_chapter\": 2\n   },\n   {\n    \"trait\": \"临终清明，识破穿越者\",\n    \"evidence_chapter\": 10\n   }\n  ],\n  \"fate\": \"去世。\"\n },\n {\n  \"name\": \"林姐\",\n  \"role\": \"执行经纪，帮凶\",\n  \"traits\": [\n   {\n    \"trait\": \"势利威胁\",\n    \"evidence_chapter\": 1\n   },\n   {\n    \"trait\": \"见风使舵\",\n    \"evidence_chapter\": 7\n   }\n  ],\n  \"fate\": \"被公司推责，未明确下场。\"\n },\n {\n  \"name\": \"苏菲\",\n  \"role\": \"对家小花，帮凶\",\n  \"traits\": [\n   {\n    \"trait\": \"阴阳怪气，买水军\",\n    \"evidence_chapter\": 2\n   }\n  ],\n  \"fate\": \"代言解约，角色换人。\"\n },\n {\n  \"name\": \"王医生\",\n  \"role\": \"中心医院医生，帮助者\",\n  \"traits\": [\n   {\n    \"trait\": \"负责关心\",\n    \"evidence_chapter\": 2\n   }\n  ],\n  \"fate\": \"继续在医院工作。\"\n },\n {\n  \"name\": \"原主许栀\",\n  \"role\": \"被穿越者，已故\",\n  \"traits\": [\n   {\n    \"trait\": \"软弱但孝顺\",\n    \"evidence_chapter\": 2\n   },\n   {\n    \"trait\": \"宁死不屈\",\n    \"evidence_chapter\": 2\n   }\n  ],\n  \"fate\": \"已死，被主角替她复仇。\"\n }\n]\n\n本章细纲 chapte n我打开电脑，连上WiFi，微信跳出一条严寒发来的语音：\n“许栀，挣扎好玩吗？今晚打扮得漂亮点。”\n我敲下一行字点击发送：\n“好，今晚见。”\n我起身走到梳妆台前，拿起原主的水钻胸针。\n我用刀片撬开后盖，将一枚指甲盖大小的微型芯片嵌入其中。\n这是我亲自编写的加密录音程序。\n只要开启，音频会实时加密并同步上传至我的私有云端。\n\n我将胸针别在黑色风衣的暗褶处，开车去了夜色。\n\n## 第4章\n夜色会所顶层，安保森严。\n刚出电梯，两个穿黑西装的保镖就拦住了我。\n“许小姐，规矩您懂。”\n“手机交出来，例行搜身。”\n我把手机扔进托盘，张开双臂。\n女保镖上上下下摸索了一遍，随即放行。\n推开包厢门，刺鼻的雪茄味扑面而来。\n严寒坐在真皮沙发里，手里晃着半杯威士忌。\n“终于学乖了？”\n他拍了拍身边的空位，\n“坐过来。”\n我没动，站在离他三步远的地方：\n“网上的那些黑料，你到底要怎样才肯撤掉？”\n严寒冷笑一声：\n“许栀，别装傻。”\n“那几张图，还有你靠奶奶卖惨的通稿，全是我让人放出去的。”\n“只要我一句话，水军立刻停手，你奶奶也能在医院睡个安稳觉。”\n“所以，这一切都是你逼我就范的手段？”\n我暗中调整站姿，确保胸针的麦克风孔正对他。\n“不然呢？”\n他站起身，步步逼近，\n“在这个圈子里，没有我的点头，你寸步难行。”\n“陪我，是你唯一的出路。”\n“只要你乖乖听话，昨天的黑热搜，明天就能变成洗白通稿。”\n他走到我面前，伸手摸向我的脸。\n我侧身抄起桌上的冰水，假装手滑泼在了他的高定西裤上。\n“严总，抱歉。”\n我后退两步，迅速拉开安全距离，\n“这件事太突然了，我需要一晚上的时间考虑。”\n严寒脸色铁青，眼中戾气翻涌。\n但他似乎很享受这种猫捉老鼠的掌控感，拿过纸巾擦了擦手。\n“行，我给你一晚上。”\n“明天早上，我要听到你的回复。”\n“否则，你知道我的手段。”\n回到公寓，我反锁房门，打开电脑。\n切入私有云端，刚才那段长达十五分钟的对话音频已经躺在加密区。\n我敲击键盘输入密钥，将乱码解码为清晰的音频文件。\n接着，我翻出原主之前备份的早期威胁短信截图。\n我明白，利用主流网站揭露这些行不通，\n那我只好采取些非常手段。\n为了避开经纪公司的网络监控，我从口袋里摸出一张电话卡。\n这是今天去医院时，我趁乱从奶奶的旧手机里拔出来的。\n插卡，联网。\n我切入暗网，购买了三个境外的僵尸网络节点作跳板，\n将音频和短信截图，连同图片造假鉴定报告进行多重加密打包。\n一份通过内网通道直达网信办举报中心；\n一份发给早已拟定好合同的顶尖维权律师；\n最后一份，我写了一个延时触发的脚本，\n匿名投递给国内三家以绝不妥协著称的媒体主编邮箱。\n做完这一切，天已经亮了。\n早上八点，严寒的微信准时发了过来：\n“考虑得怎么样了？”\n我果断地回复，\n“我考虑过了，我不同意。”\n“别敬酒不吃吃罚酒，得罪我，我保证让你在这个圈子里混不下去！”\n我冷笑一声，\n一边切屏给律师发送行动的指令，一边在对话框里敲下回复：\n“你还是准备好，担心担心你自己吧。”\n\n## 第5章\n“砰！”\n我公寓的防盗门传来一声巨响。\n紧接着，是严寒打来的视频通话。\n我按下接听，画面里，严寒身后的背景赫然是医院重症住院部的走廊！\n“许栀，你敢跟我耍花招？找死！”\n他将镜头对准前方几个黑衣壮汉\n与此同时，我公寓的防盗门锁报废，防盗门倒塌掀起一阵尘土。\n三个提着钢管的壮汉盯着我，步步逼近。\n手机屏幕里，严寒叫嚣的声音震得我耳膜生疼：\n“我让你装！我现在就拔了这老东西的管子！”\n我倚靠在椅背上，嘴角勾起嘲讽：\n“你拔啊。”\n视频中，黑衣人掀开病床上的被子。\n空的。\n严寒震惊地盯着屏幕里的空床。\n“人呢？！”\n“严总，你真以为我会放心把奶奶留在普通重症区？”\n我语气没有一丝起伏，\n“昨晚从会所出来，我就联系了私立医院。”\n“现在我奶奶躺在安保级别最高的特护病房。”\n“别说你的打手，连一只苍蝇都飞不进去。”\n“你想打扰她？下辈子吧。”\n“臭婊子，你敢耍我！”\n严寒在视频那头气急败坏。\n我挂断视频，按下桌上的遥控器，天花板四个角落的摄像头同时亮起红灯。\n“这是我的私人云端实时同步录像。”\n“另外，十分钟前我已经报了警。”\n我晃了晃手机，窗外刚好传来由远及近的警笛声，\n“要试试这钢管砸下来，你们能判几年吗？”\n三人脸色一变，对视一眼，骂骂咧咧地夺门而逃。\n危机解除。\n我跨过一地狼藉，重新坐回电脑前，拨通了律师的电话。\n等待接通时，我瞥见原主日记本摊在桌角，一页被撕掉，夹着张旧照片，背面写着“陈雯，等我红了就去找你”。\n“动手吧。”\n五分钟后，一份盖着公章的律师函发送到了经纪公司高层的邮箱里。\n除了解约声明，里面还附带了一份“大礼包”：\n林姐知情，且纵容协助严寒潜规则旗下艺人的聊天记录和邮件往来。\n另一边，严寒察觉到了部分证据已经开始外泄。\n我的网络监测探针显示，各大平台的敏感词库正在被更新。\n严寒急眼了。\n雷霆大怒之下，他开始疯狂砸钱，动用庞大的公关力量全网删帖。\n热搜榜上，关于他公司的词条迅速被撤下，\n吃瓜群众发出的质疑贴不到一分钟就被删，\n大批高级水军下场，强行把水搅浑。\n叮的一声，严寒的短信发了过来：\n“只要钱到位，互联网就不会有你的记忆！”\n“你奶奶躲得过初一躲不过十五，走着瞧！”\n看着这句狠话，我只觉得可笑。\n我已经切断了他打探病房信息的渠道。\n他现在的威胁，不过是落空后的无能狂怒。\n电脑屏幕右下角，一个红色的倒计时窗口正在安静地跳动。\n“3、2、1……”\n进度条拉满，定时投递脚本触发成功。\n三封加密邮件，滑入了三家深度调查媒体主编的收件箱。\n\n## 第6章\n这三家媒体以不畏强权、死磕真相在业内著称。\n严寒的资本手腕能买通营销号，却买不动这些真正的新闻人。\n两小时后，早上八点整，早高峰通勤的节点。\n原本被严寒水军搅得乌烟瘴气的社交平台，撕开了一道口子。\n没有预热，没有娱乐圈惯用的八卦噱头，\n三家深度调查媒体全网同步推送了一篇万字长文。\n标题字字见血：\n《赛博猎巫的背后：资本胁迫、技术造假与一场完美的网络谋杀》。\n文章开篇，甩出了我那份长达三十页的图像技术鉴定报告。\n作为资深码农，我给出的证据链是降维打击级别的。\n报告里放大了所谓“医美现场图”的所有噪点，详细展示了ELA热力图，\n甚至直接提取了图片底层的EXIF数据，\n将拼接合成的操作痕迹、修改时间和部分硬件特征，展示得清清楚楚。\n这篇报道像一枚深水炸弹，引爆了整个网络。\n“卧槽！作为一个十年后期修图师的我头皮发麻。”\n“这报告太硬了，这根本不是什么吃瓜，这是高技术犯罪啊！”\n“看懂了，图片是P的，就医记录是假的，连所谓的知情人士是虚拟账号。”\n“我去，我们全被当枪使了！”\n“细思极恐……如果许栀拿不出这份报告，她现在是不是已经被逼上绝路了？”\n风向变了。\n原本满屏的荡妇羞辱和谩骂，转变成了对资本只手遮天的恐惧与愤怒。\n这不再是一桩茶余饭后的戏子黑料，\n而是被严肃定性为一桩涉及资本胁迫的网络暴力案件。\n那些原本跟着带节奏的大V们悄悄删除微博，理智的路人成批觉醒。\n严寒慌了。\n后台监测仪上，我看到大量异常流量正在冲击这三家媒体的服务器。\n严寒的水军涌入评论区，试图用以往那种胡搅蛮缠的方式把水再次搅浑。\n他甚至动用了最高级别的公关预案，试图花重金强行撤掉热搜词条。\n但这次，他踢到了铁板。\n这三家硬核媒体背后，是坚不可摧的公信力和新闻底线。\n严寒的团队绝望地发现，他们的资本权限在这里根本不管用。\n不仅文章删不掉，反而因为短时间内触发了平台的异常压制机制，\n被系统判定为重大社会事件，强推上了各大首页的置顶位，全网飘红。\n真相如同决堤的洪水，势不可挡。\n我坐在电脑前，看着数据监控面板。\n代表“许栀澄清”、“资本网暴”的词条指数正在呈指数级狂飙，\n而严寒关联实业公司的网络风评和股市预期，则断崖式暴跌。\n局势逆转，一切都在计算之中。\n我正准备关掉网页，去医院看望奶奶，\n医院护工来电，说奶奶昏迷中喃喃“栀栀左手有疤”。我低头看自己光滑的左手，只当是老人胡话。\n电脑屏幕右下角的监控雷达突然发出一声尖锐的红色警报。\n一条全新的词条，突破了媒体的封锁，空降热搜榜第一。\n词条后面，跟着一个刺眼的的深红色“爆”字。\n许栀主动投怀送抱，会所监控流出\n我盯着这条热搜，眼睛微微眯起。\n\n## 第7章\n鼠标点开那个刺目的“爆”字。\n屏幕上弹出一段三十秒的无声监控视频。\n画面正是我昨晚走进那家私人会所包厢的场景。\n因为角度刁钻，视频里的我看起来像是顺从地交出手机，\n任由保镖搜身后走进了光线昏暗的包厢。\n视频末尾还被恶意剪辑了一段我靠近严寒倒水的画面，\n没有声音，加上模糊处理的滤镜，看起来就像是我在主动投怀送抱。\n营销号的配文更是恶毒：\n“所谓的技术流澄清不过是洗白手段。”\n“事实是许栀早已向资本低头，深夜主动赴约，企图用身体平息风波。”\n严寒这手脏牌打得真是时候。\n他想利用大众对娱乐圈潜规则的固有偏见，\n将我钉死在“当了婊子还立牌坊”的耻辱柱上。\n我没慌，反而笑了。\n等的就是他这步棋。\n现在全网都在盯着我，流量达到了巅峰。\n我打开手机，登上了公司归还的账号，点击开启直播。\n没有预热，开播瞬间直播间涌入了十万人。\n弹幕狂刷，夹杂着不堪入目的词汇。\n我没理会这些，把昨晚那枚胸针摘下来，摆在镜头前。\n“大家都在看严总放出的无声电影。”\n“既然剧情这么精彩，不配点原声怎么行？”\n我将胸针连接电脑，手指敲击回车键。\n我编写的加密程序，绕过防火墙，解压提取音频。\n一段清晰无比的对话，传遍了整个网络。\n“许栀，你是个聪明人。”\n“只要你今晚留下，所有的黑料我十分钟内就能让它们消失。”\n这是严寒的声音，带着不加掩饰的傲慢。\n紧接着，是我冷静的质问：\n“所以，那些医美假照还有买通营销号的造谣，全是你干的？”\n“是我又怎么样？”\n“在这个圈子里，资本就是规矩。\n“不顺从我，你连翻身的机会都没有！”\n“不仅是你，那个躺在医院里的老太婆也别想安生……”\n音频扒下了严寒衣冠楚楚的伪装，露出了他威逼利诱冷血嘴脸。\n弹幕在那一刻，出现了诡异的停顿。\n紧接着，整个直播间炸锅了。\n“草！这男的太恶心了！”\n“这哪里是潜规则，这是黑社会性质的敲诈勒索吧？！”\n“反转了！许栀是去录音取证的！她根本没妥协，她太刚了！”\n我看着飙升的热度，对着镜头开口：\n“严寒，你以为交出手机，搜了身，我就没办法了吗？”\n“这段录音，我已经同步发给了警方。”\n另一边，经纪公司的高层会议室里早已乱作一团。\n林姐和公司高管们看着直播间里引爆的舆论，冷汗直流。\n他们原本还想把原主当成礼物送给严寒，\n但现在事情的性质已经从娱乐八卦升级成了违法犯罪。\n严寒如今玩脱了。\n稍有不慎，公司都会作为拉皮条的从犯被牵连进去。\n“快！把之前所有的通稿全撤了！”\n公司高层在会议室里咆哮，\n“马上发声明，把公司和严寒的关系摘干净！快啊！”\n我的手机屏幕亮了，一条来自林姐的信息弹了出来：\n“小栀，公司决定挺你，严寒的事我们全不知情。”\n“你先下播，我们好好谈谈后续的公关。”\n我对着直播间的镜头，将手机屏幕怼到了镜头前。\n“看，原来落井下石的人，翻脸也可以这么快。”\n众人还在震惊于经纪公司的无耻时，直播间的连麦申请响了起来。\n来电显示，居然是严寒本人。\n\n需要带过来的事实 carried_facts：\n[\n {\n  \"fact\": \"严寒录音曝光后，主角拒绝连麦，宣布证据已发警方，严寒实业股价跌停、合作方解约，警方立案调查。\",\n  \"source_chapter\": 8,\n  \"replant\": \"续写第1章通过主角切断直播后的手机新闻推送和内心独白快速交代。\"\n },\n {\n  \"fact\": \"苏菲代言解约，S级剧换人，水军头子被立案调查。\",\n  \"source_chapter\": 8,\n  \"replant\": \"续写前段通过娱乐新闻或苏菲求饶电话交代。\"\n },\n {\n  \"fact\": \"经纪公司发布致歉信，推责林姐，附无条件解约协议书，主角签字发送。\",\n  \"source_chapter\": 8,\n  \"replant\": \"续写第2章主角收到解约协议邮件，签字后长舒一口气。\"\n },\n {\n  \"fact\": \"奶奶在主角拍完电影后回光返照，识破主角不是原主，感谢她后安详离世。\",\n  \"source_chapter\": 9,\n  \"replant\": \"续写第9-10章重新演绎奶奶临终场景，保留识破身份和感谢的核心情感。\"\n },\n {\n  \"fact\": \"主角扎进剧组大半年，电影公映后获全网好评，撕掉废柴花瓶标签。\",\n  \"source_chapter\": 9,\n  \"replant\": \"续写中段用剧组蒙太奇和影评片段交代。\"\n }\n]\n\n已写的续写章节：\n## 第8章\n直播间里，连麦申请的铃声像催命符一样响个不停。\n\n屏幕上，严寒的头像疯狂闪烁。\n\n弹幕已经刷疯了：\n\n“接啊！看他还有什么话说！”\n\n“严总这是要当众道歉吗？”\n\n“许栀别怂！”\n\n我对着镜头，嘴角扯出一个弧度，鼠标移向那个闪烁的红色按钮。\n\n按了下去。\n\n连麦界面瞬间黑屏，只剩下弹幕区满屏的问号。\n\n“严寒，你以为我会给你一个当众表演的机会？”\n\n我把键盘拉到面前，手指飞快地敲下一行字，同步到直播间公告栏。\n\n“互联网不是法外之地，严总，留着你的话去跟警察解释吧。”\n\n发送。\n\n然后，我点击了关闭直播。\n\n屏幕暗下去的前一秒，弹幕定格在刷屏的问号上。\n\n手机开始疯狂震动，各种推送像洪水一样涌进来。\n\n第一条，来自财经快讯：\n\n【严寒实业股价断崖式跌停，市值蒸发超三十亿。】\n\n第二条，来自娱乐前线：\n\n【严寒名下多家公司遭合作方紧急切割，已有三个品牌方宣布终止合作。】\n\n第三条，来自社会新闻：\n\n【警方已就“网络造谣及资本胁迫案”正式立案，严寒被限制出境。】\n\n我把手机屏幕转向电脑摄像头，录了一小段视频，发到个人主页。\n\n配文只有一行字：\n\n“完整录音与数据证据链，已提交警方。后续进展，依法公开。”\n\n做完这些，我靠在椅背上，长出一口气。\n\n邮箱弹出一封新邮件，是经纪公司法务部发来的。\n\n我点开。\n\n一封致歉信，用词恳切，把所有责任推给了林姐，说她是“个人行为，公司事先并不知情”。\n\n附件里，是一份无条件解约协议书。\n\n我快速扫了一遍条款，确认没有陷阱，签上“许栀”两个字，点击发送。\n\n屏幕弹出“发送成功”的提示时，我盯着那两个字看了很久。\n\n第一次觉得，这个名字，这具身体，真正属于我了。\n\n手机响了，来电显示：苏菲。\n\n我按下接听，没说话。\n\n“许栀……栀姐，之前的事是我不对，我一时糊涂，你大人不记小人过……”\n\n苏菲的声音在发抖，背景里隐约有人在催她，“菲姐，品牌方那边催着要解约函……”\n\n“你代言掉光了，戏也换人了，才想起给我打电话？”\n\n我语气很平。\n\n“不是，你听我说，那些水军都是严寒让我买的，我也是被逼的……”\n\n“你被逼的？”\n\n我笑了一声，\n\n“苏菲，你发给我的私信，我可都存着呢。”\n\n“你……你想怎么样？”\n\n“不想怎么样。”\n\n我挂了电话，顺手把她的号码拖进黑名单。\n\n娱乐新闻的推送紧接着弹出来：\n\n【苏菲多个代言遭品牌方火速解约，S级古装剧《长歌行》宣布换人，原定女主苏菲被替换。】\n\n我把手机扔到桌上，目光落在桌角那本日记本上。\n\n那页被撕掉的痕迹还在。\n\n我伸手翻到那个缺口，夹层里滑出一张旧照片。\n\n照片上，两个女孩站在孤儿院门口，笑得灿烂。\n\n左边那个，是原主许栀，扎着马尾，左手腕上有一道明显的疤。\n\n右边那个，我不认识，照片背面用圆珠笔写着两个字：\n\n陈雯。\n\n我把照片翻过来，盯着那个名字。\n\n左手有疤。\n\n我想起医院护工白天打来的那通电话，说奶奶昏迷中一直在喃喃“栀栀左手有疤”。\n\n我低头看了看自己的左手，光滑，干净，一道疤都没有。\n\n正想着，手机屏幕又亮了。\n\n一条来自陌生号码的短信，只有一句话：\n\n“许栀，你还记得陈雯吗？”\n\n我攥紧那张旧照片，屏幕的光映在“陈雯”两个字上，格外刺眼。\n\n## 第9章\n水军头子被立案调查的消息上了热搜第三。\n\n词条后面跟着一个橙色的“热”字。\n\n警方通报写得清清楚楚：某营销公司负责人因涉嫌非法经营、寻衅滋事被刑事立案，名下多个账号已封禁。\n\n评论区有人贴出截图，是那家营销公司的内部报价单，明码标价“黑热搜套餐”“控评套餐”。\n\n“原来我们看到的每一个热搜，都是花钱买出来的。”\n\n“复盘了一遍整个事件，越看越头皮发麻。”\n\n风向变了。\n\n我关掉网页，拿起车钥匙出门。\n\n中心医院走廊里，王医生拿着最新的检查报告。\n\n“许小姐，老太太这次挺过来了，但心衰的基础还在。”\n\n他翻到第二页，指了几项指标，\n\n“随时可能反复，你要有心理准备。”\n\n“我明白。”\n\n我点了点头。\n\n“奶奶现在能转院吗？”\n\n“可以，但我建议再观察两天。”\n\n“那就后天。”\n\n从医院出来，我直接开车去了那家私立医院。\n\n签完特护病房的合同，一次性刷了七位数，足够奶奶住很多年。\n\n回到中心医院，我坐在奶奶床边。\n\n她闭着眼睛，呼吸很轻。\n\n我伸手握住她的手腕，枯瘦，皮肤薄得能看见血管。\n\n“栀栀……”\n\n奶奶忽然动了动嘴唇，声音含混不清。\n\n我凑近了些。\n\n“栀栀左手有疤……我记得的……”\n\n我低头看了一眼自己的左手。\n\n光滑，干净，一道疤都没有。\n\n老人糊涂了。\n\n我松开她的手，把被角掖好。\n\n手机在口袋里震了一下。\n\n“许栀女士，陈导新项目《暗河》正式确认由您出演女一号。下周三进组，片酬按S级结算。”\n\n紧跟着又是一条：\n\n“另外三个品牌方发来代言意向，资料已发您邮箱。”\n\n我回了“收到”。\n\n深夜，我坐在病房外，手机屏幕的冷光映在脸上。\n\n一个小号跳了出来。\n\n头像用的是苏菲侧脸，ID叫“菲常无语”，发了一条文字：\n\n“有些人靠卖惨博同情，靠偷录别人隐私上位，真以为自己是清白圣女了。”\n\n配图是一张模糊的聊天记录截图，上面写着“许栀：需要我陪你吗”。\n\n假的。\n\n我截图，存进加密文件夹。\n\n回到公寓，我开始整理原主的旧物。\n\n日记本还摊在桌上，被撕掉的那页痕迹很明显。\n\n我翻到最后一页夹层，那张旧照片滑出来。\n\n两 \n我把手机调成静音，来电记录截屏存档。\n\n门铃响了。\n\n从猫眼看出去，楼道里挤满了人。长焦镜头、摄像机、举着手机直播的博主。\n\n“许栀！出来说两句！”\n\n“你左手敢不敢伸出来给大家看看！”\n\n“你是不是已经死了？现在是谁在操控你的身体？”\n\n我拉上窗帘，坐回电脑前。\n\n邮箱里躺着一封新邮件，发件人是经纪公司法务部。\n\n“许栀女士，鉴于目前舆论涉及重大公共关切，公司要求您于今日下午三时前提交三甲医院出具的身体检查报告，包括但不限于指纹、疤痕、DNA比对。”\n\n“如拒绝配合，公司将视为您单方面放弃所有申辩权利。”\n\n我敲下回复：“拒绝。”\n\n发送。\n\n王医生的电话打进来，我接了。\n\n“许小姐，老太太今天下午突然心律不齐，刚抢救过来。”\n\n他压低声音。\n\n“她一直在喊你的名字，你方便过来一趟吗？”\n\n“我马上到。”\n\n我抓起大衣和车钥匙，走到门口。\n\n猫眼里，狗仔还堵在楼道。\n\n我拉开门的瞬间，闪光灯像暴雨一样砸过来。\n\n“许栀！说两句吧！”\n\n“你到底是人还是鬼！”\n\n有人把镜头怼到我脸上，有人伸手拽我的包带。\n\n我冷着脸，一个字没说，挤开人群往电梯走。\n\n一个代拍追上来，镜头几乎戳到我鼻尖：“你左手敢伸出来吗？就一下！”\n\n我停下脚步，转头看他。\n\n“让开。”\n\n声音不大，但那人愣了一下，后退半步。\n\n我进了电梯，按下关门键。\n\n医院走廊弥漫着消毒水味。\n\n王医生在病房门口等我，表情凝重。\n\n“刚打了镇静，现在睡了。”\n\n他翻开病历，“心衰加重，不能再受刺激。”\n\n“网上的事，病房里有人刷到了？”\n\n王医生沉默两秒。\n\n“隔壁床的家属在看直播，声音外放。”\n\n我推开病房门，奶奶躺在床上，鼻子里插着氧气管，胸口微弱起伏。\n\n床头柜上，一部旧手机屏幕还亮着。\n\n上面正在播放一段视频，标题是“许栀奶奶亲口指认：她不是我孙女”。\n\n播放量已经过百万。\n\n剪辑者把奶奶在病床上的呓语，配上了阴森的背景音乐和字幕特效。\n\n评论区第一条：“连亲奶奶都不认她，这还有什么好说的？”\n\n我伸手关掉视频，把手机扣在桌上。\n\n指节在发抖。\n\n我走到走廊尽头，靠着墙，慢慢滑坐到地上。\n\n消毒水的气味钻进鼻腔，走廊里人来人往，有人推着器械车经过，轮子碾过地砖发出刺耳的声响。\n\n我闭上眼。\n\n原主留下的旧手机还揣在我大衣口袋里，硌着肋骨。\n\n我把它摸出来，握紧。\n\n奶奶的声音还在脑子里转——“你不是我的栀栀”。\n\n我知道她没说错。\n\n我确实不是。\n\n但我不能认。\n\n认了，原主就白死了。\n\n认了，严寒就赢了。\n\n认了，奶奶就没人管了。\n\n我睁开眼，从地上站起来。\n\n走到护士站借了台电脑，连上我的私有云端。\n\n手指在键盘上敲了第一行指令。\n\n林姐的银行流水，我早就爬下来了。之前没动，是因为没到清算的时候。\n\n现在到了。\n\n我调出她近半年的转账记录，按时间排序。\n\n一笔一笔筛。\n\n凌晨两点十七分，一笔大额转出。\n\n收款方是一家注册在维京群岛的空壳公司。\n\n我放大收款账户信息，往下翻。\n\n实控人一栏，清清楚楚写着两个字。\n\n严寒。\n\n## 第14章\n林姐的转账记录不止一笔。\n\n我继续往下翻，收款方那家维京群岛空壳公司，半年内从林姐账户吸走了三百多万。每笔转账的时间节点，都卡在原主拒绝严寒之后的第三天、第五天、一周后。\n\n我调出林姐的邮件备份，之前从经纪公司服务器里一并爬下来的。\n\n搜索关键词：许栀。\n\n三百多封邮件，我按时间倒序排列，筛出她和严寒助理的往来。\n\n第一封，去年十一月。严寒助理发来一份名单，上面列了七个女艺人，许栀排在最后。\n\n林姐回复：“许栀最难搞，奶奶那边可以下手。”\n\n第二封，十二月。严寒助理发来一个压缩包，里面是伪造的医美病历和第一批黑图。\n\n林姐回复：“收到，明天安排营销号发。”\n\n第三封，今年一月。林姐主动发了一组许栀的私人行程表，包括奶奶住院的科室、床号、主治医生。\n\n邮件末尾加了一句：“严总放心，她跑不掉。”\n\n我把所有邮件按时间轴整理，配上转账记录、聊天截图，做成一份完整的证据链文档。\n\n三百七十四页。\n\n做完这些，天已经黑了。\n\n我没有急着发。\n\n现在发出去，最多让林姐进去蹲几年。严寒已经批捕，苏菲掉了代言，这些都不够。\n\n我要等。\n\n等到一个所有目光都聚焦的时刻，一次性清算。\n\n手机震了一下，苏菲发了条微博，配图是她在某品牌活动上的精修照。\n\n“清者自清，浊者自浊。有些人忙着编故事，有些人忙着往前走。”\n\n评论区水军整齐刷屏：“姐姐好美”“不跟糊咖计较”。\n\n我转发了她的微博，只加了四个字：“清者自清。”\n\n评论区瞬间两极分化。\n\n“许栀终于回应了！”\n\n“就四个字？疤的事不解释？”\n\n“人家忙着拍戏，谁像你们天天盯着别人左手看。”\n\n“我信她，那份技术鉴定报告不是一般人能拿出来的。”\n\n“信她个鬼，夺舍实锤！”\n\n我没有再看。舆论稳住了，两边吵得越凶，热度维持得越久。等终局到来，所有的质疑都会变成打向林姐和苏菲的子弹。\n\n第二天早上，一条微信好友申请弹出来。\n\n验证消息：“陈导。”\n\n我通过。\n\n对方直接发来一段语音，声音沙哑，带着片场特有的嘈杂背景音。\n\n“许栀，我看了你那场直播。别人看热闹，我看门道。”\n\n“你对着十万条辱骂，手没抖，声没颤，眼睛里全是算计。这种心理素质，我下部戏的女主角，非你不可。”\n\n紧接着，一份电子合同发过来。\n\n电影项目：《暗河》。\n\n现实主义悬疑题材，女主角是个被诬陷杀人的法医，全片一百二十七场戏，一百零三场有她。\n\n片酬那一栏，填的是S级顶格。\n\n我翻到合同最后一页，导演已经签了字。\n\n我回复：“陈导，我接。”\n\n他秒回：“下周三进组。把你左手的事处理好，别让剧组为难。”\n\n“明白。”\n\n我关掉对话框，把合同转发给律师存档。\n\n下午，我开车去了私立医院。\n\n奶奶躺在特护病房里，鼻氧管换成了面罩，脸色比上次好了一些。\n\n王医生在走廊拦住我。\n\n“许小姐，老太太的情况暂时稳住了。心衰的基础还在，但私立医院这边的设备和护理跟上了，短期内不会有危险。”\n\n他顿了顿。\n\n“不过她清醒的时间越来越少，你要有心理准备。”\n\n“我明白。”\n\n我走进病房，坐在床边。\n\n奶奶的眼皮动了动，没有睁开。嘴唇翕了两下，声音太轻，我听不清。\n\n我握住她的手。\n\n枯瘦，冰凉，指节因为常年输液而泛着青紫。\n\n“奶奶，我要去拍戏了。”\n\n她的手指在我掌心里微微动了动。\n\n“拍完这部戏，我就能洗掉所有脏水。”\n\n“到时候，我推你去看首映。”\n\n奶奶的嘴角好像弯了一下，又好像没有。\n\n我坐了很久，直到护士进来换药，才起身离开。\n\n走出病房，手机屏幕亮了。\n\n一条来自陌生号码的短信，只有六个字：“替身，颁奖礼见。”\n\n号码归属地查不到，但语气我认得。\n\n苏菲。\n\n我把短信截图，存进加密文件夹。\n\n文件夹命名：“终局”。\n\n里面整整齐齐码着林姐的三百七十四页证据链、苏菲的私信截图、陈雯在网吧的上机记录，还有奶奶病房被骚扰那天的监控备份。\n\n我删掉苏菲的短信，打开加密文件夹，最后检查了一遍文件结构。\n\n所有证据分成三份，设置了三个不同的定时触发节点。\n\n第一份，颁奖礼红毯开始前两小时，自动投递给三家媒体。\n\n第二份，颁奖礼最佳女主角揭晓的瞬间，自动上传至网信办举报平台。\n\n第三份，如果前两份被拦截，四十八小时后，自动群发至全网所有主流社交平台。\n\n文件名：终局。\n\n我合上电脑，把旧手机从抽屉里取出来，和加密硬盘一起锁进保险柜。\n\n站起身，走到窗前。\n\n楼下没有狗仔了。\n\n远处，城市的天际线亮起万家灯火。\n\n## 第15章\n进组第一天，陈导没让我试戏。\n\n他把剧本扔给我，指了指监视器旁边的折叠椅。“坐那儿看，看三天。”\n\n我没问为什么。坐下来，翻开剧本。\n\n女主角叫沈遥，法医，被指控伪造尸检报告。全片核心冲突是：她到底有没有篡改数据。\n\n陈导拍戏不用分镜脚本，现场走位全靠演员自己找。第一场审讯戏，他让男主即兴发挥，台词随便说。\n\n监视器里，男主拍桌怒吼：“你改了报告！你收了钱！”\n\n沈遥的台词本上只有一句：“我没有。”\n\n我盯着剧本上那三个字，忽然想到一件事。\n\n原主被全网骂的时候，说过最多的话也是“我没有”。没人信。\n\n我把剧本合上，掏出手机，打开备忘录。\n\n写下一行字：沈遥的动机不是自证清白，是让死者的数据开口说话。\n\n第二天，陈导拍沈遥在停尸房解剖尸体的戏。道具组准备了假人模型，内脏是硅胶做的。\n\n我戴上手套，拿起手术刀。\n\n陈导在监视器后面喊：“不用真解剖，你做个样子就行。”\n\n我没停。刀尖划过硅胶胸腔的时候，我开口：“沈遥不会做样子。”\n\n“她每割一刀，都是在跟死者对话。”\n\n“她关心的不是自己会不会坐牢，是这具尸体有没有被误判。”\n\n陈导没喊卡。\n\n监视器后面安静了十几秒。\n\n收工的时候，副导演跑过来递给我一杯咖啡。“陈导让我给你的。”\n\n我接过来，喝了一口。速溶的，三合一。\n\n“陈导还说，”副导演压低声音，“你昨天在备忘录写的那句话，他看到了。”\n\n我愣了一下。\n\n“他说，你眼里有东西。不是演出来的。”\n\n第三天，陈导加了一场戏。沈遥深夜独自在档案室翻卷宗，翻到一份被涂改的尸检记录。没有台词，全靠眼神和手部动作。\n\n我坐在档案架前，一页一页翻。\n\n翻到第七页的时候，手指停住。纸张边缘有一道被撕掉又粘回去的痕迹。\n\n我用指甲沿着胶水印刮了一下。\n\n陈导没喊停。摄影机推近，特写我的手指。\n\n我抬起头，目光落在档案架最顶层那排落灰的文件夹上。\n\n“卡。”\n\n陈导从监视器后面站起来，走到我面前。“你怎么知道那页有撕痕？”\n\n“道具组做旧的时候胶水涂多了，纸张膨胀系数不一样。”\n\n陈导看了我三秒，转头对制片人说：“看见没？这姑娘眼里有故事，不是花瓶。”\n\n制片人点头，在本子上记了什么。\n\n剧组生活规律得像代码。\n\n早上六点出工，晚上八点收工。盒饭两荤一素，我吃了两周，瘦了三斤。\n\n收工后回酒店，洗完澡，打开电脑。\n\n林姐的银行流水我已经爬完了。三百多万，分十七笔，全部转入那家维京群岛空壳公司。\n\n但空壳公司不止收了她的钱。\n\n我顺着那家公司的收款账户往下扒。注册地在海外，实际运营IP在境内。服务器日志里藏着更深的链路。\n\n凌晨一点，我写了个脚本，抓取该公司近一年的所有资金往来。\n\n数据跑完，屏幕上跳出一张关系图。\n\n三个节点：林姐、苏菲、严寒。\n\n三人的资金全部汇入同一家空壳公司，再由公司分散转出到十几个营销号账户。\n\n林姐打款时间，对应原主黑料爆发前三天。\n\n苏菲打款时间，对应她每次发阴阳微博的前一天。\n\n严寒打款时间，贯穿始终。\n\n证据链闭环。\n\n我把关系图截图，连同银行流水、邮件备份、聊天记录，打包成一个加密压缩包。\n\n然后分三份存。\n\n一份拷进离线硬盘，锁进酒店保险柜。\n\n一份上传私有云端，设置二次验证。\n\n一份发给律师，附言：“终局证据，等我指令。”\n\n做完这些，凌晨三点。\n\n我合上电脑，躺在床上。\n\n手机屏幕亮了。林姐发了条微博，配图是一张模糊的聊天记录截图。\n\n“下周，许栀的真面目将全网公开。有些事，不是会写代码就能盖住的。”\n\n评论区水军整齐刷屏：“坐等实锤”“这次看她怎么洗”。\n\n我截了图，存进“终局”文件夹。\n\n没有回复。没有动作。\n\n舆论继续发酵。林姐的爆料预告挂在热搜尾巴上，像一颗定时炸弹。\n\n我不急。她手里的牌，我全知道。\n\n第四周，陈导拍最后一场重头戏。沈遥在法庭上做最终陈述。\n\n剧本只有半页纸，陈导说：“你自己写词。”\n\n我站在法庭布景的证人席上，灯光打过来。\n\n“我解剖过一百三十七具尸体。”\n\n“每一具，都带着真相。只是有人不想听。”\n\n“我改报告，是因为原报告错了。我坚持，是因为死者不会说谎。”\n\n“如果坚持真相是一种罪，那我认。”\n\n陈导没喊卡。全场安静。\n\n他站起来，鼓掌。\n\n收工回酒店，我打开保险柜，取出原主的旧手机。\n\n屏幕还是碎的，但系统能跑。我插上数据线，把之前修复出来的文件挨个点开。\n\n相册、备忘录、通话记录。\n\n最后一个文件夹，名字是“给奶奶”。\n\n我点开。\n\n里面只有一段语音，录制时间是原主去世前一周。\n\n我按下播放键。\n\n原主的声音很轻，带着笑。\n\n“奶奶，等我红了就接你回家。”\n\n“我给你买个大房子，带花园的那种。”\n\n“你每天晒晒太阳，我收工回来给你做饭。”\n\n“你一定要等我啊。”\n\n语音结束。\n\n我攥着手机，喉咙发紧。\n\n屏幕暗下去。\n\n## 第16章\n语音播完，屏幕暗下去。\n\n我攥着旧手机，指节发白。\n\n过了很久，我把手机重新插上数据线，打开修复软件。原主的视频文件损坏严重，画面撕裂，音轨断成十几段。我写了个脚本，逐帧提取关键帧，用AI模型补全缺失像素，再做时序对齐。\n\n凌晨四点，第一段清晰影像跑出来。\n\n原主坐在出租屋的床边，穿着洗旧的睡衣，手里攥着手机。她对着镜头练习微笑，嘴角抽动，笑得很僵。\n\n“导演说，镜头前要自然一点。”\n\n她自言自语，又练了一遍。\n\n第二段，她在片场角落背台词，旁边有人喊“许栀，到你了一—”，她猛地站起来，剧本掉在地上。\n\n第三段，她在医院走廊打电话，声音压得很低。“王医生，靶向药能不能再宽限几天……我下个月一定凑齐。”\n\n我一段一段看下去。\n\n最后一段视频，文件名是“给奶奶”。\n\n她坐在一间光线很暗的房间里，背景是医院的走廊。她对着镜头，眼睛红肿，但嘴角努力往上扬。\n\n“奶奶，我在外面拍戏呢，导演说我演得特别好。”\n\n“你 \n“否则，你知道我的手段。”\n回到公寓，我反锁房门，打开电脑。\n切入私有云端，刚才那段长达十五分钟的对话音频已经躺在加密区。\n我敲击键盘输入密钥，将乱码解码为清晰的音频文件。\n接着，我翻出原主之前备份的早期威胁短信截图。\n我明白，利用主流网站揭露这些行不通，\n那我只好采取些非常手段。\n为了避开经纪公司的网络监控，我从口袋里摸出一张电话卡。\n这是今天去医院时，我趁乱从奶奶的旧手机里拔出来的。\n插卡，联网。\n我切入暗网，购买了三个境外的僵尸网络节点作跳板，\n将音频和短信截图，连同图片造假鉴定报告进行多重加密打包。\n一份通过内网通道直达网信办举报中心；\n一份发给早已拟定好合同的顶尖维权律师；\n最后一份，我写了一个延时触发的脚本，\n匿名投递给国内三家以绝不妥协著称的媒体主编邮箱。\n做完这一切，天已经亮了。\n早上八点，严寒的微信准时发了过来：\n“考虑得怎么样了？”\n我果断地回复，\n“我考虑过了，我不同意。”\n“别敬酒不吃吃罚酒，得罪我，我保证让你在这个圈子里混不下去！”\n我冷笑一声，\n一边切屏给律师发送行动的指令，一边在对话框里敲下回复：\n“你还是准备好，担心担心你自己吧。”\n\n## 第5章\n“砰！”\n我公寓的防盗门传来一声巨响。\n紧接着，是严寒打来的视频通话。\n我按下接听，画面里，严寒身后的背景赫然是医院重症住院部的走廊！\n“许栀，你敢跟我耍花招？找死！”\n他将镜头对准前方几个黑衣壮汉\n与此同时，我公寓的防盗门锁报废，防盗门倒塌掀起一阵尘土。\n三个提着钢管的壮汉盯着我，步步逼近。\n手机屏幕里，严寒叫嚣的声音震得我耳膜生疼：\n“我让你装！我现在就拔了这老东西的管子！”\n我倚靠在椅背上，嘴角勾起嘲讽：\n“你拔啊。”\n视频中，黑衣人掀开病床上的被子。\n空的。\n严寒震惊地盯着屏幕里的空床。\n“人呢？！”\n“严总，你真以为我会放心把奶奶留在普通重症区？”\n我语气没有一丝起伏，\n“昨晚从会所出来，我就联系了私立医院。”\n“现在我奶奶躺在安保级别最高的特护病房。”\n“别说你的打手，连一只苍蝇都飞不进去。”\n“你想打扰她？下辈子吧。”\n“臭婊子，你敢耍我！”\n严寒在视频那头气急败坏。\n我挂断视频，按下桌上的遥控器，天花板四个角落的摄像头同时亮起红灯。\n“这是我的私人云端实时同步录像。”\n“另外，十分钟前我已经报了警。”\n我晃了晃手机，窗外刚好传来由远及近的警笛声，\n“要试试这钢管砸下来，你们能判几年吗？”\n三人脸色一变，对视一眼，骂骂咧咧地夺门而逃。\n危机解除。\n我跨过一地狼藉，重新坐回电脑前，拨通了律师的电话。\n等待接通时，我瞥见原主日记本摊在桌角，一页被撕掉，夹着张旧照片，背面写着“陈雯，等我红了就去找你”。\n“动手吧。”\n五分钟后，一份盖着公章的律师函发送到了经纪公司高层的邮箱里。\n除了解约声明，里面还附带了一份“大礼包”：\n林姐知情，且纵容协助严寒潜规则旗下艺人的聊天记录和邮件往来。\n另一边，严寒察觉到了部分证据已经开始外泄。\n我的网络监测探针显示，各大平台的敏感词库正在被更新。\n严寒急眼了。\n雷霆大怒之下，他开始疯狂砸钱，动用庞大的公关力量全网删帖。\n热搜榜上，关于他公司的词条迅速被撤下，\n吃瓜群众发出的质疑贴不到一分钟就被删，\n大批高级水军下场，强行把水搅浑。\n叮的一声，严寒的短信发了过来：\n“只要钱到位，互联网就不会有你的记忆！”\n“你奶奶躲得过初一躲不过十五，走着瞧！”\n看着这句狠话，我只觉得可笑。\n我已经切断了他打探病房信息的渠道。\n他现在的威胁，不过是落空后的无能狂怒。\n电脑屏幕右下角，一个红色的倒计时窗口正在安静地跳动。\n“3、2、1……”\n进度条拉满，定时投递脚本触发成功。\n三封加密邮件，滑入了三家深度调查媒体主编的收件箱。\n\n## 第6章\n这三家媒体以不畏强权、死磕真相在业内著称。\n严寒的资本手腕能买通营销号，却买不动这些真正的新闻人。\n两小时后，早上八点整，早高峰通勤的节点。\n原本被严寒水军搅得乌烟瘴气的社交平台，撕开了一道口子。\n没有预热，没有娱乐圈惯用的八卦噱头，\n三家深度调查媒体全网同步推送了一篇万字长文。\n标题字字见血：\n《赛博猎巫的背后：资本胁迫、技术造假与一场完美的网络谋杀》。\n文章开篇，甩出了我那份长达三十页的图像技术鉴定报告。\n作为资深码农，我给出的证据链是降维打击级别的。\n报告里放大了所谓“医美现场图”的所有噪点，详细展示了ELA热力图，\n甚至直接提取了图片底层的EXIF数据，\n将拼接合成的操作痕迹、修改时间和部分硬件特征，展示得清清楚楚。\n这篇报道像一枚深水炸弹，引爆了整个网络。\n“卧槽！作为一个十年后期修图师的我头皮发麻。”\n“这报告太硬了，这根本不是什么吃瓜，这是高技术犯罪啊！”\n“看懂了，图片是P的，就医记录是假的，连所谓的知情人士是虚拟账号。”\n“我去，我们全被当枪使了！”\n“细思极恐……如果许栀拿不出这份报告，她现在是不是已经被逼上绝路了？”\n风向变了。\n原本满屏的荡妇羞辱和谩骂，转变成了对资本只手遮天的恐惧与愤怒。\n这不再是一桩茶余饭后的戏子黑料，\n而是被严肃定性为一桩涉及资本胁迫的网络暴力案件。\n那些原本跟着带节奏的大V们悄悄删除微博，理智的路人成批觉醒。\n严寒慌了。\n后台监测仪上，我看到大量异常流量正在冲击这三家媒体的服务器。\n严寒的水军涌入评论区，试图用以往那种胡搅蛮缠的方式把水再次搅浑。\n他甚至动用了最高级别的公关预案，试图花重金强行撤掉热搜词条。\n但这次，他踢到了铁板。\n这三家硬核媒体背后，是坚不可摧的公信力和新闻底线。\n严寒的团队绝望地发现，他们的资本权限在这里根本不管用。\n不仅文章删不掉，反而因为短时间内触发了平台的异常压制机制，\n被系统判定为重大社会事件，强推上了各大首页的置顶位，全网飘红。\n真相如同决堤的洪水，势不可挡。\n我坐在电脑前，看着数据监控面板。\n代表“许栀澄清”、“资本网暴”的词条指数正在呈指数级狂飙，\n而严寒关联实业公司的网络风评和股市预期，则断崖式暴跌。\n局势逆转，一切都在计算之中。\n我正准备关掉网页，去医院看望奶奶，\n医院护工来电，说奶奶昏迷中喃喃“栀栀左手有疤”。我低头看自己光滑的左手，只当是老人胡话。\n电脑屏幕右下角的监控雷达突然发出一声尖锐的红色警报。\n一条全新的词条，突破了媒体的封锁，空降热搜榜第一。\n词条后面，跟着一个刺眼的的深红色“爆”字。\n许栀主动投怀送抱，会所监控流出\n我盯着这条热搜，眼睛微微眯起。\n\n## 第7章\n鼠标点开那个刺目的“爆”字。\n屏幕上弹出一段三十秒的无声监控视频。\n画面正是我昨晚走进那家私人会所包厢的场景。\n因为角度刁钻，视频里的我看起来像是顺从地交出手机，\n任由保镖搜身后走进了光线昏暗的包厢。\n视频末尾还被恶意剪辑了一段我靠近严寒倒水的画面，\n没有声音，加上模糊处理的滤镜，看起来就像是我在主动投怀送抱。\n营销号的配文更是恶毒：\n“所谓的技术流澄清不过是洗白手段。”\n“事实是许栀早已向资本低头，深夜主动赴约，企图用身体平息风波。”\n严寒这手脏牌打得真是时候。\n他想利用大众对娱乐圈潜规则的固有偏见，\n将我钉死在“当了婊子还立牌坊”的耻辱柱上。\n我没慌，反而笑了。\n等的就是他这步棋。\n现在全网都在盯着我，流量达到了巅峰。\n我打开手机，登上了公司归还的账号，点击开启直播。\n没有预热，开播瞬间直播间涌入了十万人。\n弹幕狂刷，夹杂着不堪入目的词汇。\n我没理会这些，把昨晚那枚胸针摘下来，摆在镜头前。\n“大家都在看严总放出的无声电影。”\n“既然剧情这么精彩，不配点原声怎么行？”\n我将胸针连接电脑，手指敲击回车键。\n我编写的加密程序，绕过防火墙，解压提取音频。\n一段清晰无比的对话，传遍了整个网络。\n“许栀，你是个聪明人。”\n“只要你今晚留下，所有的黑料我十分钟内就能让它们消失。”\n这是严寒的声音，带着不加掩饰的傲慢。\n紧接着，是我冷静的质问：\n“所以，那些医美假照还有买通营销号的造谣，全是你干的？”\n“是我又怎么样？”\n“在这个圈子里，资本就是规矩。\n“不顺从我，你连翻身的机会都没有！”\n“不仅是你，那个躺在医院里的老太婆也别想安生……”\n音频扒下了严寒衣冠楚楚的伪装，露出了他威逼利诱冷血嘴脸。\n弹幕在那一刻，出现了诡异的停顿。\n紧接着，整个直播间炸锅了。\n“草！这男的太恶心了！”\n“这哪里是潜规则，这是黑社会性质的敲诈勒索吧？！”\n“反转了！许栀是去录音取证的！她根本没妥协，她太刚了！”\n我看着飙升的热度，对着镜头开口：\n“严寒，你以为交出手机，搜了身，我就没办法了吗？”\n“这段录音，我已经同步发给了警方。”\n另一边，经纪公司的高层会议室里早已乱作一团。\n林姐和公司高管们看着直播间里引爆的舆论，冷汗直流。\n他们原本还想把原主当成礼物送给严寒，\n但现在事情的性质已经从娱乐八卦升级成了违法犯罪。\n严寒如今玩脱了。\n稍有不慎，公司都会作为拉皮条的从犯被牵连进去。\n“快！把之前所有的通稿全撤了！”\n公司高层在会议室里咆哮，\n“马上发声明，把公司和严寒的关系摘干净！快啊！”\n我的手机屏幕亮了，一条来自林姐的信息弹了出来：\n“小栀，公司决定挺你，严寒的事我们全不知情。”\n“你先下播，我们好好谈谈后续的公关。”\n我对着直播间的镜头，将手机屏幕怼到了镜头前。\n“看，原来落井下石的人，翻脸也可以这么快。”\n众人还在震惊于经纪公司的无耻时，直播间的连麦申请响了起来。\n来电显示，居然是严寒本人。\n\n需要带过来的事实 carried_facts：\n[\n {\n  \"fact\": \"严寒录音曝光后，主角拒绝连麦，宣布证据已发警方，严寒实业股价跌停、合作方解约，警方立案调查。\",\n  \"source_chapter\": 8,\n  \"replant\": \"续写第1章通过主角切断直播后的手机新闻推送和内心独白快速交代。\"\n },\n {\n  \"fact\": \"苏菲代言解约，S级剧换人，水军头子被立案调查。\",\n  \"source_chapter\": 8,\n  \"replant\": \"续写前段通过娱乐新闻或苏菲求饶电话交代。\"\n },\n {\n  \"fact\": \"经纪公司发布致歉信，推责林姐，附无条件解约协议书，主角签字发送。\",\n  \"source_chapter\": 8,\n  \"replant\": \"续写第2章主角收到解约协议邮件，签字后长舒一口气。\"\n },\n {\n  \"fact\": \"奶奶在主角拍完电影后回光返照，识破主角不是原主，感谢她后安详离世。\",\n  \"source_chapter\": 9,\n  \"replant\": \"续写第9-10章重新演绎奶奶临终场景，保留识破身份和感谢的核心情感。\"\n },\n {\n  \"fact\": \"主角扎进剧组大半年，电影公映后获全网好评，撕掉废柴花瓶标签。\",\n  \"source_chapter\": 9,\n  \"replant\": \"续写中段用剧组蒙太奇和影评片段交代。\"\n }\n]\n\n已写的续写章节：\n## 第8章\n直播间里，连麦申请的铃声像催命符一样响个不停。\n\n屏幕上，严寒的头像疯狂闪烁。\n\n弹幕已经刷疯了：\n\n“接啊！看他还有什么话说！”\n\n“严总这是要当众道歉吗？”\n\n“许栀别怂！”\n\n我对着镜头，嘴角扯出一个弧度，鼠标移向那个闪烁的红色按钮。\n\n按了下去。\n\n连麦界面瞬间黑屏，只剩下弹幕区满屏的问号。\n\n“严寒，你以为我会给你一个当众表演的机会？”\n\n我把键盘拉到面前，手指飞快地敲下一行字，同步到直播间公告栏。\n\n“互联网不是法外之地，严总，留着你的话去跟警察解释吧。”\n\n发送。\n\n然后，我点击了关闭直播。\n\n屏幕暗下去的前一秒，弹幕定格在刷屏的问号上。\n\n手机开始疯狂震动，各种推送像洪水一样涌进来。\n\n第一条，来自财经快讯：\n\n【严寒实业股价断崖式跌停，市值蒸发超三十亿。】\n\n第二条，来自娱乐前线：\n\n【严寒名下多家公司遭合作方紧急切割，已有三个品牌方宣布终止合作。】\n\n第三条，来自社会新闻：\n\n【警方已就“网络造谣及资本胁迫案”正式立案，严寒被限制出境。】\n\n我把手机屏幕转向电脑摄像头，录了一小段视频，发到个人主页。\n\n配文只有一行字：\n\n“完整录音与数据证据链，已提交警方。后续进展，依法公开。”\n\n做完这些，我靠在椅背上，长出一口气。\n\n邮箱弹出一封新邮件，是经纪公司法务部发来的。\n\n我点开。\n\n一封致歉信，用词恳切，把所有责任推给了林姐，说她是“个人行为，公司事先并不知情”。\n\n附件里，是一份无条件解约协议书。\n\n我快速扫了一遍条款，确认没有陷阱，签上“许栀”两个字，点击发送。\n\n屏幕弹出“发送成功”的提示时，我盯着那两个字看了很久。\n\n第一次觉得，这个名字，这具身体，真正属于我了。\n\n手机响了，来电显示：苏菲。\n\n我按下接听，没说话。\n\n“许栀……栀姐，之前的事是我不对，我一时糊涂，你大人不记小人过……”\n\n苏菲的声音在发抖，背景里隐约有人在催她，“菲姐，品牌方那边催着要解约函……”\n\n“你代言掉光了，戏也换人了，才想起给我打电话？”\n\n我语气很平。\n\n“不是，你听我说，那些水军都是严寒让我买的，我也是被逼的……”\n\n“你被逼的？”\n\n我笑了一声，\n\n“苏菲，你发给我的私信，我可都存着呢。”\n\n“你……你想怎么样？”\n\n“不想怎么样。”\n\n我挂了电话，顺手把她的号码拖进黑名单。\n\n娱乐新闻的推送紧接着弹出来：\n\n【苏菲多个代言遭品牌方火速解约，S级古装剧《长歌行》宣布换人，原定女主苏菲被替换。】\n\n我把手机扔到桌上，目光落在桌角那本日记本上。\n\n那页被撕掉的痕迹还在。\n\n我伸手翻到那个缺口，夹层里滑出一张旧照片。\n\n照片上，两个女孩站在孤儿院门口，笑得灿烂。\n\n左边那个，是原主许栀，扎着马尾，左手腕上有一道明显的疤。 \n截图的底部，原主用红笔圈出了发信人的IP地址。\n\n我放大图片，把那串IP抄下来。\n\n然后打开电脑，反查归属地。\n\n城南，一家网吧的公共网络。\n\n网吧监控一般只保留三十天。但原主去世到现在，刚好二十八天。\n\n我深吸一口气，把IP地址和网吧名称记下来。\n\n手机屏幕又闪了一下。\n\n一条新短信，来自林姐。\n\n“许栀，明天上午十点，公司会议室。法务部要你当面解释左手疤痕的事。”\n\n“不来，就默认你放弃所有申辩权利。”\n\n我盯着这条短信，没有回复。\n\n退出短信界面，手机桌面还亮着。\n\n屏保上，原主蹲在奶奶轮椅旁，笑得灿烂。\n\n我把旧手机放进抽屉，锁好。\n\n然后打开电脑，继续追踪那个IP。\n\n网吧的登记系统有漏洞。\n\n我花了二十分钟拿到后台权限，调出二十八天前的上机记录。\n\n那个时间段，只有一个人用了那台机器。\n\n登记的名字是——\n\n陈雯。\n\n## 第13章\n直播开始的时候，我正在煮咖啡。\n\n手机架在料理台上，屏幕里林姐坐在访谈室的沙发上，妆容精致，语气沉痛。\n\n“作为许栀的前经纪人，我本来不想说这些。”\n\n她低头擦了擦眼角。\n\n“但我实在看不下去了。”\n\n陈雯坐在她旁边，低着头，手里攥着一张照片。\n\n主持人把话筒递过去。\n\n“陈女士，您和许栀是孤儿院时期的好友，您能确认什么？”\n\n陈雯抬起头，声音很轻。\n\n“她左手腕上有一道疤，五岁时摔在铁栅栏上缝了七针。”\n\n她举起那张旧照片，镜头推近，疤痕清清楚楚。\n\n“可现在的许栀，左手什么都没有。”\n\n主持人追问：“您是说，现在的许栀不是本人？”\n\n陈雯没回答，只是把手机连上了演播室音响。\n\n奶奶的声音传出来，虚弱，断续。\n\n“你不是我的栀栀……”\n\n“栀栀左手有疤……我记得的……”\n\n演播室安静了两秒。\n\n苏菲适时接话，语气关切：“我们都很担心栀栀的精神状态，如果她真的遇到了什么……”\n\n她顿了顿。\n\n“或者，被什么东西占据了身体，我们希望她能早点回来。”\n\n弹幕疯了。\n\n我关掉直播，咖啡已经凉了。\n\n打开微博，词条挂在热搜第一。\n\n#许栀被夺舍# 后面跟着深红色的“爆”。\n\n评论区置顶是营销号发起的投票：“你相信许栀被夺舍了吗？”\n\n七万人参与，六万三千票投了“相信”。\n\n“让她验疤！验不了就是心虚！”\n\n“这已经不是娱乐圈的事了，这是灵异事件！”\n\n“@网信办 @公安部 建议介入调查。”\n\n手机开始响。\n\n第一个电话是代言品牌方，对方语气为难：“许栀女士，我们总部那边压力很大，合同暂时中止，后续再联系。”\n\n第二个是剧组制片人：“定妆照先不拍了，投资方说要重新评估风险。”\n\n第三个、第四个、第五个。\n\n我把手机调成静音，来电记录截屏存档。\n\n门铃响了。\n\n从猫眼看出去，楼道里挤满了人。长焦镜头、摄像机、举着手机直播的博主。\n\n“许栀！出来说两句！”\n\n“你左手敢不敢伸出来给大家看看！”\n\n“你是不是已经死了？现在是谁在操控你的身体？”\n\n我拉上窗帘，坐回电脑前。\n\n邮箱里躺着一封新邮件，发件人是经纪公司法务部。\n\n“许栀女士，鉴于目前舆论涉及重大公共关切，公司要求您于今日下午三时前提交三甲医院出具的身体检查报告，包括但不限于指纹、疤痕、DNA比对。”\n\n“如拒绝配合，公司将视为您单方面放弃所有申辩权利。”\n\n我敲下回复：“拒绝。”\n\n发送。\n\n王医生的电话打进来，我接了。\n\n“许小姐，老太太今天下午突然心律不齐，刚抢救过来。”\n\n他压低声音。\n\n“她一直在喊你的名字，你方便过来一趟吗？”\n\n“我马上到。”\n\n我抓起大衣和车钥匙，走到门口。\n\n猫眼里，狗仔还堵在楼道。\n\n我拉开门的瞬间，闪光灯像暴雨一样砸过来。\n\n“许栀！说两句吧！”\n\n“你到底是人还是鬼！”\n\n有人把镜头怼到我脸上，有人伸手拽我的包带。\n\n我冷着脸，一个字没说，挤开人群往电梯走。\n\n一个代拍追上来，镜头几乎戳到我鼻尖：“你左手敢伸出来吗？就一下！”\n\n我停下脚步，转头看他。\n\n“让开。”\n\n声音不大，但那人愣了一下，后退半步。\n\n我进了电梯，按下关门键。\n\n医院走廊弥漫着消毒水味。\n\n王医生在病房门口等我，表情凝重。\n\n“刚打了镇静，现在睡了。”\n\n他翻开病历，“心衰加重，不能再受刺激。”\n\n“网上的事，病房里有人刷到了？”\n\n王医生沉默两秒。\n\n“隔壁床的家属在看直播，声音外放。”\n\n我推开病房门，奶奶躺在床上，鼻子里插着氧气管，胸口微弱起伏。\n\n床头柜上，一部旧手机屏幕还亮着。\n\n上面正在播放一段视频，标题是“许栀奶奶亲口指认：她不是我孙女”。\n\n播放量已经过百万。\n\n剪辑者把奶奶在病床上的呓语，配上了阴森的背景音乐和字幕特效。\n\n评论区第一条：“连亲奶奶都不认她，这还有什么好说的？”\n\n我伸手关掉视频，把手机扣在桌上。\n\n指节在发抖。\n\n我走到走廊尽头，靠着墙，慢慢滑坐到地上。\n\n消毒水的气味钻进鼻腔，走廊里人来人往，有人推着器械车经过，轮子碾过地砖发出刺耳的声响。\n\n我闭上眼。\n\n原主留下的旧手机还揣在我大衣口袋里，硌着肋骨。\n\n我把它摸出来，握紧。\n\n奶奶的声音还在脑子里转——“你不是我的栀栀”。\n\n我知道她没说错。\n\n我确实不是。\n\n但我不能认。\n\n认了，原主就白死了。\n\n认了，严寒就赢了。\n\n认了，奶奶就没人管了。\n\n我睁开眼，从地上站起来。\n\n走到护士站借了台电脑，连上我的私有云端。\n\n手指在键盘上敲了第一行指令。\n\n林姐的银行流水，我早就爬下来了。之前没动，是因为没到清算的时候。\n\n现在到了。\n\n我调出她近半年的转账记录，按时间排序。\n\n一笔一笔筛。\n\n凌晨两点十七分，一笔大额转出。\n\n收款方是一家注册在维京群岛的空壳公司。\n\n我放大收款账户信息，往下翻。\n\n实控人一栏，清清楚楚写着两个字。\n\n严寒。\n\n## 第14章\n林姐的转账记录不止一笔。\n\n我继续往下翻，收款方那家维京群岛空壳公司，半年内从林姐账户吸走了三百多万。每笔转账的时间节点，都卡在原主拒绝严寒之后的第三天、第五天、一周后。\n\n我调出林姐的邮件备份，之前从经纪公司服务器里一并爬下来的。\n\n搜索关键词：许栀。\n\n三百多封邮件，我按时间倒序排列，筛出她和严寒助理的往来。\n\n第一封，去年十一月。严寒助理发来一份名单，上面列了七个女艺人，许栀排在最后。\n\n林姐回复：“许栀最难搞，奶奶那边可以下手。”\n\n第二封，十二月。严寒助理发来一个压缩包，里面是伪造的医美病历和第一批黑图。\n\n林姐回复：“收到，明天安排营销号发。”\n\n第三封，今年一月。林姐主动发了一组许栀的私人行程表，包括奶奶住院的科室、床号、主治医生。\n\n邮件末尾加了一句：“严总放心，她跑不掉。”\n\n我把所有邮件按时间轴整理，配上转账记录、聊天截图，做成一份完整的证据链文档。\n\n三百七十四页。\n\n做完这些，天已经黑了。\n\n我没有急着发。\n\n现在发出去，最多让林姐进去蹲几年。严寒已经批捕，苏菲掉了代言，这些都不够。\n\n我要等。\n\n等到一个所有目光都聚焦的时刻，一次性清算。\n\n手机震了一下，苏菲发了条微博，配图是她在某品牌活动上的精修照。\n\n“清者自清，浊者自浊。有些人忙着编故事，有些人忙着往前走。”\n\n评论区水军整齐刷屏：“姐姐好美”“不跟糊咖计较”。\n\n我转发了她的微博，只加了四个字：“清者自清。”\n\n评论区瞬间两极分化。\n\n“许栀终于回应了！”\n\n“就四个字？疤的事不解释？”\n\n“人家忙着拍戏，谁像你们天天盯着别人左手看。”\n\n“我信她，那份技术鉴定报告不是一般人能拿出来的。”\n\n“信她个鬼，夺舍实锤！”\n\n我没有再看。舆论稳住了，两边吵得越凶，热度维持得越久。等终局到来，所有的质疑都会变成打向林姐和苏菲的子弹。\n\n第二天早上，一条微信好友申请弹出来。\n\n验证消息：“陈导。”\n\n我通过。\n\n对方直接发来一段语音，声音沙哑，带着片场特有的嘈杂背景音。\n\n“许栀，我看了你那场直播。别人看热闹，我看门道。”\n\n“你对着十万条辱骂，手没抖，声没颤，眼睛里全是算计。这种心理素质，我下部戏的女主角，非你不可。”\n\n紧接着，一份电子合同发过来。\n\n电影项目：《暗河》。\n\n现实主义悬疑题材，女主角是个被诬陷杀人的法医，全片一百二十七场戏，一百零三场有她。\n\n片酬那一栏，填的是S级顶格。\n\n我翻到合同最后一页，导演已经签了字。\n\n我回复：“陈导，我接。”\n\n他秒回：“下周三进组。把你左手的事处理好，别让剧组为难。”\n\n“明白。”\n\n我关掉对话框，把合同转发给律师存档。\n\n下午，我开车去了私立医院。\n\n奶奶躺在特护病房里，鼻氧管换成了面罩，脸色比上次好了一些。\n\n王医生在走廊拦住我。\n\n“许小姐，老太太的情况暂时稳住了。心衰的基础还在，但私立医院这边的设备和护理跟上了，短期内不会有危险。”\n\n他顿了顿。\n\n“不过她清醒的时间越来越少，你要有心理准备。”\n\n“我明白。”\n\n我走进病房，坐在床边。\n\n奶奶的眼皮动了动，没有睁开。嘴唇翕了两下，声音太轻 等实锤”“这次看她怎么洗”。\n\n我截了图，存进“终局”文件夹。\n\n没有回复。\n\n退出微博，打开加密文件夹，调出陈雯的号码。\n\n我编辑了一条短信，只有一句话：\n\n“陈雯，我们聊聊当年你向严寒告密的事。”\n\n发送。\n\n屏幕弹出“已送达”的提示。\n\n我把旧手机放回保险柜，合上电脑。\n\n窗外，剧组酒店的霓虹灯牌在晨雾里亮着，远处传来早班道具车发动引擎的声音。\n\n手机屏幕又亮了。\n\n来自陈雯的回复，只有三个字：\n\n“你是谁？”\n\n## 第17章\n我选了那家咖啡馆的包厢，靠墙，背对门。\n\n陈雯推门进来的时候，手里攥着手机，指节泛白。\n\n她比照片上瘦了两圈，颧骨突出来，眼窝陷下去。\n\n“坐。”\n\n我推过去一杯美式。\n\n她没碰，拉开椅子坐下，和我隔着一张桌子的距离。\n\n“你说当年的事，什么意思？”\n\n“你发给严寒的定位。”\n\n我开门见山。\n\n陈雯的手微微一抖，但脸上没崩。\n\n“我不知道你在说什么。”\n\n“许栀去世前一周，你把她所在医院的楼层、病房号发给了严寒。”\n\n我打开手机，屏幕转向她。\n\n聊天残片的截图，发送时间、坐标定位、设备型号，清清楚楚。\n\n陈雯的脸色变了。\n\n从白到灰，嘴唇抿成一条线。\n\n“你从哪里拿到的？”\n\n“旧手机的数据恢复。”\n\n“许栀的旧手机？”\n\n她声音拔高了一截。\n\n“那个手机早就坏了，连开机都开不了——”\n\n“所以我修好了。”\n\n我收回手机。\n\n陈雯盯着桌面，指甲抠进掌心。\n\n过了十几秒，她抬起头，眼睛里有一种执拗的恨意。\n\n“你根本不是许栀。”\n\n“许栀不会修手机，不会编程，不会在镜头前冷静地念证据。”\n\n“她连跟人对视都不敢。”\n\n“你是谁？你占着她的身体想干什么？”\n\n我端起咖啡喝了一口。\n\n“你觉得我是谁不重要。”\n\n“重要的是，你出卖了她。”\n\n陈雯的眼泪突然涌出来。\n\n“我没有出卖她！我只是……我只是告诉了严寒她的位置，我以为他只是想找她谈谈——”\n\n“谈？”\n\n我打断她。\n\n“严寒的人堵到医院病房门口，拉横幅辱骂奶奶。奶奶心脏病发，送进急救室。”\n\n“你在发定位的时候，有没有想过这些？”\n\n陈雯捂住嘴。\n\n哭声闷在掌心里，肩膀一抽一抽地抖。\n\n我等她哭完。\n\n“林姐找过你，让你上直播指认我。”\n\n“你答应了。”\n\n陈雯擦了把脸，声音沙哑。\n\n“她给我看了奶奶的录音……我以为她说的是真的。”\n\n“奶奶说‘你不是我的栀栀’，我以为现在的许栀真的被什么东西占了。”\n\n“所以你就上了节目，当着几万人的面，把你的朋友钉在耻辱柱上。”\n\n“我……”\n\n她张了张嘴，没说出完整的句子。\n\n“林姐还让你做了什么？”\n\n陈雯低下头。\n\n“她让我联系奶奶的护工。那个护工姓张，林姐给了他钱，让他偷录奶奶昏迷时的呓语。”\n\n“录音是剪辑过的。”\n\n“完整的录音里，奶奶说的是‘栀栀，你来看我了’，‘栀栀，你瘦了’。中间那些‘你不是我的栀栀’被单独剪出来，前后拼接。”\n\n“张护工把原版录音给了林姐，林姐剪完发给了营销号。”\n\n我拿到想要的了。\n\n“你能作证吗？”\n\n陈雯猛地抬头。\n\n“作证？你要我公开作证？”\n\n“对。”\n\n“不行。”\n\n她摇头，语气很坚决。\n\n“我如果公开作证，林姐会把我也拖下水。我当年发定位的事——”\n\n“你发定位的事，我已经有证据了。”\n\n我看着她。\n\n“你现在帮我作证，算你主动交代。你不帮，这些证据会跟林姐的一起移交警方。”\n\n陈雯咬住下唇。\n\n“你是在威胁我。”\n\n“我在给你选择。”\n\n她沉默了很久。\n\n咖啡凉了，杯壁上的水汽凝成水珠，一滴一滴往下滑。\n\n“护工的联系方式我有。原版录音我也有备份，林姐发给我的时候我留了一份。”\n\n“但我不会公开道歉。”\n\n“我不需要你道歉。”\n\n我站起来。\n\n“把东西发给我。”\n\n陈雯掏出手机，翻出一串号码和一段音频文件，隔桌推过来。\n\n我扫了一眼，记下号码，把音频转发到自己手机上。\n\n“陈雯。”\n\n她抬头看我。\n\n“你真的是她吗？”\n\n我看着她湿润的眼睛，没有回答。\n\n转身拉开包厢门，走了出去。\n\n咖啡馆外，阳光刺眼。\n\n我站在街边，掏出手机给律师发消息。\n\n“证据包可以启动了。护工证词到手，原版录音完整，奶奶的呓语录音可以被推翻。”\n\n发送。\n\n屏幕上方弹出一条新消息。\n\n陈雯的号码。\n\n“她手里有我们当年的聊天记录。”\n\n人物卡：\n[\n {\n  \"na 扑面而来。\n严寒坐在真皮沙发里，手里晃着半杯威士忌。\n“终于学乖了？”\n他拍了拍身边的空位，\n“坐过来。”\n我没动，站在离他三步远的地方：\n“网上的那些黑料，你到底要怎样才肯撤掉？”\n严寒冷笑一声：\n“许栀，别装傻。”\n“那几张图，还有你靠奶奶卖惨的通稿，全是我让人放出去的。”\n“只要我一句话，水军立刻停手，你奶奶也能在医院睡个安稳觉。”\n“所以，这一切都是你逼我就范的手段？”\n我暗中调整站姿，确保胸针的麦克风孔正对他。\n“不然呢？”\n他站起身，步步逼近，\n“在这个圈子里，没有我的点头，你寸步难行。”\n“陪我，是你唯一的出路。”\n“只要你乖乖听话，昨天的黑热搜，明天就能变成洗白通稿。”\n他走到我面前，伸手摸向我的脸。\n我侧身抄起桌上的冰水，假装手滑泼在了他的高定西裤上。\n“严总，抱歉。”\n我后退两步，迅速拉开安全距离，\n“这件事太突然了，我需要一晚上的时间考虑。”\n严寒脸色铁青，眼中戾气翻涌。\n但他似乎很享受这种猫捉老鼠的掌控感，拿过纸巾擦了擦手。\n“行，我给你一晚上。”\n“明天早上，我要听到你的回复。”\n“否则，你知道我的手段。”\n回到公寓，我反锁房门，打开电脑。\n切入私有云端，刚才那段长达十五分钟的对话音频已经躺在加密区。\n我敲击键盘输入密钥，将乱码解码为清晰的音频文件。\n接着，我翻出原主之前备份的早期威胁短信截图。\n我明白，利用主流网站揭露这些行不通，\n那我只好采取些非常手段。\n为了避开经纪公司的网络监控，我从口袋里摸出一张电话卡。\n这是今天去医院时，我趁乱从奶奶的旧手机里拔出来的。\n插卡，联网。\n我切入暗网，购买了三个境外的僵尸网络节点作跳板，\n将音频和短信截图，连同图片造假鉴定报告进行多重加密打包。\n一份通过内网通道直达网信办举报中心；\n一份发给早已拟定好合同的顶尖维权律师；\n最后一份，我写了一个延时触发的脚本，\n匿名投递给国内三家以绝不妥协著称的媒体主编邮箱。\n做完这一切，天已经亮了。\n早上八点，严寒的微信准时发了过来：\n“考虑得怎么样了？”\n我果断地回复，\n“我考虑过了，我不同意。”\n“别敬酒不吃吃罚酒，得罪我，我保证让你在这个圈子里混不下去！”\n我冷笑一声，\n一边切屏给律师发送行动的指令，一边在对话框里敲下回复：\n“你还是准备好，担心担心你自己吧。”\n\n## 第5章\n“砰！”\n我公寓的防盗门传来一声巨响。\n紧接着，是严寒打来的视频通话。\n我按下接听，画面里，严寒身后的背景赫然是医院重症住院部的走廊！\n“许栀，你敢跟我耍花招？找死！”\n他将镜头对准前方几个黑衣壮汉\n与此同时，我公寓的防盗门锁报废，防盗门倒塌掀起一阵尘土。\n三个提着钢管的壮汉盯着我，步步逼近。\n手机屏幕里，严寒叫嚣的声音震得我耳膜生疼：\n“我让你装！我现在就拔了这老东西的管子！”\n我倚靠在椅背上，嘴角勾起嘲讽：\n“你拔啊。”\n视频中，黑衣人掀开病床上的被子。\n空的。\n严寒震惊地盯着屏幕里的空床。\n“人呢？！”\n“严总，你真以为我会放心把奶奶留在普通重症区？”\n我语气没有一丝起伏，\n“昨晚从会所出来，我就联系了私立医院。”\n“现在我奶奶躺在安保级别最高的特护病房。”\n“别说你的打手，连一只苍蝇都飞不进去。”\n“你想打扰她？下辈子吧。”\n“臭婊子，你敢耍我！”\n严寒在视频那头气急败坏。\n我挂断视频，按下桌上的遥控器，天花板四个角落的摄像头同时亮起红灯。\n“这是我的私人云端实时同步录像。”\n“另外，十分钟前我已经报了警。”\n我晃了晃手机，窗外刚好传来由远及近的警笛声，\n“要试试这钢管砸下来，你们能判几年吗？”\n三人脸色一变，对视一眼，骂骂咧咧地夺门而逃。\n危机解除。\n我跨过一地狼藉，重新坐回电脑前，拨通了律师的电话。\n等待接通时，我瞥见原主日记本摊在桌角，一页被撕掉，夹着张旧照片，背面写着“陈雯，等我红了就去找你”。\n“动手吧。”\n五分钟后，一份盖着公章的律师函发送到了经纪公司高层的邮箱里。\n除了解约声明，里面还附带了一份“大礼包”：\n林姐知情，且纵容协助严寒潜规则旗下艺人的聊天记录和邮件往来。\n另一边，严寒察觉到了部分证据已经开始外泄。\n我的网络监测探针显示，各大平台的敏感词库正在被更新。\n严寒急眼了。\n雷霆大怒之下，他开始疯狂砸钱，动用庞大的公关力量全网删帖。\n热搜榜上，关于他公司的词条迅速被撤下，\n吃瓜群众发出的质疑贴不到一分钟就被删，\n大批高级水军下场，强行把水搅浑。\n叮的一声，严寒的短信发了过来：\n“只要钱到位，互联网就不会有你的记忆！”\n“你奶奶躲得过初一躲不过十五，走着瞧！”\n看着这句狠话，我只觉得可笑。\n我已经切断了他打探病房信息的渠道。\n他现在的威胁，不过是落空后的无能狂怒。\n电脑屏幕右下角，一个红色的倒计时窗口正在安静地跳动。\n“3、2、1……”\n进度条拉满，定时投递脚本触发成功。\n三封加密邮件，滑入了三家深度调查媒体主编的收件箱。\n\n## 第6章\n这三家媒体以不畏强权、死磕真相在业内著称。\n严寒的资本手腕能买通营销号，却买不动这些真正的新闻人。\n两小时后，早上八点整，早高峰通勤的节点。\n原本被严寒水军搅得乌烟瘴气的社交平台，撕开了一道口子。\n没有预热，没有娱乐圈惯用的八卦噱头，\n三家深度调查媒体全网同步推送了一篇万字长文。\n标题字字见血：\n《赛博猎巫的背后：资本胁迫、技术造假与一场完美的网络谋杀》。\n文章开篇，甩出了我那份长达三十页的图像技术鉴定报告。\n作为资深码农，我给出的证据链是降维打击级别的。\n报告里放大了所谓“医美现场图”的所有噪点，详细展示了ELA热力图，\n甚至直接提取了图片底层的EXIF数据，\n将拼接合成的操作痕迹、修改时间和部分硬件特征，展示得清清楚楚。\n这篇报道像一枚深水炸弹，引爆了整个网络。\n“卧槽！作为一个十年后期修图师的我头皮发麻。”\n“这报告太硬了，这根本不是什么吃瓜，这是高技术犯罪啊！”\n“看懂了，图片是P的，就医记录是假的，连所谓的知情人士是虚拟账号。”\n“我去，我们全被当枪使了！”\n“细思极恐……如果许栀拿不出这份报告，她现在是不是已经被逼上绝路了？”\n风向变了。\n原本满屏的荡妇羞辱和谩骂，转变成了对资本只手遮天的恐惧与愤怒。\n这不再是一桩茶余饭后的戏子黑料，\n而是被严肃定性为一桩涉及资本胁迫的网络暴力案件。\n那些原本跟着带节奏的大V们悄悄删除微博，理智的路人成批觉醒。\n严寒慌了。\n后台监测仪上，我看到大量异常流量正在冲击这三家媒体的服务器。\n严寒的水军涌入评论区，试图用以往那种胡搅蛮缠的方式把水再次搅浑。\n他甚至动用了最高级别的公关预案，试图花重金强行撤掉热搜词条。\n但这次，他踢到了铁板。\n这三家硬核媒体背后，是坚不可摧的公信力和新闻底线。\n严寒的团队绝望地发现，他们的资本权限在这里根本不管用。\n不仅文章删不掉，反而因为短时间内触发了平台的异常压制机制，\n被系统判定为重大社会事件，强推上了各大首页的置顶位，全网飘红。\n真相如同决堤的洪水，势不可挡。\n我坐在电脑前，看着数据监控面板。\n代表“许栀澄清”、“资本网暴”的词条指数正在呈指数级狂飙，\n而严寒关联实业公司的网络风评和股市预期，则断崖式暴跌。\n局势逆转，一切都在计算之中。\n我正准备关掉网页，去医院看望奶奶，\n医院护工来电，说奶奶昏迷中喃喃“栀栀左手有疤”。我低头看自己光滑的左手，只当是老人胡话。\n电脑屏幕右下角的监控雷达突然发出一声尖锐的红色警报。\n一条全新的词条，突破了媒体的封锁，空降热搜榜第一。\n词条后面，跟着一个刺眼的的深红色“爆”字。\n许栀主动投怀送抱，会所监控流出\n我盯着这条热搜，眼睛微微眯起。\n\n## 第7章\n鼠标点开那个刺目的“爆”字。\n屏幕上弹出一段三十秒的无声监控视频。\n画面正是我昨晚走进那家私人会所包厢的场景。\n因为角度刁钻，视频里的我看起来像是顺从地交出手机，\n任由保镖搜身后走进了光线昏暗的包厢。\n视频末尾还被恶意剪辑了一段我靠近严寒倒水的画面，\n没有声音，加上模糊处理的滤镜，看起来就像是我在主动投怀送抱。\n营销号的配文更是恶毒：\n“所谓的技术流澄清不过是洗白手段。”\n“事实是许栀早已向资本低头，深夜主动赴约，企图用身体平息风波。”\n严寒这手脏牌打得真是时候。\n他想利用大众对娱乐圈潜规则的固有偏见，\n将我钉死在“当了婊子还立牌坊”的耻辱柱上。\n我没慌，反而笑了。\n等的就是他这步棋。\n现在全网都在盯着我，流量达到了巅峰。\n我打开手机，登上了公司归还的账号，点击开启直播。\n没有预热，开播瞬间直播间涌入了十万人。\n弹幕狂刷，夹杂着不堪入目的词汇。\n我没理会这些，把昨晚那枚胸针摘下来，摆在镜头前。\n“大家都在看严总放出的无声电影。”\n“既然剧情这么精彩，不配点原声怎么行？”\n我将胸针连接电脑，手指敲击回车键。\n我编写的加密程序，绕过防火墙，解压提取音频。\n一段清晰无比的对话，传遍了整个网络。\n“许栀，你是个聪明人。”\n“只要你今晚留下，所有的黑料我十分钟内就能让它们消失。”\n这是严寒的声音，带着不加掩饰的傲慢。\n紧接着，是我冷静的质问：\n“所以，那些医美假照还有买通营销号的造谣，全是你干的？”\n“是我又怎么样？”\n“在这个圈子里，资本就是规矩。\n“不顺从我，你连翻身的机会都没有！”\n“不仅是你，那个躺在医院里的老太婆也别想安生……”\n音频扒下了严寒衣冠楚楚的伪装，露出了他威逼利诱冷血嘴脸。\n弹幕在那一刻，出现了诡异的停顿。\n紧接着，整个直播间炸锅了。\n“草！这男的太恶心了！”\n“这哪里是潜规则，这是黑社会性质的敲诈勒索吧？！”\n“反转了！许栀是去录音取证的！她根本没妥协，她太刚了！”\n我看着飙升的热度，对着镜头开口：\n“严寒，你以为交出手机，搜了身，我就没办法了吗？”\n“这段录音，我已经同步发给了警方。”\n另一边，经纪公司的高层会议室里早已乱作一团。\n林姐和公司高管们看着直播间里引爆的舆论，冷汗直流。\n他们原本还想把原主当成礼物送给严寒，\n但现在事情的性质已经从娱乐八卦升级成了违法犯罪。\n严寒如今玩脱了。\n稍有不慎，公司都会作为拉皮条的从犯被牵连进去。\n“快！把之前所有的通稿全撤了！”\n公司高层在会议室里咆哮，\n“马上发声明，把公司和严寒的关系摘干净！快啊！”\n我的手机屏幕亮了，一条来自林姐的信息弹了出来：\n“小栀，公司决定挺你，严寒的事我们全不知情。”\n“你先下播，我们好好谈谈后续的公关。”\n我对着直播间的镜头，将手机屏幕怼到了镜头前。\n“看，原来落井下石的人，翻脸也可以这么快。”\n众人还在震惊于经纪公司的无耻时，直播间的连麦申请响了起来。\n来电显示，居然是严寒本人。\n\n需要带过来的事实 carried_facts：\n[\n {\n  \"fact\": \"严寒录音曝光后，主角拒绝连麦，宣布证据已发警方，严寒实业股价跌停、合作方解约，警方立案调查。\",\n  \"source_chapter\": 8,\n  \"replant\": \"续写第1章通过主角切断直播后的手机新闻推送和内心独白快速交代。\"\n },\n {\n  \"fact\": \"苏菲代言解约，S级剧换人，水军头子被立案调查。\",\n  \"source_chapter\": 8,\n  \"replant\": \"续写前段通过娱乐新闻或苏菲求饶电话交代。\"\n },\n {\n  \"fact\": \"经纪公司发布致歉信，推责林姐，附无条件解约协议书，主角签字发送。\",\n  \"source_chapter\": 8,\n  \"replant\": \"续写第2章主角收到解约协议邮件，签字后长舒一口气。\"\n },\n {\n  \"fact\": \"奶奶在主角拍完电影后回光返照，识破主角不是原主，感谢她后安详离世。\",\n  \"source_chapter\": 9,\n  \"replant\": \"续写第9-10章重新演绎奶奶临终场景，保留识破身份和感谢的核心情感。\"\n },\n {\n  \"fact\": \"主角扎进剧组大半年，电影公映后获全网好评，撕掉废柴花瓶标签。\",\n  \"source_chapter\": 9,\n  \"replant\": \"续写中段用剧组蒙太奇和影评片段交代。\"\n }\n]\n\n已写的续写章节：\n## 第8章\n直播间里，连麦申请的铃声像催命符一样响个不停。\n\n屏幕上，严寒的头像疯狂闪烁。\n\n弹幕已经刷疯了：\n\n“接啊！看他还有什么话说！”\n\n“严总这是要当众道歉吗？”\n\n“许栀别怂！”\n\n我对着镜头，嘴角扯出一个弧度，鼠标移向那个闪烁的红色按钮。\n\n按了下去。\n\n连麦界面瞬间黑屏，只剩下弹幕区满屏的问号。\n\n“严寒，你以为我会给你一个当众表演的机会？”\n\n我把键盘拉到面前，手指飞快地敲下一行字，同步到直播间公告栏。\n\n“互联网不是法外之地，严总，留着你的话去跟警察解释吧。”\n\n发送。\n\n然后，我点击了关闭直播。\n\n屏幕暗下去的前一秒，弹幕定格在刷屏的问号上。\n\n手机开始疯狂震动，各种推送像洪水一样涌进来。\n\n第一条，来自财经快讯：\n\n【严寒实业股价断崖式跌停，市值蒸发超三十亿。】\n\n第二条，来自娱乐前线：\n\n【严寒名下多家公司遭合作方紧急切割，已有三个品牌方宣布终止合作。】\n\n第三条，来自社会新闻：\n\n【警方已就“网络造谣及资本胁迫案”正式立案，严寒被限制出境。】\n\n我把手机屏幕转向电脑摄像头，录了一小段视频，发到个人主页。\n\n配文只有一行字：\n\n“完整录音与数据证据链，已提交警方。后续进展，依法公开。”\n\n做完这些，我靠在椅背上，长出一口气。\n\n邮箱弹出一封新邮件，是经纪公司法务部发来的。\n\n我点开。\n\n一封致歉信，用词恳切，把所有责任推给了林姐，说她是“个人行为，公司事先并不知情”。\n\n附件里，是一份无条件解约协议书。\n\n我快速扫了一遍条款，确认没有陷阱，签上“许栀”两个字，点击发送。\n\n屏幕弹出“发送成功”的提示时，我盯着那两个字看了很久。\n\n第一次觉 都不对。\n\n我盯着屏幕，忽然想到一个可能。\n\n原主签约公司那天，是几月几号？\n\n我翻出原主的日记本，找到签约那页。日期下面画了三道横线，旁边写了一句话：“从今天起，我要好好赚钱。”\n\n输入那天的日期。\n\n文件夹弹开了。\n\n里面只有一段视频。\n\n我点开。\n\n原主坐在一个光线昏暗的房间里，眼睛红肿，声音在抖。\n\n“我叫许栀，身份证号是……”\n\n她对着镜头举起身份证，然后放下。\n\n“如果我出了什么事，请把这个视频交给警方。”\n\n“严寒，严寒实业董事长，他一直在逼我……”\n\n视频只有四分钟。\n\n她讲得很乱，中间哭了两次，但每一句都踩在关键点上。严寒什么时候开始施压，通过谁传话，用什么威胁她，她拒绝之后发生了什么。\n\n我退回去，把视频备份了三份。一份存本地加密盘，一份上传私有云端，一份拷进U盘。\n\n做完这些，我点开文件夹里最后一个文件。\n\n是一张聊天截图，时间戳是原主去世前一周。\n\n发信人头像是一片空白，ID是一串乱码。\n\n内容只有一句话：“许栀的行踪我已经发你了，剩下的你自己看着办。”\n\n截图的底部，原主用红笔圈出了发信人的IP地址。\n\n我放大图片，把那串IP抄下来。\n\n然后打开电脑，反查归属地。\n\n城南，一家网吧的公共网络。\n\n网吧监控一般只保留三十天。但原主去世到现在，刚好二十八天。\n\n我深吸一口气，把IP地址和网吧名称记下来。\n\n手机屏幕又闪了一下。\n\n一条新短信，来自林姐。\n\n“许栀，明天上午十点，公司会议室。法务部要你当面解释左手疤痕的事。”\n\n“不来，就默认你放弃所有申辩权利。”\n\n我盯着这条短信，没有回复。\n\n退出短信界面，手机桌面还亮着。\n\n屏保上，原主蹲在奶奶轮椅旁，笑得灿烂。\n\n我把旧手机放进抽屉，锁好。\n\n然后打开电脑，继续追踪那个IP。\n\n网吧的登记系统有漏洞。\n\n我花了二十分钟拿到后台权限，调出二十八天前的上机记录。\n\n那个时间段，只有一个人用了那台机器。\n\n登记的名字是——\n\n陈雯。\n\n## 第13章\n直播开始的时候，我正在煮咖啡。\n\n手机架在料理台上，屏幕里林姐坐在访谈室的沙发上，妆容精致，语气沉痛。\n\n“作为许栀的前经纪人，我本来不想说这些。”\n\n她低头擦了擦眼角。\n\n“但我实在看不下去了。”\n\n陈雯坐在她旁边，低着头，手里攥着一张照片。\n\n主持人把话筒递过去。\n\n“陈女士，您和许栀是孤儿院时期的好友，您能确认什么？”\n\n陈雯抬起头，声音很轻。\n\n“她左手腕上有一道疤，五岁时摔在铁栅栏上缝了七针。”\n\n她举起那张旧照片，镜头推近，疤痕清清楚楚。\n\n“可现在的许栀，左手什么都没有。”\n\n主持人追问：“您是说，现在的许栀不是本人？”\n\n陈雯没回答，只是把手机连上了演播室音响。\n\n奶奶的声音传出来，虚弱，断续。\n\n“你不是我的栀栀……”\n\n“栀栀左手有疤……我记得的……”\n\n演播室安静了两秒。\n\n苏菲适时接话，语气关切：“我们都很担心栀栀的精神状态，如果她真的遇到了什么……”\n\n她顿了顿。\n\n“或者，被什么东西占据了身体，我们希望她能早点回来。”\n\n弹幕疯了。\n\n我关掉直播，咖啡已经凉了。\n\n打开微博，词条挂在热搜第一。\n\n#许栀被夺舍# 后面跟着深红色的“爆”。\n\n评论区置顶是营销号发起的投票：“你相信许栀被夺舍了吗？”\n\n七万人参与，六万三千票投了“相信”。\n\n“让她验疤！验不了就是心虚！”\n\n“这已经不是娱乐圈的事了，这是灵异事件！”\n\n“@网信办 @公安部 建议介入调查。”\n\n手机开始响。\n\n第一个电话是代言品牌方，对方语气为难：“许栀女士，我们总部那边压力很大，合同暂时中止，后续再联系。”\n\n第二个是剧组制片人：“定妆照先不拍了，投资方说要重新评估风险。”\n\n第三个、第四个、第五个。\n\n我把手机调成静音，来电记录截屏存档。\n\n门铃响了。\n\n从猫眼看出去，楼道里挤满了人。长焦镜头、摄像机、举着手机直播的博主。\n\n“许栀！出来说两句！”\n\n“你左手敢不敢伸出来给大家看看！”\n\n“你是不是已经死了？现在是谁在操控你的身体？”\n\n我拉上窗帘，坐回电脑前。\n\n邮箱里躺着一封新邮件，发件人是经纪公司法务部。\n\n“许栀女士，鉴于目前舆论涉及重大公共关切，公司要求您于今日下午三时前提交三甲医院出具的身体检查报告，包括但不限于指纹、疤痕、DNA比对。”\n\n“如拒绝配合，公司将视为您单方面放弃所有申辩权利。”\n\n我敲下回复：“拒绝。”\n\n发送。\n\n王医生的电话打进来，我接了。\n\n“许小姐，老太太今天下午突然心律不齐，刚抢救过来。”\n\n他压低声音。\n\n“她一直在喊你的名字，你方便过来一趟吗？”\n\n“我马上到。”\n\n我抓起大衣和车钥匙，走到门口。\n\n猫眼里，狗仔还堵在楼道。\n\n我拉开门的瞬间，闪光灯像暴雨一样砸过来。\n\n“许栀！说两句吧！”\n\n“你到底是人还是鬼！”\n\n有人把镜头怼到我脸上，有人伸手拽我的包带。\n\n我冷着脸，一个字没说，挤开人群往电梯走。\n\n一个代拍追上来，镜头几乎戳到我鼻尖：“你左手敢伸出来吗？就一下！”\n\n我停下脚步，转头看他。\n\n“让开。”\n\n声音不大，但那人愣了一下，后退半步。\n\n我进了电梯，按下关门键。\n\n医院走廊弥漫着消毒水味。\n\n王医生在病房门口等我，表情凝重。\n\n“刚打了镇静，现在睡了。”\n\n他翻开病历，“心衰加重，不能再受刺激。”\n\n“网上的事，病房里有人刷到了？”\n\n王医生沉默两秒。\n\n“隔壁床的家属在看直播，声音外放。”\n\n我推开病房门，奶奶躺在床上，鼻子里插着氧气管，胸口微弱起伏。\n\n床头柜上，一部旧手机屏幕还亮着。\n\n上面正在播放一段视频，标题是“许栀奶奶亲口指认：她不是我孙女”。\n\n播放量已经过百万。\n\n剪辑者把奶奶在病床上的呓语，配上了阴森的背景音乐和字幕特效。\n\n评论区第一条：“连亲奶奶都不认她，这还有什么好说的？”\n\n我伸手关掉视频，把手机扣在桌上。\n\n指节在发抖。\n\n我走到走廊尽头，靠着墙，慢慢滑坐到地上。\n\n消毒水的气味钻进鼻腔，走廊里人来人往，有人推着器械车经过，轮子碾过地砖发出刺耳的声响。\n\n我闭上眼。\n\n原主留下的旧手机还揣在我大衣口袋里，硌着肋骨。\n\n我把它摸出来，握紧。\n\n奶奶的声音还在脑子里转——“你不是我的栀栀”。\n\n我知道她没说错。\n\n我确实不是。\n\n但我不能认。\n\n认了，原主就白死了。\n\n认了，严寒就赢了。\n\n认了，奶奶就没人管了。\n\n我睁开眼，从地上站起来。\n\n走到护士站借了台电脑，连上我的私有云端。\n\n手指在键盘上敲了第一行指令。\n\n林姐的银行流水，我早就爬下来了。之前没动，是因为没到清算的时候。\n\n现在到了。\n\n我调出她近半年的转账记录，按时间排序。\n\n一笔一笔筛。\n\n凌晨两点十七分，一笔大额转出。\n\n收款方是一家注册在维京群岛的空壳公司。\n\n我放大收款账户信息，往下翻。\n\n实控人一栏，清清楚楚写着两个字。\n\n严寒。\n\n## 第14章\n林姐的转账记录不止一笔。\n\n我继续往下翻，收款方那家维京群岛空壳公司，半年内从林姐账户吸走了三百多万。每笔转账的时间节点，都卡在原主拒绝严寒之后的第三天、第五天、一周后。\n\n我调出林姐的邮件备份，之前从经纪公司服务器里一并爬下来的。\n\n搜索关键词：许栀。\n\n三百多封邮件，我按时间倒序排列，筛出她和严寒助理的往来。\n\n第一封，去年十一月。严寒助理发来一份名单，上面列了七个女艺人，许栀排在最后。\n\n林姐回复：“许栀最难搞，奶奶那边可以下手。”\n\n第二封，十二月。严寒助理发来一个压缩包，里面是伪造的医美病历和第一批黑图。\n\n林姐回复：“收到，明天安排营销号发。”\n\n第三封，今年一月。林姐主动发了一组许栀的私人行程表，包括奶奶住院的科室、床号、主治医生。\n\n邮件末尾加了一句：“严总放心，她跑不掉。”\n\n我把所有邮件按时间轴整理，配上转账记录、聊天截图，做成一份完整的证据链文档。\n\n三百七十四页。\n\n做完这些，天已经黑了。\n\n我没有急着发。\n\n现在发出去，最多让林姐进去蹲几年。严寒已经批捕，苏菲掉了代言，这些都不够。\n\n我要等。\n\n等到一个所有目光都聚焦的时刻，一次性清算。\n\n手机震了一下，苏菲发了条微博，配图是她在某品牌活动上的精修照。\n\n“清者自清，浊者自浊。有些人忙着编故事，有些人忙着往前走。”\n\n评论区水军整齐刷屏：“姐姐好美”“不跟糊咖计较”。\n\n我转发了她的微博，只加了四个字：“清者自清。”\n\n评论区瞬间两极分化。\n\n“许栀终于回应了！”\n\n“就四个字？疤的事不解释？”\n\n“人家忙着拍戏，谁像你们天天盯着别人左手看。”\n\n“我信她，那份技术鉴定报告不是一般人能拿出来的。”\n\n“信她个鬼，夺舍实锤！”\n\n我没有再看。舆论稳住了，两边吵得越凶，热度维持得越久。等终局到来，所有的质疑都会变成打向林姐和苏菲的子弹。\n\n第二天早上，一条微信好友申请弹出来。\n\n验证消息：“陈导。”\n\n我通过。\n\n对方直接发来一段语音，声音沙哑，带着片场特有的嘈杂背景音。\n\n“许栀，我看了你那场直播。别人看热闹，我看门道。”\n\n“你对着十万条辱骂，手没抖，声没颤，眼睛里全是算计。这种心理素质，我下部戏的女主角，非你不可。”\n\n紧接着，一份电子合同发过来。\n\n电影项目：《暗河》。\n\n现实主义悬疑题材，女主角是个被诬陷杀人的法医，全片一百二十七场戏，一百零三场有她。\n\n片酬那一栏，填的是S级顶格。\n\n我翻到合同最后一页，导演已经签了字。\n\n我回复：“陈导，我接。”\n\n他秒回：“下周三进组。把你左手的事处理好，别让剧组为难。”\n\n“明白。”\n\n我关掉对话框，把合同转发给律师存档。\n\n下午，我开车去了私立医院。\n\n奶奶躺在特护病房里，鼻氧管换成了面罩，脸色比上次好了一些。\n\n王医生在走廊拦住我。\n\n“许小姐，老太太的情况暂时稳住了。心衰的基础还在，但私立医院这边的设备和护理跟上了，短期内不会有危险。”\n\n他顿了顿。\n\n“不过她清醒的时间越来越少，你要有心理准备。”\n\n“我明白。”\n\n我走进病房，坐在床边。\n\n奶奶的眼皮动了动，没有睁开。嘴唇翕了两下，声音太轻，我听不清。\n\n我握住她的手。\n\n枯瘦，冰凉，指节因为常年输液而泛着青紫。\n\n“奶奶，我要去拍戏了。”\n\n她的手指在我掌心里微微动了动。\n\n“拍完这部戏，我就能洗掉所有脏水。”\n\n“到时候，我推你去看首映。”\n\n奶奶的嘴角好像弯了一下，又好像没有。\n\n我坐了很久，直到护士进来换药，才起身离开。\n\n走出病房，手机屏幕亮了。\n\n一条来自陌生号码的短信，只有六个字：“替身，颁奖礼见。”\n\n号码归属地查不到，但语气我认得。\n\n苏菲。\n\n我把短信截图，存进加密文件夹。\n\n文件夹命名：“终局”。\n\n里面整整齐齐码着林姐的三百七十四页证据链、苏菲的私信截图、陈雯在网吧的上机记录，还有奶奶病房被骚扰那天的监控备份。\n\n我删掉苏菲的短信，打开加密文件夹，最后检查了一遍文件结构。\n\n所有证据分成三份，设置了三个不同的定时触发节点。\n\n第一份，颁奖礼红毯开始前两小时，自动投递给三家媒体。\n\n第二份，颁奖礼最佳女主角揭晓的瞬间，自动上传至网信办举报平台。\n\n第三份，如果前两份被拦截，四十八小时后，自动群发至全网所有主流社交平台。\n\n文件名：终局。\n\n我合上电脑，把旧手机从抽屉里取出来，和加密硬盘一起锁进保险柜。\n\n站起身，走到窗前。\n\n楼下没有狗仔了。\n\n远处，城市的天际线亮起万家灯火。\n\n## 第15章\n进组第一天，陈导没让我试戏。\n\n他把剧本扔给我，指了指监视器旁边的折叠椅。“坐那儿看，看三天。”\n\n我没问为什么。坐下来，翻开剧本。\n\n女主角叫沈遥，法医，被指控伪造尸检报告。全片核心冲突是：她到底有没有篡改数据。\n\n陈导拍戏不用分镜脚本，现场走位全靠演员自己找。第一场审讯戏，他让男主即兴发挥，台词随便说。\n\n监视器里，男主拍桌怒吼：“你改了报告！你收了钱！”\n\n沈遥的台词本上只有一句：“我没有。”\n\n我盯着剧本上那三个字，忽然想到一件事。\n\n原主被全网骂的时候，说过最多的话也是“我没有”。没人信。\n\n我把剧本合上，掏出手机，打开备忘录。\n\n写下一行字：沈遥的动机不是自证清白，是让死者的数据开口说话。\n\n第二天，陈导拍沈遥在停尸房解剖尸体的戏。道具组准备了假人模型，内脏是硅胶做的。\n\n我戴上手套，拿起手术刀。\n\n陈导在监视器后面喊：“不用真解剖，你做个样子就行。”\n\n我没停。刀尖划过硅胶胸腔的时候，我开口：“沈遥不会做样子。”\n\n“她每割一刀，都是在跟死者对话。”\n\n“她关心的不是自己会不会坐牢，是这具尸体有没有被误判。”\n\n陈导没喊卡。\n\n监视器后面安静了十几秒。\n\n收工的时候，副导演跑过来递给我一杯咖啡。“陈导让我给你的。”\n\n我接过来，喝了一口。速溶的，三合一。\n\n“陈导还说，”副导演压低声音，“你昨天在备忘录写的那句话，他看到了。”\n\n我愣了一下。\n\n“他说，你眼里有东西。不是演出来的。”\n\n第三天，陈导加了一场戏。沈遥深夜独自在档案室翻卷宗，翻到一份被涂改的尸检记录。没有台词，全靠眼神和手部动作。\n\n我坐在档案架前，一页一页翻。\n\n翻到第七页的时候，手指停住。纸张边缘有一道被撕掉又粘回去的痕迹。\n\n我用指甲沿着胶水印刮了一下。\n\n陈导没喊停。摄影机推近，特写我的手指。\n\n我抬起头，目光落在档案架最顶层那排落灰的文件夹上。\n\n“卡。”\n\n陈导从监视器后面站起来，走到我面前。“你怎么知道那页有撕痕？”\n\n“道具组做旧的时候胶水涂多了，纸张膨胀系数不一样。”\n\ 发送的坐标定位，精确到原主当时所在医院的楼层和病房号。\n\n发送者备注名：陈雯。\n\n我放大那条定位的元数据，时间戳、设备型号、IP归属地，全部指向陈雯当年用的那台旧手机。\n\n我保存了整段对话，加密归档。\n\n陈雯当年出卖了原主的行踪。\n\n严寒的人能在医院精准堵到奶奶，就是靠这条定位。\n\n我关掉聊天记录窗口，调出陈雯的通讯方式。原主旧手机通讯录里存着她的号码，多年没拨过。\n\n我没有急着打。\n\n先给王医生发了条消息：“奶奶今天怎么样？”\n\n回复很快：“各项指标平稳，意识清醒的时间比上周多。她今天问起你了。”\n\n“我明天下午过去。”\n\n“好，我跟护士站说一声。”\n\n发完消息，我切回电脑，把原主的所有修复影像打包，分三份存储。一份离线硬盘，一份私有云端，一份发给律师。\n\n做完这些，天快亮了。\n\n手机屏幕亮了一下，林姐的微博更新了。\n\n“下周，许栀的真面目将全网公开。有些事，不是会写代码就能盖住的。”\n\n配图是一张模糊的聊天记录截图，只能看清几个字：“……她根本不是许栀……”\n\n评论区水军整齐刷屏：“坐等实锤”“这次看她怎么洗”。\n\n我截了图，存进“终局”文件夹。\n\n没有回复。\n\n退出微博，打开加密文件夹，调出陈雯的号码。\n\n我编辑了一条短信，只有一句话：\n\n“陈雯，我们聊聊当年你向严寒告密的事。”\n\n发送。\n\n屏幕弹出“已送达”的提示。\n\n我把旧手机放回保险柜，合上电脑。\n\n窗外，剧组酒店的霓虹灯牌在晨雾里亮着，远处传来早班道具车发动引擎的声音。\n\n手机屏幕又亮了。\n\n来自陈雯的回复，只有三个字：\n\n“你是谁？”\n\n## 第17章\n我选了那家咖啡馆的包厢，靠墙，背对门。\n\n陈雯推门进来的时候，手里攥着手机，指节泛白。\n\n她比照片上瘦了两圈，颧骨突出来，眼窝陷下去。\n\n“坐。”\n\n我推过去一杯美式。\n\n她没碰，拉开椅子坐下，和我隔着一张桌子的距离。\n\n“你说当年的事，什么意思？”\n\n“你发给严寒的定位。”\n\n我开门见山。\n\n陈雯的手微微一抖，但脸上没崩。\n\n“我不知道你在说什么。”\n\n“许栀去世前一周，你把她所在医院的楼层、病房号发给了严寒。”\n\n我打开手机，屏幕转向她。\n\n聊天残片的截图，发送时间、坐标定位、设备型号，清清楚楚。\n\n陈雯的脸色变了。\n\n从白到灰，嘴唇抿成一条线。\n\n“你从哪里拿到的？”\n\n“旧手机的数据恢复。”\n\n“许栀的旧手机？”\n\n她声音拔高了一截。\n\n“那个手机早就坏了，连开机都开不了——”\n\n“所以我修好了。”\n\n我收回手机。\n\n陈雯盯着桌面，指甲抠进掌心。\n\n过了十几秒，她抬起头，眼睛里有一种执拗的恨意。\n\n“你根本不是许栀。”\n\n“许栀不会修手机，不会编程，不会在镜头前冷静地念证据。”\n\n“她连跟人对视都不敢。”\n\n“你是谁？你占着她的身体想干什么？”\n\n我端起咖啡喝了一口。\n\n“你觉得我是谁不重要。”\n\n“重要的是，你出卖了她。”\n\n陈雯的眼泪突然涌出来。\n\n“我没有出卖她！我只是……我只是告诉了严寒她的位置，我以为他只是想找她谈谈——”\n\n“谈？”\n\n我打断她。\n\n“严寒的人堵到医院病房门口，拉横幅辱骂奶奶。奶奶心脏病发，送进急救室。”\n\n“你在发定位的时候，有没有想过这些？”\n\n陈雯捂住嘴。\n\n哭声闷在掌心里，肩膀一抽一抽地抖。\n\n我等她哭完。\n\n“林姐找过你，让你上直播指认我。”\n\n“你答应了。”\n\n陈雯擦了把脸，声音沙哑。\n\n“她给我看了奶奶的录音……我以为她说的是真的。”\n\n“奶奶说‘你不是我的栀栀’，我以为现在的许栀真的被什么东西占了。”\n\n“所以你就上了节目，当着几万人的面，把你的朋友钉在耻辱柱上。”\n\n“我……”\n\n她张了张嘴，没说出完整的句子。\n\n“林姐还让你做了什么？”\n\n陈雯低下头。\n\n“她让我联系奶奶的护工。那个护工姓张，林姐给了他钱，让他偷录奶奶昏迷时的呓语。”\n\n“录音是剪辑过的。”\n\n“完整的录音里，奶奶说的是‘栀栀，你来看我了’，‘栀栀，你瘦了’。中间那些‘你不是我的栀栀’被单独剪出来，前后拼接。”\n\n“张护工把原版录音给了林姐，林姐剪完发给了营销号。”\n\n我拿到想要的了。\n\n“你能作证吗？”\n\n陈雯猛地抬头。\n\n“作证？你要我公开作证？”\n\n“对。”\n\n“不行。”\n\n她摇头，语气很坚决。\n\n“我如果公开作证，林姐会把我也拖下水。我当年发定位的事——”\n\n“你发定位的事，我已经有证据了。”\n\n我看着她。\n\n“你现在帮我作证，算你主动交代。你不帮，这些证据会跟林姐的一起移交警方。”\n\n陈雯咬住下唇。\n\n“你是在威胁我。”\n\n“我在给你选择。”\n\n她沉默了很久。\n\n咖啡凉了，杯壁上的水汽凝成水珠，一滴一滴往下滑。\n\n“护工的联系方式我有。原版录音我也有备份，林姐发给我的时候我留了一份。”\n\n“但我不会公开道歉。”\n\n“我不需要你道歉。”\n\n我站起来。\n\n“把东西发给我。”\n\n陈雯掏出手机，翻出一串号码和一段音频文件，隔桌推过来。\n\n我扫了一眼，记下号码，把音频转发到自己手机上。\n\n“陈雯。”\n\n她抬头看我。\n\n“你真的是她吗？”\n\n我看着她湿润的眼睛，没有回答。\n\n转身拉开包厢门，走了出去。\n\n咖啡馆外，阳光刺眼。\n\n我站在街边，掏出手机给律师发消息。\n\n“证据包可以启动了。护工证词到手，原版录音完整，奶奶的呓语录音可以被推翻。”\n\n发送。\n\n屏幕上方弹出一条新消息。\n\n陈雯的号码。\n\n“她手里有我们当年的聊天记录。”\n\n## 第18章\n电影杀青那天，陈导把我单独叫到监视器前。\n\n他回放了最后一场戏，沈遥站在法庭证人席上做最终陈述。画面里的我，没有哭，没有喊，只是用很平的声音把一百三十七具尸体的真相一句一句说完。\n\n陈导按下暂停键。\n\n“这条我留着当预告片。”\n\n他转头看我，眼睛里有一种我从没见过的认真。\n\n“许栀，你以前那些戏我都看过，垃圾。”\n\n我等着他往下说。\n\n“但这部不一样。你像换了个人。”\n\n我没接话。\n\n“后期大概要三个月。”他站起来，拍了拍我肩膀，“等定档消息。”\n\n我点头，卸完妆走出片场。手机屏幕上，王医生的来电显示已经亮了三回。\n\n回拨过去，他接得很快。\n\n“许小姐，老太太昨晚又抢救了一次。”\n\n我攥紧手机。\n\n“现在情况暂时稳住，但心衰已经到了终末期。你要做好……”\n\n他没说完。\n\n“我马上过来。”\n\n私立医院特护病房里，奶奶戴着面罩，呼吸很浅。心电监护仪上的波形又慢又弱，像随时会断的线。\n\n王医生站在床边，翻着最新的检查报告。\n\n“心脏功能只剩下不到百分之十五，肾脏也开始衰竭。”\n\n他合上报告。\n\n“以她的身体条件，已经不能承受任何手术。剩下的时间，按天算。”\n\n我点头。\n\n“还有多久？”\n\n“快的话，一周。慢的话，半个月。”\n\n我拉开椅子坐下，握住奶奶的手。比上次更瘦了，手腕细得能一把攥住。\n\n王医生退出病房，轻轻带上门。\n\n监护仪的滴答声填满整个房间。\n\n我坐在那里，看着奶奶的脸。皱纹很深，颧骨突出，嘴唇没有一点血色。\n\n我忽然想起原主手机里那段语音。\n\n“奶奶，等我红了就接你回家。”\n\n她没等到。\n\n我低头，把脸埋进掌心里。\n\n不知道过了多久，奶奶的手指在我掌心里动了一下。\n\n我抬头。\n\n她睁开了眼睛，浑浊的目光慢慢聚焦在我脸上。\n\n“栀栀……”\n\n“奶奶，我在。”\n\n她看着我，看了很久。\n\n嘴唇动了动，面罩里浮起一层白雾。\n\n“你不是她。”\n\n我僵住了。\n\n奶奶的手指微微用力，攥住我的手。\n\n“但你是好孩子。”\n\n我的喉咙像被什么东西堵住，一个字都说不出来。\n\n“栀栀那孩子……”奶奶喘了口气，“苦了一辈子。”\n\n“你来了以后，她就不苦了。”\n\n我低下头，把额头贴在她手背上。\n\n“奶奶，我确实不是她。”\n\n“我是另一个人，一个死了的码农。不知道怎么就到了这具身体里。”\n\n奶奶没说话。监护仪还在滴答滴答地响。\n\n过了很久，她轻轻拍了拍我的手背。\n\n“我知道。”\n\n“你第一次给我削苹果，皮是断的。栀栀削了二十年苹果，皮从来没断过。”\n\n我愣住。\n\n“但你每天来看我，给我擦手，陪我说话。栀栀忙，没时间。”\n\n她停了一下。\n\n“你比她有心。”\n\n我抬起头，眼眶里有东西在打转。\n\n“奶奶，你不怪我？”\n\n“怪你什么？”\n\n她笑了一下，嘴角扯动得很费力。\n\n“你替她活着，替她洗清了脏水。我谢你还来不及。”\n\n我再也忍不住，眼泪砸在她手背上。\n\n奶奶轻轻摸着我的头发，像摸一个很小的孩子。\n\n“好孩子，别哭。”\n\n“你还有自己的路要走。”\n\n那天晚上，奶奶睡着了。我守在床边，没合眼。\n\n天亮的时候，她醒了一次，精神比昨天好了一些。我喂她喝了两口粥，她又睡过去。\n\n我坐在走廊的长椅上，打开电脑。\n\n从陈雯那里拿到的护工原版录音，我还没仔细处理。文件导出来，波形图在屏幕上铺开。\n\n林姐发给营销号的那段，只有四十七秒。而原版录音有将近四分钟。\n\n我逐帧对比。\n\n原版里，奶奶说的是：“栀栀，你来看我了。栀栀，你瘦了。奶奶心疼。”\n\n营销号发出来的版本，把中间剪掉，前后拼接。第一句的尾音接上最后一句的开头，变成“你不是我的栀栀”。\n\n我又调出林姐发给“圈内老炮”的音频文件元数据。采样率、比特率、编码格式，全部与护工手机录制的原始文件匹配。\n\n但时间轴上，有一段被标记为“剪切”的痕迹。\n\n我把对比图、波形分析、元数据报告整理成一个文档。\n\n然后给律师发了条消息：“录音剪辑证据链完整。加上护工证词，可以推翻所有‘夺舍’指控。”\n\n律师回复很快：“收到。已并入终局证据包。”\n\n我合上电脑，靠在椅背上。\n\n病房门开了，护士探出头。\n\n“许小姐，老太太醒了，说想见你。”\n\n我站起来，快步走进病房。\n\n奶奶靠在枕头上，脸色比昨晚好了一点。她冲我招了招手。\n\n我走过去，坐在床边。\n\n“栀栀，我跟你说个事。”\n\n“奶奶你说。”\n\n她抬起手，指了指床头柜的抽屉。\n\n“里面有个铁盒子，你拿出来。”\n\n我拉开抽屉，取出一个生锈的铁皮盒。打开，里面是一对银镯子，用红布包着。\n\n“这是栀栀她妈留给她的。”\n\n奶奶的声音很轻。\n\n“她妈走的时候，栀栀才三岁。她妈说，等栀栀长大了，把镯子给她，让她别记恨。”\n\n我拿出镯子，内壁上刻着两个小字：平安。\n\n“奶奶，这个你留着。”\n\n“留不住了。”\n\n她摇了摇头，把镯子推到我手边。\n\n“你戴着。就算你不是栀栀，你也替她活了一回。”\n\n我攥着镯子，金属的凉意透过掌心传上来。\n\n“奶奶……”\n\n“好了，不说这些了。”\n\n她闭上眼睛，嘴角带着一点笑意。\n\n“我累了，睡一会儿。”\n\n我替她掖好被角，把镯子戴在手腕上。银圈很细，贴着皮肤，凉凉的。\n\n走出病房，手机在口袋里震了一下。\n\n我掏出来看。\n\n电影方的消息，一行字：\n\n“恭喜，您入围颁奖礼最佳女主角提名。”\n\n人物卡：\n[\n {\n  \"name\": \"许栀（穿越者）\",\n  \"role\": \"主角\",\n  \"traits\": [\n   {\n    \"trait\": \"技术流，用代码排查图片造假\",\n    \"evidence_chapter\": 1\n   },\n   {\n    \"trait\": \"冷静果断，会所录音取证\",\n    \"evidence_chapter\": 4\n   },\n   {\n    \"trait\": \"护短，拼命守护奶奶\",\n    \"evidence_chapter\": 3\n   }\n  ],\n  \"fate\": \"替原主复仇成功，解约，事业翻身，奶奶去世，决心好好活。\"\n },\n {\n  \"name\": \"严寒\",\n  \"role\": \"反派，资本大佬\",\n  \"traits\": [\n   {\n    \"trait\": \"傲慢控制欲，威胁潜规则\",\n    \"evidence_chapter\": 4\n   },\n   {\n    \"trait\": \"阴狠，用奶奶威胁\",\n    \"evidence_chapter\": 2\n   },\n   {\n    \"trait\": \"资本操控舆论\",\n    \"evidence_chapter\": 1\n   }\n  ],\n  \"fate\": \"录音曝光，股价跌停，合作解约，警方介入，身败名裂。\"\n },\n {\n  \"name\": \"奶奶\",\n  \"role\": \"原主唯一亲人，主角守护对象\",\n  \"traits\": [\n   {\n    \"trait\": \"善良坚韧，为孙女倾尽所有\",\n    \"evidence_chapter\": 2\n   },\n   {\n    \"trait\": \"临终清明，识破穿越者\",\n    \"evidence_chapter\": 10\n   }\n  ],\n  \"fate\": \"去世。\"\n },\n {\n  \"name\": \"林姐\",\n  \"role\": \"执行经纪，帮凶\",\n  \"traits\": [\n   {\n    \"trait\": \"势利威胁\",\n    \"evidence_chapter\": 1\n   },\n   {\n    \"trait\": \"见风使舵\",\n    \"evidence_chapter\": 7 许栀。”\n“关于网上的无端造谣，我现在要放出第一批澄清证据……”\n我把整理好的图片造假鉴定报告举到镜头前。\n屏幕画面突然卡顿，紧接着直接黑屏。\n系统弹窗跳了出来：\n【您的账号已被异地强制登录。】\n经纪公司的动作太快了。\n不出五分钟，微博上被水军刷起新一轮的热搜词条：\n许栀开播作秀\n许栀被封禁后垂死挣扎演烂戏。\n桌上的备用手机狂震起来。\n“许小姐，你快来医院！”\n“刚才不知道怎么混进来了几个极端黑粉，跑到病房门口拉横幅大骂！”\n“老太太心脏本就不好，受了刺激，已经送进急救室抢救了！”\n王医生的声音透着焦急。\n我心脏骤缩，抓起大衣疯了一样冲出家门。\n冲出公寓楼的大门，黑压压的狗仔和代拍便涌了上来。\n代拍为了博眼球，竟然把镜头压低，恶劣地往我胸前的隐私部位怼。\n“许栀！网上说你被金主抛弃了，是真的吗？”\n“你毁容的照片是不是真的？回应一下！”\n“滚！”\n我眼神一厉，拍掉面前的单反，拉开车门直奔医院。\n急救室门外的每一分每一秒都像是在被凌迟。\n直到四个小时后，抢救室的红灯熄灭。，\n奶奶挺了过来。\n我虚脱地滑坐在长椅上。\n确认奶奶被安全转移到重症监护室后，我拖着沉重的步伐离开医院。\n迈出医疗大楼的旋转门时，几声快门声从花坛后传来。\n等我回到公寓，网上掀起了更加狂暴的风浪。\n热搜榜首赫然挂着：\n许栀现身医院，疑似刚做完修复手术\n配图正是我脸色苍白走出医疗大楼的抓拍。\n断章取义，指鹿为马。\n进入客厅，执行经纪林姐正坐在我的沙发上。\n林姐踩着高跟鞋走过来，夺过我的手机拔出电话卡，\n当着我的面，将其折成两半扔进垃圾桶。\n“许栀，公司已经把你所有社交账号退登并修改了密码。”\n“这期间，你休想再上网发一个字。”\n林姐冷笑一声，\n“严总耐心有限。”\n“今晚八点，夜色顶层包厢，这是你最后的机会。”\n“如果今晚你还不识抬举，明天会发生什么，我们也不知道。”\n林姐摔门离开，房间恢复死寂。\n我打开电脑，连上WiFi，微信跳出一条严寒发来的语音：\n“许栀，挣扎好玩吗？今晚打扮得漂亮点。”\n我敲下一行字点击发送：\n“好，今晚见。”\n我起身走到梳妆台前，拿起原主的水钻胸针。\n我用刀片撬开后盖，将一枚指甲盖大小的微型芯片嵌入其中。\n这是我亲自编写的加密录音程序。\n只要开启，音频会实时加密并同步上传至我的私有云端。\n\n我将胸针别在黑色风衣的暗褶处，开车去了夜色。\n\n## 第4章\n夜色会所顶层，安保森严。\n刚出电梯，两个穿黑西装的保镖就拦住了我。\n“许小姐，规矩您懂。”\n“手机交出来，例行搜身。”\n我把手机扔进托盘，张开双臂。\n女保镖上上下下摸索了一遍，随即放行。\n推开包厢门，刺鼻的雪茄味扑面而来。\n严寒坐在真皮沙发里，手里晃着半杯威士忌。\n“终于学乖了？”\n他拍了拍身边的空位，\n“坐过来。”\n我没动，站在离他三步远的地方：\n“网上的那些黑料，你到底要怎样才肯撤掉？”\n严寒冷笑一声：\n“许栀，别装傻。”\n“那几张图，还有你靠奶奶卖惨的通稿，全是我让人放出去的。”\n“只要我一句话，水军立刻停手，你奶奶也能在医院睡个安稳觉。”\n“所以，这一切都是你逼我就范的手段？”\n我暗中调整站姿，确保胸针的麦克风孔正对他。\n“不然呢？”\n他站起身，步步逼近，\n“在这个圈子里，没有我的点头，你寸步难行。”\n“陪我，是你唯一的出路。”\n“只要你乖乖听话，昨天的黑热搜，明天就能变成洗白通稿。”\n他走到我面前，伸手摸向我的脸。\n我侧身抄起桌上的冰水，假装手滑泼在了他的高定西裤上。\n“严总，抱歉。”\n我后退两步，迅速拉开安全距离，\n“这件事太突然了，我需要一晚上的时间考虑。”\n严寒脸色铁青，眼中戾气翻涌。\n但他似乎很享受这种猫捉老鼠的掌控感，拿过纸巾擦了擦手。\n“行，我给你一晚上。”\n“明天早上，我要听到你的回复。”\n“否则，你知道我的手段。”\n回到公寓，我反锁房门，打开电脑。\n切入私有云端，刚才那段长达十五分钟的对话音频已经躺在加密区。\n我敲击键盘输入密钥，将乱码解码为清晰的音频文件。\n接着，我翻出原主之前备份的早期威胁短信截图。\n我明白，利用主流网站揭露这些行不通，\n那我只好采取些非常手段。\n为了避开经纪公司的网络监控，我从口袋里摸出一张电话卡。\n这是今天去医院时，我趁乱从奶奶的旧手机里拔出来的。\n插卡，联网。\n我切入暗网，购买了三个境外的僵尸网络节点作跳板，\n将音频和短信截图，连同图片造假鉴定报告进行多重加密打包。\n一份通过内网通道直达网信办举报中心；\n一份发给早已拟定好合同的顶尖维权律师；\n最后一份，我写了一个延时触发的脚本，\n匿名投递给国内三家以绝不妥协著称的媒体主编邮箱。\n做完这一切，天已经亮了。\n早上八点，严寒的微信准时发了过来：\n“考虑得怎么样了？”\n我果断地回复，\n“我考虑过了，我不同意。”\n“别敬酒不吃吃罚酒，得罪我，我保证让你在这个圈子里混不下去！”\n我冷笑一声，\n一边切屏给律师发送行动的指令，一边在对话框里敲下回复：\n“你还是准备好，担心担心你自己吧。”\n\n## 第5章\n“砰！”\n我公寓的防盗门传来一声巨响。\n紧接着，是严寒打来的视频通话。\n我按下接听，画面里，严寒身后的背景赫然是医院重症住院部的走廊！\n“许栀，你敢跟我耍花招？找死！”\n他将镜头对准前方几个黑衣壮汉\n与此同时，我公寓的防盗门锁报废，防盗门倒塌掀起一阵尘土。\n三个提着钢管的壮汉盯着我，步步逼近。\n手机屏幕里，严寒叫嚣的声音震得我耳膜生疼：\n“我让你装！我现在就拔了这老东西的管子！”\n我倚靠在椅背上，嘴角勾起嘲讽：\n“你拔啊。”\n视频中，黑衣人掀开病床上的被子。\n空的。\n严寒震惊地盯着屏幕里的空床。\n“人呢？！”\n“严总，你真以为我会放心把奶奶留在普通重症区？”\n我语气没有一丝起伏，\n“昨晚从会所出来，我就联系了私立医院。”\n“现在我奶奶躺在安保级别最高的特护病房。”\n“别说你的打手，连一只苍蝇都飞不进去。”\n“你想打扰她？下辈子吧。”\n“臭婊子，你敢耍我！”\n严寒在视频那头气急败坏。\n我挂断视频，按下桌上的遥控器，天花板四个角落的摄像头同时亮起红灯。\n“这是我的私人云端实时同步录像。”\n“另外，十分钟前我已经报了警。”\n我晃了晃手机，窗外刚好传来由远及近的警笛声，\n“要试试这钢管砸下来，你们能判几年吗？”\n三人脸色一变，对视一眼，骂骂咧咧地夺门而逃。\n危机解除。\n我跨过一地狼藉，重新坐回电脑前，拨通了律师的电话。\n等待接通时，我瞥见原主日记本摊在桌角，一页被撕掉，夹着张旧照片，背面写着“陈雯，等我红了就去找你”。\n“动手吧。”\n五分钟后，一份盖着公章的律师函发送到了经纪公司高层的邮箱里。\n除了解约声明，里面还附带了一份“大礼包”：\n林姐知情，且纵容协助严寒潜规则旗下艺人的聊天记录和邮件往来。\n另一边，严寒察觉到了部分证据已经开始外泄。\n我的网络监测探针显示，各大平台的敏感词库正在被更新。\n严寒急眼了。\n雷霆大怒之下，他开始疯狂砸钱，动用庞大的公关力量全网删帖。\n热搜榜上，关于他公司的词条迅速被撤下，\n吃瓜群众发出的质疑贴不到一分钟就被删，\n大批高级水军下场，强行把水搅浑。\n叮的一声，严寒的短信发了过来：\n“只要钱到位，互联网就不会有你的记忆！”\n“你奶奶躲得过初一躲不过十五，走着瞧！”\n看着这句狠话，我只觉得可笑。\n我已经切断了他打探病房信息的渠道。\n他现在的威胁，不过是落空后的无能狂怒。\n电脑屏幕右下角，一个红色的倒计时窗口正在安静地跳动。\n“3、2、1……”\n进度条拉满，定时投递脚本触发成功。\n三封加密邮件，滑入了三家深度调查媒体主编的收件箱。\n\n## 第6章\n这三家媒体以不畏强权、死磕真相在业内著称。\n严寒的资本手腕能买通营销号，却买不动这些真正的新闻人。\n两小时后，早上八点整，早高峰通勤的节点。\n原本被严寒水军搅得乌烟瘴气的社交平台，撕开了一道口子。\n没有预热，没有娱乐圈惯用的八卦噱头，\n三家深度调查媒体全网同步推送了一篇万字长文。\n标题字字见血：\n《赛博猎巫的背后：资本胁迫、技术造假与一场完美的网络谋杀》。\n文章开篇，甩出了我那份长达三十页的图像技术鉴定报告。\n作为资深码农，我给出的证据链是降维打击级别的。\n报告里放大了所谓“医美现场图”的所有噪点，详细展示了ELA热力图，\n甚至直接提取了图片底层的EXIF数据，\n将拼接合成的操作痕迹、修改时间和部分硬件特征，展示得清清楚楚。\n这篇报道像一枚深水炸弹，引爆了整个网络。\n“卧槽！作为一个十年后期修图师的我头皮发麻。”\n“这报告太硬了，这根本不是什么吃瓜，这是高技术犯罪啊！”\n“看懂了，图片是P的，就医记录是假的，连所谓的知情人士是虚拟账号。”\n“我去，我们全被当枪使了！”\n“细思极恐……如果许栀拿不出这份报告，她现在是不是已经被逼上绝路了？”\n风向变了。\n原本满屏的荡妇羞辱和谩骂，转变成了对资本只手遮天的恐惧与愤怒。\n这不再是一桩茶余饭后的戏子黑料，\n而是被严肃定性为一桩涉及资本胁迫的网络暴力案件。\n那些原本跟着带节奏的大V们悄悄删除微博，理智的路人成批觉醒。\n严寒慌了。\n后台监测仪上，我看到大量异常流量正在冲击这三家媒体的服务器。\n严寒的水军涌入评论区，试图用以往那种胡搅蛮缠的方式把水再次搅浑。\n他甚至动用了最高级别的公关预案，试图花重金强行撤掉热搜词条。\n但这次，他踢到了铁板。\n这三家硬核媒体背后，是坚不可摧的公信力和新闻底线。\n严寒的团队绝望地发现，他们的资本权限在这里根本不管用。\n不仅文章删不掉，反而因为短时间内触发了平台的异常压制机制，\n被系统判定为重大社会事件，强推上了各大首页的置顶位，全网飘红。\n真相如同决堤的洪水，势不可挡。\n我坐在电脑前，看着数据监控面板。\n代表“许栀澄清”、“资本网暴”的词条指数正在呈指数级狂飙，\n而严寒关联实业公司的网络风评和股市预期，则断崖式暴跌。\n局势逆转，一切都在计算之中。\n我正准备关掉网页，去医院看望奶奶，\n医院护工来电，说奶奶昏迷中喃喃“栀栀左手有疤”。我低头看自己光滑的左手，只当是老人胡话。\n电脑屏幕右下角的监控雷达突然发出一声尖锐的红色警报。\n一条全新的词条，突破了媒体的封锁，空降热搜榜第一。\n词条后面，跟着一个刺眼的的深红色“爆”字。\n许栀主动投怀送抱，会所监控流出\n我盯着这条热搜，眼睛微微眯起。\n\n## 第7章\n鼠标点开那个刺目的“爆”字。\n屏幕上弹出一段三十秒的无声监控视频。\n画面正是我昨晚走进那家私人会所包厢的场景。\n因为角度刁钻，视频里的我看起来像是顺从地交出手机，\n任由保镖搜身后走进了光线昏暗的包厢。\n视频末尾还被恶意剪辑了一段我靠近严寒倒水的画面，\n没有声音，加上模糊处理的滤镜，看起来就像是我在主动投怀送抱。\n营销号的配文更是恶毒：\n“所谓的技术流澄清不过是洗白手段。”\n“事实是许栀早已向资本低头，深夜主动赴约，企图用身体平息风波。”\n严寒这手脏牌打得真是时候。\n他想利用大众对娱乐圈潜规则的固有偏见，\n将我钉死在“当了婊子还立牌坊”的耻辱柱上。\n我没慌，反而笑了。\n等的就是他这步棋。\n现在全网都在盯着我，流量达到了巅峰。\n我打开手机，登上了公司归还的账号，点击开启直播。\n没有预热，开播瞬间直播间涌入了十万人。\n弹幕狂刷，夹杂着不堪入目的词汇。\n我没理会这些，把昨晚那枚胸针摘下来，摆在镜头前。\n“大家都在看严总放出的无声电影。”\n“既然剧情这么精彩，不配点原声怎么行？”\n我将胸针连接电脑，手指敲击回车键。\n我编写的加密程序，绕过防火墙，解压提取音频。\n一段清晰无比的对话，传遍了整个网络。\n“许栀，你是个聪明人。”\n“只要你今晚留下，所有的黑料我十分钟内就能让它们消失。”\n这是严寒的声音，带着不加掩饰的傲慢。\n紧接着，是我冷静的质问：\n“所以，那些医美假照还有买通营销号的造谣，全是你干的？”\n“是我又怎么样？”\n“在这个圈子里，资本就是规矩。\n“不顺从我，你连翻身的机会都没有！”\n“不仅是你，那个躺在医院里的老太婆也别想安生……”\n音频扒下了严寒衣冠楚楚的伪装，露出了他威逼利诱冷血嘴脸。\n弹幕在那一刻，出现了诡异的停顿。\n紧接着，整个直播间炸锅了。\n“草！这男的太恶心了！”\n“这哪里是潜规则，这是黑社会性质的敲诈勒索吧？！”\n“反转了！许栀是去录音取证的！她根本没妥协，她太刚了！”\n我看着飙升的热度，对着镜头开口：\n“严寒，你以为交出手机，搜了身，我就没办法了吗？”\n“这段录音，我已经同步发给了警方。”\n另一边，经纪公司的高层会议室里早已乱作一团。\n林姐和公司高管们看着直播间里引爆的舆论，冷汗直流。\n他们原本还想把原主当成礼物送给严寒，\n但现在事情的性质已经从娱乐八卦升级成了违法犯罪。\n严寒如今玩脱了。\n稍有不慎，公司都会作为拉皮条的从犯被牵连进去。\n“快！把之前所有的通稿全撤了！”\n公司高层在会议室里咆哮，\n“马上发声明，把公司和严寒的关系摘干净！快啊！”\n我的手机屏幕亮了，一条来自林姐的信息弹了出来：\n“小栀，公司决定挺你，严寒的事我们全不知情。”\n“你先下播，我们好好谈谈后续的公关。”\n我对着直播间的镜头，将手机屏幕怼到了镜头前。\n“看，原来落井下石的人，翻脸也可以这么快。”\n众人还在震惊于经纪公司的无耻时，直播间的连麦申请响了起来。\n来电显示，居然是严寒本人。\n\n需要带过来的事实 carried_facts：\n[\n {\n  \"fact\": \"严寒录音曝光后，主角拒绝连麦，宣布证据已发警方，严寒实业股价跌停、合作方解约，警方立案调查。\",\n  \"source_chapter\": 8,\n  \"replant\": \"续写第1章通过主角切断直播后的手机新闻推送和内心独白快速交代。\"\n },\n {\n  \"fact\": \"苏菲代言解约，S级剧换人，水军头子被立案调查。\",\n  \"source_chapter\": 8,\n  \"replant\": \"续写前段通过娱乐新闻或苏菲求饶电话交代。\"\n },\n {\n  \"fact\": \"经纪公司发布致歉信，推责林姐，附无条件解约协议书，主角签字发送。\",\n  \"source_chapter\": 8,\n  \"replant\": \"续写第2章主角收到解约协议邮件，签字后长舒一口气。\"\n },\n {\n  \"fact\": \"奶奶在主角拍完电影后回光返照，识破主角不是原主，感谢她后安详离世。\",\n  \"source_chapter\": 9,\n  \"replant\": \"续写第9-10章重新演绎奶奶临终场景，保留识破身份和感谢的核心情感。\"\n },\n {\n  \"fact\": \"主角扎进剧组大半年，电影公映后获全网好评，撕掉废柴花瓶标签。\",\n  \"source_chapter\": 9,\n  \"replant\": \"续写中段用剧组蒙太奇和影评片段交代。\"\n }\n]\n\n已写的续写章节：\n## 第8章\n直播间里，连麦申请的铃声像催命符一样响个不停。\n\n屏幕上，严寒的头像疯狂闪烁。\n\n弹幕已经刷疯了：\n\n“接啊！看他还有什么话说！”\n\n“严总这是要当众道歉吗？”\n\n“许栀别怂！”\n\n我对着镜头，嘴角扯出一个弧度，鼠标移向那个闪烁的红色按钮。\n\n按了下去。\n\n连麦界面瞬间黑屏，只剩下弹幕区满屏的问号。\n\n“严寒，你以为我会给你一个当众表演的机会？”\n\n我把键盘拉到面前，手指飞快地敲下一行字，同步到直播间公告栏。\n\n“互联网不是法外之地，严总，留着你的话去跟警察解释吧。”\n\n发送。\n\n然后，我点击了关闭直播。\n\n屏幕暗下去的前一秒，弹幕定格在刷屏的问号上。\n\n手机开始疯狂震动，各种推送像洪水一样涌进来。\n\n第一条，来自财经快讯：\n\n【严寒实业股价断崖式跌停，市值蒸发超三十亿。】\n\n第二条，来自娱乐前线：\n\n【严寒名下多家公司遭合作方紧急切割，已有三个品牌方宣布终止合作。】\n\n第三条，来自社会新闻：\n\n【警方已就“网络造谣及资本胁迫案”正式立案，严寒被限制出境。】\n\n我把手机屏幕转向电脑摄像头，录了一小段视频，发到个人主页。\n\n配文只有一行字：\n\n“完整录音与数据证据链，已提交警方。后续进展，依法公开。”\n\n做完这些，我靠在椅背上，长出一口气。\n\n邮箱弹出一封新邮件，是经纪公司法务部发来的。\n\n我点开。\n\n一封致歉信，用词恳切，把所有责任推给了林姐，说她是“个人行为，公司事先并不知情”。\n\n附件里，是一份无条件解约协议书。\n\n我快速扫了一遍条款，确认没有陷阱，签上“许栀”两个字，点击发送。\n\n屏幕弹出“发送成功”的提示时，我盯着那两个字看了很久。\n\n第一次觉得，这个名字，这具身体，真正属于我了。\n\n手机响了，来电显示：苏菲。\n\n我按下接听，没说话。\n\n“许栀……栀姐，之前的事是我不对，我一时糊涂，你大人不记小人过……”\n\n苏菲的声音在发抖，背景里隐约有人在催她，“菲姐，品牌方那边催着要解约函……”\n\n“你代言掉光了，戏也换人了，才想起给我打电话？”\n\n我语气很平。\n\n“不是，你听我说，那些水军都是严寒让我买的，我也是被逼的……”\n\n“你被逼的？”\n\n我笑了一声，\n\n“苏菲，你发给我的私信，我可都存着呢。”\n\n“你……你想怎么样？”\n\n“不想怎么样。”\n\n我挂了电话，顺手把她的号码拖进黑名单。\n\n娱乐新闻的推送紧接着弹出来：\n\n【苏菲多个代言遭品牌方火速解约，S级古装剧《长歌行》宣布换人，原定女主苏菲被替换。】\n\n我把手机扔到桌上，目光落在桌角那本日记本上。\n\n那页被撕掉的痕迹还在。\n\n我伸手翻到那个缺口，夹层里滑出一张旧照片。\n\n照片上，两个女孩站在孤儿院门口，笑得灿烂。\n\n左边那个，是原主许栀，扎着马尾，左手腕上有一道明显的疤。\n\n右边那个，我不认识，照片背面用圆珠笔写着两个字：\n\n陈雯。\n\n我把照片翻过来，盯着那个名字。\n\n左手有疤。\n\n我想起医院护工白天打来的那通电话，说奶奶昏迷中一直在喃喃“栀栀左手有疤”。\n\n我低头看了看自己的左手，光滑，干净，一道疤都没有。\n\n正想着，手机屏幕又亮了。\n\n一条来自陌生号码的短信，只有一句话：\n\n“许栀，你还记得陈雯吗？”\n\n我攥紧那张旧照片，屏幕的光映在“陈雯”两个字上，格外刺眼。\n\n## 第9章\n水军头子被立案调查的消息上了热搜第三。\n\n词条后面跟着一个橙色的“热”字。\n\n警方通报写得清清楚楚：某营销公司负责人因涉嫌非法经营、寻衅滋事被刑事立案，名下多个账号已封禁。\n\n评论区有人贴出截图，是那家营销公司的内部报价单，明码标价“黑热搜套餐” 上机记录。\n\n那个时间段，只有一个人用了那台机器。\n\n登记的名字是——\n\n陈雯。\n\n## 第13章\n直播开始的时候，我正在煮咖啡。\n\n手机架在料理台上，屏幕里林姐坐在访谈室的沙发上，妆容精致，语气沉痛。\n\n“作为许栀的前经纪人，我本来不想说这些。”\n\n她低头擦了擦眼角。\n\n“但我实在看不下去了。”\n\n陈雯坐在她旁边，低着头，手里攥着一张照片。\n\n主持人把话筒递过去。\n\n“陈女士，您和许栀是孤儿院时期的好友，您能确认什么？”\n\n陈雯抬起头，声音很轻。\n\n“她左手腕上有一道疤，五岁时摔在铁栅栏上缝了七针。”\n\n她举起那张旧照片，镜头推近，疤痕清清楚楚。\n\n“可现在的许栀，左手什么都没有。”\n\n主持人追问：“您是说，现在的许栀不是本人？”\n\n陈雯没回答，只是把手机连上了演播室音响。\n\n奶奶的声音传出来，虚弱，断续。\n\n“你不是我的栀栀……”\n\n“栀栀左手有疤……我记得的……”\n\n演播室安静了两秒。\n\n苏菲适时接话，语气关切：“我们都很担心栀栀的精神状态，如果她真的遇到了什么……”\n\n她顿了顿。\n\n“或者，被什么东西占据了身体，我们希望她能早点回来。”\n\n弹幕疯了。\n\n我关掉直播，咖啡已经凉了。\n\n打开微博，词条挂在热搜第一。\n\n#许栀被夺舍# 后面跟着深红色的“爆”。\n\n评论区置顶是营销号发起的投票：“你相信许栀被夺舍了吗？”\n\n七万人参与，六万三千票投了“相信”。\n\n“让她验疤！验不了就是心虚！”\n\n“这已经不是娱乐圈的事了，这是灵异事件！”\n\n“@网信办 @公安部 建议介入调查。”\n\n手机开始响。\n\n第一个电话是代言品牌方，对方语气为难：“许栀女士，我们总部那边压力很大，合同暂时中止，后续再联系。”\n\n第二个是剧组制片人：“定妆照先不拍了，投资方说要重新评估风险。”\n\n第三个、第四个、第五个。\n\n我把手机调成静音，来电记录截屏存档。\n\n门铃响了。\n\n从猫眼看出去，楼道里挤满了人。长焦镜头、摄像机、举着手机直播的博主。\n\n“许栀！出来说两句！”\n\n“你左手敢不敢伸出来给大家看看！”\n\n“你是不是已经死了？现在是谁在操控你的身体？”\n\n我拉上窗帘，坐回电脑前。\n\n邮箱里躺着一封新邮件，发件人是经纪公司法务部。\n\n“许栀女士，鉴于目前舆论涉及重大公共关切，公司要求您于今日下午三时前提交三甲医院出具的身体检查报告，包括但不限于指纹、疤痕、DNA比对。”\n\n“如拒绝配合，公司将视为您单方面放弃所有申辩权利。”\n\n我敲下回复：“拒绝。”\n\n发送。\n\n王医生的电话打进来，我接了。\n\n“许小姐，老太太今天下午突然心律不齐，刚抢救过来。”\n\n他压低声音。\n\n“她一直在喊你的名字，你方便过来一趟吗？”\n\n“我马上到。”\n\n我抓起大衣和车钥匙，走到门口。\n\n猫眼里，狗仔还堵在楼道。\n\n我拉开门的瞬间，闪光灯像暴雨一样砸过来。\n\n“许栀！说两句吧！”\n\n“你到底是人还是鬼！”\n\n有人把镜头怼到我脸上，有人伸手拽我的包带。\n\n我冷着脸，一个字没说，挤开人群往电梯走。\n\n一个代拍追上来，镜头几乎戳到我鼻尖：“你左手敢伸出来吗？就一下！”\n\n我停下脚步，转头看他。\n\n“让开。”\n\n声音不大，但那人愣了一下，后退半步。\n\n我进了电梯，按下关门键。\n\n医院走廊弥漫着消毒水味。\n\n王医生在病房门口等我，表情凝重。\n\n“刚打了镇静，现在睡了。”\n\n他翻开病历，“心衰加重，不能再受刺激。”\n\n“网上的事，病房里有人刷到了？”\n\n王医生沉默两秒。\n\n“隔壁床的家属在看直播，声音外放。”\n\n我推开病房门，奶奶躺在床上，鼻子里插着氧气管，胸口微弱起伏。\n\n床头柜上，一部旧手机屏幕还亮着。\n\n上面正在播放一段视频，标题是“许栀奶奶亲口指认：她不是我孙女”。\n\n播放量已经过百万。\n\n剪辑者把奶奶在病床上的呓语，配上了阴森的背景音乐和字幕特效。\n\n评论区第一条：“连亲奶奶都不认她，这还有什么好说的？”\n\n我伸手关掉视频，把手机扣在桌上。\n\n指节在发抖。\n\n我走到走廊尽头，靠着墙，慢慢滑坐到地上。\n\n消毒水的气味钻进鼻腔，走廊里人来人往，有人推着器械车经过，轮子碾过地砖发出刺耳的声响。\n\n我闭上眼。\n\n原主留下的旧手机还揣在我大衣口袋里，硌着肋骨。\n\n我把它摸出来，握紧。\n\n奶奶的声音还在脑子里转——“你不是我的栀栀”。\n\n我知道她没说错。\n\n我确实不是。\n\n但我不能认。\n\n认了，原主就白死了。\n\n认了，严寒就赢了。\n\n认了，奶奶就没人管了。\n\n我睁开眼，从地上站起来。\n\n走到护士站借了台电脑，连上我的私有云端。\n\n手指在键盘上敲了第一行指令。\n\n林姐的银行流水，我早就爬下来了。之前没动，是因为没到清算的时候。\n\n现在到了。\n\n我调出她近半年的转账记录，按时间排序。\n\n一笔一笔筛。\n\n凌晨两点十七分，一笔大额转出。\n\n收款方是一家注册在维京群岛的空壳公司。\n\n我放大收款账户信息，往下翻。\n\n实控人一栏，清清楚楚写着两个字。\n\n严寒。\n\n## 第14章\n林姐的转账记录不止一笔。\n\n我继续往下翻，收款方那家维京群岛空壳公司，半年内从林姐账户吸走了三百多万。每笔转账的时间节点，都卡在原主拒绝严寒之后的第三天、第五天、一周后。\n\n我调出林姐的邮件备份，之前从经纪公司服务器里一并爬下来的。\n\n搜索关键词：许栀。\n\n三百多封邮件，我按时间倒序排列，筛出她和严寒助理的往来。\n\n第一封，去年十一月。严寒助理发来一份名单，上面列了七个女艺人，许栀排在最后。\n\n林姐回复：“许栀最难搞，奶奶那边可以下手。”\n\n第二封，十二月。严寒助理发来一个压缩包，里面是伪造的医美病历和第一批黑图。\n\n林姐回复：“收到，明天安排营销号发。”\n\n第三封，今年一月。林姐主动发了一组许栀的私人行程表，包括奶奶住院的科室、床号、主治医生。\n\n邮件末尾加了一句：“严总放心，她跑不掉。”\n\n我把所有邮件按时间轴整理，配上转账记录、聊天截图，做成一份完整的证据链文档。\n\n三百七十四页。\n\n做完这些，天已经黑了。\n\n我没有急着发。\n\n现在发出去，最多让林姐进去蹲几年。严寒已经批捕，苏菲掉了代言，这些都不够。\n\n我要等。\n\n等到一个所有目光都聚焦的时刻，一次性清算。\n\n手机震了一下，苏菲发了条微博，配图是她在某品牌活动上的精修照。\n\n“清者自清，浊者自浊。有些人忙着编故事，有些人忙着往前走。”\n\n评论区水军整齐刷屏：“姐姐好美”“不跟糊咖计较”。\n\n我转发了她的微博，只加了四个字：“清者自清。”\n\n评论区瞬间两极分化。\n\n“许栀终于回应了！”\n\n“就四个字？疤的事不解释？”\n\n“人家忙着拍戏，谁像你们天天盯着别人左手看。”\n\n“我信她，那份技术鉴定报告不是一般人能拿出来的。”\n\n“信她个鬼，夺舍实锤！”\n\n我没有再看。舆论稳住了，两边吵得越凶，热度维持得越久。等终局到来，所有的质疑都会变成打向林姐和苏菲的子弹。\n\n第二天早上，一条微信好友申请弹出来。\n\n验证消息：“陈导。”\n\n我通过。\n\n对方直接发来一段语音，声音沙哑，带着片场特有的嘈杂背景音。\n\n“许栀，我看了你那场直播。别人看热闹，我看门道。”\n\n“你对着十万条辱骂，手没抖，声没颤，眼睛里全是算计。这种心理素质，我下部戏的女主角，非你不可。”\n\n紧接着，一份电子合同发过来。\n\n电影项目：《暗河》。\n\n现实主义悬疑题材，女主角是个被诬陷杀人的法医，全片一百二十七场戏，一百零三场有她。\n\n片酬那一栏，填的是S级顶格。\n\n我翻到合同最后一页，导演已经签了字。\n\n我回复：“陈导，我接。”\n\n他秒回：“下周三进组。把你左手的事处理好，别让剧组为难。”\n\n“明白。”\n\n我关掉对话框，把合同转发给律师存档。\n\n下午，我开车去了私立医院。\n\n奶奶躺在特护病房里，鼻氧管换成了面罩，脸色比上次好了一些。\n\n王医生在走廊拦住我。\n\n“许小姐，老太太的情况暂时稳住了。心衰的基础还在，但私立医院这边的设备和护理跟上了，短期内不会有危险。”\n\n他顿了顿。\n\n“不过她清醒的时间越来越少，你要有心理准备。”\n\n“我明白。”\n\n我走进病房，坐在床边。\n\n奶奶的眼皮动了动，没有睁开。嘴唇翕了两下，声音太轻，我听不清。\n\n我握住她的手。\n\n枯瘦，冰凉，指节因为常年输液而泛着青紫。\n\n“奶奶，我要去拍戏了。”\n\n她的手指在我掌心里微微动了动。\n\n“拍完这部戏，我就能洗掉所有脏水。”\n\n“到时候，我推你去看首映。”\n\n奶奶的嘴角好像弯了一下，又好像没有。\n\n我坐了很久，直到护士进来换药，才起身离开。\n\n走出病房，手机屏幕亮了。\n\n一条来自陌生号码的短信，只有六个字：“替身，颁奖礼见。”\n\n号码归属地查不到，但语气我认得。\n\n苏菲。\n\n我把短信截图，存进加密文件夹。\n\n文件夹命名：“终局”。\n\n里面整整齐齐码着林姐的三百七十四页证据链、苏菲的私信截图、陈雯在网吧的上机记录，还有奶奶病房被骚扰那天的监控备份。\n\n我删掉苏菲的短信，打开加密文件夹，最后检查了一遍文件结构。\n\n所有证据分成三份，设置了三个不同的定时触发节点。\n\n第一份，颁奖礼红毯开始前两小时，自动投递给三家媒体。\n\n第二份，颁奖礼最佳女主角揭晓的瞬间，自动上传至网信办举报平台。\n\n第三份，如果前两份被拦截，四十八小时后，自动群发至全网所有主流社交平台。\n\n文件名：终局。\n\n我合上电脑，把旧手机从抽屉里取出来，和加密硬盘一起锁进保险柜。\n\n站起身，走到窗前。\n\n楼下没有狗仔了。\n\n远处，城市的天际线亮起万家灯火。\n\n## 第15章\n进组第一天，陈导没让我试戏。\n\n他把剧本扔给我，指了指监视器旁边的折叠椅。“坐那儿看，看三天。”\n\n我没问为什么。坐下来，翻开剧本。\n\n女主角叫沈遥，法医，被指控伪造尸检报告。全片核心冲突是：她到底有没有篡改数据。\n\n陈导拍戏不用分镜脚本，现场走位全靠演员自己找。第一场审讯戏，他让男主即兴发挥，台词随便说。\n\n监视器里，男主拍桌怒吼：“你改了报告！你收了钱！”\n\n沈遥的台词本上只有一句：“我没有。”\n\n我盯着剧本上那三个字，忽然想到一件事。\n\n原主被全网骂的时候，说过最多的话也是“我没有”。没人信。\n\n我把剧本合上，掏出手机，打开备忘录。\n\n写下一行字：沈遥的动机不是自证清白，是让死者的数据开口说话。\n\n第二天，陈导拍沈遥在停尸房解剖尸体的戏。道具组准备了假人模型，内脏是硅胶做的。\n\n我戴上手套，拿起手术刀。\n\n陈导在监视器后面喊：“不用真解剖，你做个样子就行。”\n\n我没停。刀尖划过硅胶胸腔的时候，我开口：“沈遥不会做样子。”\n\n“她每割一刀，都是在跟死者对话。”\n\n“她关心的不是自己会不会坐牢，是这具尸体有没有被误判。”\n\n陈导没喊卡。\n\n监视器后面安静了十几秒。\n\n收工的时候，副导演跑过来递给我一杯咖啡。“陈导让我给你的。”\n\n我接过来，喝了一口。速溶的，三合一。\n\n“陈导还说，”副导演压低声音，“你昨天在备忘录写的那句话，他看到了。”\n\n我愣了一下。\n\n“他说，你眼里有东西。不是演出来的。”\n\n第三天，陈导加了一场戏。沈遥深夜独自在档案室翻卷宗，翻到一份被涂改的尸检记录。没有台词，全靠眼神和手部动作。\n\n我坐在档案架前，一页一页翻。\n\n翻到第七页的时候，手指停住。纸张边缘有一道被撕掉又粘回去的痕迹。\n\n我用指甲沿着胶水印刮了一下。\n\n陈导没喊停。摄影机推近，特写我的手指。\n\n我抬起头，目光落在档案架最顶层那排落灰的文件夹上。\n\n“卡。”\n\n陈导从监视器后面站起来，走到我面前。“你怎么知道那页有撕痕？”\n\n“道具组做旧的时候胶水涂多了，纸张膨胀系数不一样。”\n\n陈导看了我三秒，转头对制片人说：“看见没？这姑娘眼里有故事，不是花瓶。”\n\n制片人点头，在本子上记了什么。\n\n剧组生活规律得像代码。\n\n早上六点出工，晚上八点收工。盒饭两荤一素，我吃了两周，瘦了三斤。\n\n收工后回酒店，洗完澡，打开电脑。\n\n林姐的银行流水我已经爬完了。三百多万，分十七笔，全部转入那家维京群岛空壳公司。\n\n但空壳公司不止收了她的钱。\n\n我顺着那家公司的收款账户往下扒。注册地在海外，实际运营IP在境内。服务器日志里藏着更深的链路。\n\n凌晨一点，我写了个脚本，抓取该公司近一年的所有资金往来。\n\n数据跑完，屏幕上跳出一张关系图。\n\n三个节点：林姐、苏菲、严寒。\n\n三人的资金全部汇入同一家空壳公司，再由公司分散转出到十几个营销号账户。\n\n林姐打款时间，对应原主黑料爆发前三天。\n\n苏菲打款时间，对应她每次发阴阳微博的前一天。\n\n严寒打款时间，贯穿始终。\n\n证据链闭环。\n\n我把关系图截图，连同银行流水、邮件备份、聊天记录，打包成一个加密压缩包。\n\n然后分三份存。\n\n一份拷进离线硬盘，锁进酒店保险柜。\n\n一份上传私有云端，设置二次验证。\n\n一份发给律师，附言：“终局证据，等我指令。”\n\n做完这些，凌晨三点。\n\n我合上电脑，躺在床上。\n\n手机屏幕亮了。林姐发了条微博，配图是一张模糊的聊天记录截图。\n\n“下周，许栀的真面目将全网公开。有些事，不是会写代码就能盖住的。”\n\n评论区水军整齐刷屏：“坐等实锤”“这次看她怎么洗”。\n\n我截了图，存进“终局”文件夹。\n\n没有回复。没有动作。\n\n舆论继续发酵。林姐的爆料预告挂在热搜尾巴上，像一颗定时炸弹。\n\n我不急。她手里的牌，我全知道。\n\n第四周，陈导拍最后一场重头戏。沈遥在法庭上做最终陈述。\n\n剧本只有半页纸，陈导说：“你自己写词。”\n\n我站在法庭布景的证人席上，灯光打过来。\n\n“我解剖过一百三十 “我马上过来。”\n\n私立医院特护病房里，奶奶戴着面罩，呼吸很浅。心电监护仪上的波形又慢又弱，像随时会断的线。\n\n王医生站在床边，翻着最新的检查报告。\n\n“心脏功能只剩下不到百分之十五，肾脏也开始衰竭。”\n\n他合上报告。\n\n“以她的身体条件，已经不能承受任何手术。剩下的时间，按天算。”\n\n我点头。\n\n“还有多久？”\n\n“快的话，一周。慢的话，半个月。”\n\n我拉开椅子坐下，握住奶奶的手。比上次更瘦了，手腕细得能一把攥住。\n\n王医生退出病房，轻轻带上门。\n\n监护仪的滴答声填满整个房间。\n\n我坐在那里，看着奶奶的脸。皱纹很深，颧骨突出，嘴唇没有一点血色。\n\n我忽然想起原主手机里那段语音。\n\n“奶奶，等我红了就接你回家。”\n\n她没等到。\n\n我低头，把脸埋进掌心里。\n\n不知道过了多久，奶奶的手指在我掌心里动了一下。\n\n我抬头。\n\n她睁开了眼睛，浑浊的目光慢慢聚焦在我脸上。\n\n“栀栀……”\n\n“奶奶，我在。”\n\n她看着我，看了很久。\n\n嘴唇动了动，面罩里浮起一层白雾。\n\n“你不是她。”\n\n我僵住了。\n\n奶奶的手指微微用力，攥住我的手。\n\n“但你是好孩子。”\n\n我的喉咙像被什么东西堵住，一个字都说不出来。\n\n“栀栀那孩子……”奶奶喘了口气，“苦了一辈子。”\n\n“你来了以后，她就不苦了。”\n\n我低下头，把额头贴在她手背上。\n\n“奶奶，我确实不是她。”\n\n“我是另一个人，一个死了的码农。不知道怎么就到了这具身体里。”\n\n奶奶没说话。监护仪还在滴答滴答地响。\n\n过了很久，她轻轻拍了拍我的手背。\n\n“我知道。”\n\n“你第一次给我削苹果，皮是断的。栀栀削了二十年苹果，皮从来没断过。”\n\n我愣住。\n\n“但你每天来看我，给我擦手，陪我说话。栀栀忙，没时间。”\n\n她停了一下。\n\n“你比她有心。”\n\n我抬起头，眼眶里有东西在打转。\n\n“奶奶，你不怪我？”\n\n“怪你什么？”\n\n她笑了一下，嘴角扯动得很费力。\n\n“你替她活着，替她洗清了脏水。我谢你还来不及。”\n\n我再也忍不住，眼泪砸在她手背上。\n\n奶奶轻轻摸着我的头发，像摸一个很小的孩子。\n\n“好孩子，别哭。”\n\n“你还有自己的路要走。”\n\n那天晚上，奶奶睡着了。我守在床边，没合眼。\n\n天亮的时候，她醒了一次，精神比昨天好了一些。我喂她喝了两口粥，她又睡过去。\n\n我坐在走廊的长椅上，打开电脑。\n\n从陈雯那里拿到的护工原版录音，我还没仔细处理。文件导出来，波形图在屏幕上铺开。\n\n林姐发给营销号的那段，只有四十七秒。而原版录音有将近四分钟。\n\n我逐帧对比。\n\n原版里，奶奶说的是：“栀栀，你来看我了。栀栀，你瘦了。奶奶心疼。”\n\n营销号发出来的版本，把中间剪掉，前后拼接。第一句的尾音接上最后一句的开头，变成“你不是我的栀栀”。\n\n我又调出林姐发给“圈内老炮”的音频文件元数据。采样率、比特率、编码格式，全部与护工手机录制的原始文件匹配。\n\n但时间轴上，有一段被标记为“剪切”的痕迹。\n\n我把对比图、波形分析、元数据报告整理成一个文档。\n\n然后给律师发了条消息：“录音剪辑证据链完整。加上护工证词，可以推翻所有‘夺舍’指控。”\n\n律师回复很快：“收到。已并入终局证据包。”\n\n我合上电脑，靠在椅背上。\n\n病房门开了，护士探出头。\n\n“许小姐，老太太醒了，说想见你。”\n\n我站起来，快步走进病房。\n\n奶奶靠在枕头上，脸色比昨晚好了一点。她冲我招了招手。\n\n我走过去，坐在床边。\n\n“栀栀，我跟你说个事。”\n\n“奶奶你说。”\n\n她抬起手，指了指床头柜的抽屉。\n\n“里面有个铁盒子，你拿出来。”\n\n我拉开抽屉，取出一个生锈的铁皮盒。打开，里面是一对银镯子，用红布包着。\n\n“这是栀栀她妈留给她的。”\n\n奶奶的声音很轻。\n\n“她妈走的时候，栀栀才三岁。她妈说，等栀栀长大了，把镯子给她，让她别记恨。”\n\n我拿出镯子，内壁上刻着两个小字：平安。\n\n“奶奶，这个你留着。”\n\n“留不住了。”\n\n她摇了摇头，把镯子推到我手边。\n\n“你戴着。就算你不是栀栀，你也替她活了一回。”\n\n我攥着镯子，金属的凉意透过掌心传上来。\n\n“奶奶……”\n\n“好了，不说这些了。”\n\n她闭上眼睛，嘴角带着一点笑意。\n\n“我累了，睡一会儿。”\n\n我替她掖好被角，把镯子戴在手腕上。银圈很细，贴着皮肤，凉凉的。\n\n走出病房，手机在口袋里震了一下。\n\n我掏出来看。\n\n电影方的消息，一行字：\n\n“恭喜，您入围颁奖礼最佳女主角提名。”\n\n## 第19章\n电影定档的消息和入围提名一起砸过来。\n\n手机从早震到晚，微信未读数字跳到了四位数。\n\n营销号连夜剪了预告片，陈导那句“你像换了个人”被截出来当标题，播放量破了千万。\n\n评论区两极分化。\n\n“许栀有演技？别逗了，她之前那些剧我看了三集就弃了。”\n\n“楼上你看了《暗河》预告再说话，法庭那段我起了一身鸡皮疙瘩。”\n\n“说真的，就冲她敢在全网黑的时候直播写代码，我站她。”\n\n“左手疤的事解释了吗？没有就是心虚。”\n\n“林晓那边到底有没有实锤？天天预告，东西呢？”\n\n“等颁奖礼吧，听说林晓要现场放料。”\n\n我刷到这条的时候，正在吃泡面。\n\n筷子停了一下。\n\n颁奖礼。\n\n三天后，城南会展中心，全网直播。\n\n我放下泡面，打开电脑。林姐的微博置顶还是那条预告，评论区已经有人开始不耐烦。\n\n“林晓你倒是放啊，天天嘴炮。”\n\n“前经纪人蹭前艺人热度，吃相难看。”\n\n“所以许栀到底是不是被夺舍了？给个准话。”\n\n舆论在松动。\n\n风向从“许栀一定是妖怪”慢慢转成“林晓拿不出证据就是造谣”。\n\n我关掉微博，切换到监听后台。\n\n林姐的通讯记录里，今天下午有一通电话，打给苏菲。\n\n“颁奖礼的事，我跟主办方打过招呼了。”\n\n林姐的声音压得很低。\n\n“红毯采访区，我给你安排三十秒。你负责把话题往‘夺舍’上引。”\n\n“然后呢？”\n\n“然后陈雯上场。她手里有孤儿院的照片，有奶奶的录音，有许栀不会用电脑的证据。”\n\n“够吗？”\n\n“够了。只要直播镜头对着她，她说什么全网都会信。”\n\n苏菲笑了一声。\n\n“林姐，你手里到底有没有真东西？”\n\n“你管它真不真。只要颁奖礼上炸了，许栀就算拿影后，也会被钉死在‘非人类’的标签上。”\n\n“行。”\n\n电话挂断。\n\n我导出录音，存进“终局”文件夹。\n\n三分钟后，另一条监听记录弹出来。\n\n林姐拨了陈雯的号码。\n\n“陈雯，颁奖礼那天，你上台。”\n\n“我……我说什么？”\n\n“就说许栀左手上的疤没了，就说奶奶亲口说‘你不是我的栀栀’。其他的我来安排。”\n\n电话里沉默了很久。\n\n“林姐，我上次已经——”\n\n“你上次拿了定金，事没办完。这次办完，尾款翻倍。你要是不办，我就把你当年发定位的事捅出去。”\n\n“你——”\n\n“你自己选。”\n\n“……好。我去。”\n\n我关掉监听后台，拿起手机。\n\n一条新短信，来自陌生号码。\n\n“许栀，退出颁奖礼。否则身败名裂。”\n\n我截了图。\n\n然后打开加密文件夹，把证据包重新整理了一遍。林姐的银行流水、空壳公司关系图、护工原版录音、陈雯的定位记录、苏菲的买水军转账。\n\n三百七十四页，压缩成三个加密包。\n\n第一份，颁奖礼红毯开始前两小时，自动投递给三家媒体。\n\n第二份，最佳女主角揭晓瞬间，自动上传网信办举报平台。\n\n第三份，四十八小时后，全网群发。\n\n我打开直播平台后台，把投屏权限授权给律师的账号。\n\n然后给律师发了条消息：“颁奖礼当天，你盯直播。我一旦在台上发出信号，你立刻把证据包推流。”\n\n回复秒到：“收到。信号是什么？”\n\n我想了想，敲下两个字：“镯子。”\n\n手腕上那对银镯子，奶奶给的。\n\n我摸了摸镯子，站起身。\n\n出门前，手机又响了。王医生。\n\n“许小姐，老太太今天清醒了两个小时。”\n\n他顿了一下。\n\n“她让我录了一段视频，说等你来了给你看。”\n\n“我马上到。”\n\n私立医院特护病房里，奶奶靠在枕头上，脸色比前几天好了一些。回光返照，我心里清楚。\n\n她看见我进来，笑了一下。\n\n“栀栀，你来。”\n\n我坐到床边。\n\n她拉着我的手，目光落在我手腕的银镯上。\n\n“镯子戴着呢？”\n\n“戴着。”\n\n“好。”\n\n她从枕头底下摸出一部旧手机，递给王医生。\n\n王医生点开一段视频，屏幕转向我。\n\n是奶奶自己录的。镜头有点晃，她对着手机，说话很慢。\n\n“栀栀，奶奶知道你忙。奶奶不怪你。”\n\n“你替那个孩子做了这么多事，奶奶谢谢你。”\n\n“不管你是谁，你都是我的好孙女。”\n\n“奶奶走了以后，你要好好吃饭，好好睡觉。别老熬夜。”\n\n“镯子戴着，保平安。”\n\n视频结束。\n\n我攥着手机，喉咙里堵得说不出话。\n\n奶奶拍了拍我的手背。\n\n“好了，别哭。去忙你的。”\n\n“颁奖礼，穿漂亮点。”\n\n我点头，站起来，低头在她额头上贴了一下。\n\n“奶奶，等我回来。”\n\n“去吧。”\n\n走出病房，王医生追出来。\n\n“许小姐，老太太的情况……可能就这几天了。”\n\n“我知道。”\n\n“视频我发你手机上了。”\n\n“谢谢王医生。”\n\n我走进电梯，手机震了一下。\n\n视频文件已接收。\n\n我点开保存，然后打开加密文件夹，把视频加进“终局”证据包。\n\n回到公寓，我站在穿衣镜前。\n\n镜子里的人，瘦了，颧骨比刚穿越时明显，眼睛比原主亮。\n\n我把银镯子转到手腕正面。\n\n然后对着镜子，练习颁奖礼的获奖感言。\n\n“谢谢陈导，谢谢剧组。”\n\n停顿。\n\n“也谢谢那些想毁掉我的人。”\n\n停顿。\n\n“你们让我知道，活着，就得赢。”\n\n镜子里的人，眼神很稳。\n\n我拿起手机，翻到那条匿名警告短信。\n\n号码归属地查不到，虚拟号段。\n\n我写了个脚本，追踪短信的发送基站。\n\n数据跑出来的瞬间，屏幕上跳出一行结果。\n\n号码注册人：林晓。\n\n小号。\n\n我关掉脚本，把手机扔到沙发上。\n\n窗外，城市的灯火亮起来。\n\n颁奖礼，还有三天。\n\n人物卡：\n[\n {\n  \"name\": \"许栀（穿越者）\",\n  \"role\": \"主角\",\n  \"traits\": [\n   {\n    \"trait\": \"技术流，用代码排查图片造假\",\n    \"evidence_chapter\": 1\n   },\n   {\n    \"trait\": \"冷静果断，会所录音取证\",\n    \"evidence_chapter\": 4\n   },\n   {\n    \"trait\": \"护短，拼命守护奶奶\",\n    \"evidence_chapter\": 3\n   }\n  ],\n  \"fate\": \"替原主复仇成功，解约，事业翻身，奶奶去世，决心好好活。\"\n },\n {\n  \"name\": \"严寒\",\n  \"role\": \"反派，资本大佬\",\n  \"traits\": [\n   {\n    \"trait\": \"傲慢控制欲，威胁潜规则\",\n    \"evidence_chapter\": 4\n   },\n   {\n    \"trait\": \"阴狠，用奶奶威胁\",\n    \"evidence_chapter\": 2\n   },\n   {\n    \"trait\": \"资本操控舆论\",\n    \"evidence_chapter\": 1\n   }\n  ],\n  \"fate\": \"录音曝光，股价跌停，合作解约，警方介入，身败名裂。\"\n },\n {\n  \"name\": \"奶奶\",\n  \"role\": \"原主唯一亲人，主角守护对象\",\n  \"traits\": [\n   {\n    \"trait\": \"善良坚韧，为孙女倾尽所有\",\n    \"evidence_chapter\": 2\n   },\n   {\n    \"trait\": \"临终清明，识破穿越者\",\n    \"evidence_chapter\": 10\n   }\n  ],\n  \"fate\": \"去世。\"\n },\n {\n  \"name\": \"林姐\",\n  \"role\": \"执行经纪，帮凶\",\n  \"traits\": [\n   {\n    \"trait\": \"势利威胁\",\n    \"evidence_chapter\": 1\n   },\n   {\n    \"trait\": \"见风使舵\",\n    \"evidence_chapter\": 7\n   }\n  ],\n  \"fate\": \"被公司推责，未明确下场。\"\n },\n {\n  \"name\": \"苏菲\",\n  \"role\": \"对家小花，帮凶\",\n  \"traits\": [\n   {\n    \"trait\": \"阴阳怪气，买水军\",\n    \"evidence_chapter\": 2\n   }\n  ],\n  \"fate\": \"代言解约，角色换人。\"\n },\n {\n  \"name\": \"王医生\",\n  \"role\": \"中心医院医生，帮助者\",\n  \"traits\": [\n   {\n    \"trait\": \"负责关心\",\n    \"evidence_chapter\": 2\n   }\n  ],\n  \"fate\": \"继续在医院工作。\"\n },\n {\n  \"name\": \"原主许栀\",\n  \"role\" 字，原主残留的情绪涌上心头，眼眶泛起一阵酸涩。\n我深吸一口气，回复道：\n“谢谢王医生。”\n我转身拉开抽屉，翻出了一只带锁的铁盒。\n用螺丝刀暴力撬开，里面是一本日记和一堆医院的催缴单。\n一页页翻看，原主短暂而痛苦的一生在我面前展开：\n她是个孤儿，奶奶是她在这世上唯一的亲人。\n为了支付奶奶高昂的靶向药费用，她才咬牙签了公司进娱乐圈。\n她拼命接戏，连轴转跑通告，\n却不想，被资本大佬严寒盯上了。\n严寒看中了她的清纯，提出包养。\n原主严词拒绝，换来的却是被恶意造谣。\n这个傻姑娘扛下了所有的脏水，直到心理防线崩溃。\n我合上日记本，目光落在电脑屏幕上严寒的名字上。\n桌上的手机亮起，一条没有署名的短信跳入眼帘：\n“许栀，你的时间不多了。”\n“如果你还继续头铁……”\n“明天医院里的老太太，可能会不小心刷到一些很有意思的新闻。”\n\n## 第3章\n我在论坛接了两个高薪加急的代码修补单。\n拿到虚拟币酬金后，我迅速变现，\n连同原主卡里剩余的积蓄，全部打入了医院的对公账户。\n这笔钱，足够一次性预付奶奶未来三十年的VIP医疗费用。\n我拿出手机开启直播。\n镜头亮起，凭借全网黑的热度，几万吃瓜网友涌入直播间。\n“大家好，我是许栀。”\n“关于网上的无端造谣，我现在要放出第一批澄清证据……”\n我把整理好的图片造假鉴定报告举到镜头前。\n屏幕画面突然卡顿，紧接着直接黑屏。\n系统弹窗跳了出来：\n【您的账号已被异地强制登录。】\n经纪公司的动作太快了。\n不出五分钟，微博上被水军刷起新一轮的热搜词条：\n许栀开播作秀\n许栀被封禁后垂死挣扎演烂戏。\n桌上的备用手机狂震起来。\n“许小姐，你快来医院！”\n“刚才不知道怎么混进来了几个极端黑粉，跑到病房门口拉横幅大骂！”\n“老太太心脏本就不好，受了刺激，已经送进急救室抢救了！”\n王医生的声音透着焦急。\n我心脏骤缩，抓起大衣疯了一样冲出家门。\n冲出公寓楼的大门，黑压压的狗仔和代拍便涌了上来。\n代拍为了博眼球，竟然把镜头压低，恶劣地往我胸前的隐私部位怼。\n“许栀！网上说你被金主抛弃了，是真的吗？”\n“你毁容的照片是不是真的？回应一下！”\n“滚！”\n我眼神一厉，拍掉面前的单反，拉开车门直奔医院。\n急救室门外的每一分每一秒都像是在被凌迟。\n直到四个小时后，抢救室的红灯熄灭。，\n奶奶挺了过来。\n我虚脱地滑坐在长椅上。\n确认奶奶被安全转移到重症监护室后，我拖着沉重的步伐离开医院。\n迈出医疗大楼的旋转门时，几声快门声从花坛后传来。\n等我回到公寓，网上掀起了更加狂暴的风浪。\n热搜榜首赫然挂着：\n许栀现身医院，疑似刚做完修复手术\n配图正是我脸色苍白走出医疗大楼的抓拍。\n断章取义，指鹿为马。\n进入客厅，执行经纪林姐正坐在我的沙发上。\n林姐踩着高跟鞋走过来，夺过我的手机拔出电话卡，\n当着我的面，将其折成两半扔进垃圾桶。\n“许栀，公司已经把你所有社交账号退登并修改了密码。”\n“这期间，你休想再上网发一个字。”\n林姐冷笑一声，\n“严总耐心有限。”\n“今晚八点，夜色顶层包厢，这是你最后的机会。”\n“如果今晚你还不识抬举，明天会发生什么，我们也不知道。”\n林姐摔门离开，房间恢复死寂。\n我打开电脑，连上WiFi，微信跳出一条严寒发来的语音：\n“许栀，挣扎好玩吗？今晚打扮得漂亮点。”\n我敲下一行字点击发送：\n“好，今晚见。”\n我起身走到梳妆台前，拿起原主的水钻胸针。\n我用刀片撬开后盖，将一枚指甲盖大小的微型芯片嵌入其中。\n这是我亲自编写的加密录音程序。\n只要开启，音频会实时加密并同步上传至我的私有云端。\n\n我将胸针别在黑色风衣的暗褶处，开车去了夜色。\n\n## 第4章\n夜色会所顶层，安保森严。\n刚出电梯，两个穿黑西装的保镖就拦住了我。\n“许小姐，规矩您懂。”\n“手机交出来，例行搜身。”\n我把手机扔进托盘，张开双臂。\n女保镖上上下下摸索了一遍，随即放行。\n推开包厢门，刺鼻的雪茄味扑面而来。\n严寒坐在真皮沙发里，手里晃着半杯威士忌。\n“终于学乖了？”\n他拍了拍身边的空位，\n“坐过来。”\n我没动，站在离他三步远的地方：\n“网上的那些黑料，你到底要怎样才肯撤掉？”\n严寒冷笑一声：\n“许栀，别装傻。”\n“那几张图，还有你靠奶奶卖惨的通稿，全是我让人放出去的。”\n“只要我一句话，水军立刻停手，你奶奶也能在医院睡个安稳觉。”\n“所以，这一切都是你逼我就范的手段？”\n我暗中调整站姿，确保胸针的麦克风孔正对他。\n“不然呢？”\n他站起身，步步逼近，\n“在这个圈子里，没有我的点头，你寸步难行。”\n“陪我，是你唯一的出路。”\n“只要你乖乖听话，昨天的黑热搜，明天就能变成洗白通稿。”\n他走到我面前，伸手摸向我的脸。\n我侧身抄起桌上的冰水，假装手滑泼在了他的高定西裤上。\n“严总，抱歉。”\n我后退两步，迅速拉开安全距离，\n“这件事太突然了，我需要一晚上的时间考虑。”\n严寒脸色铁青，眼中戾气翻涌。\n但他似乎很享受这种猫捉老鼠的掌控感，拿过纸巾擦了擦手。\n“行，我给你一晚上。”\n“明天早上，我要听到你的回复。”\n“否则，你知道我的手段。”\n回到公寓，我反锁房门，打开电脑。\n切入私有云端，刚才那段长达十五分钟的对话音频已经躺在加密区。\n我敲击键盘输入密钥，将乱码解码为清晰的音频文件。\n接着，我翻出原主之前备份的早期威胁短信截图。\n我明白，利用主流网站揭露这些行不通，\n那我只好采取些非常手段。\n为了避开经纪公司的网络监控，我从口袋里摸出一张电话卡。\n这是今天去医院时，我趁乱从奶奶的旧手机里拔出来的。\n插卡，联网。\n我切入暗网，购买了三个境外的僵尸网络节点作跳板，\n将音频和短信截图，连同图片造假鉴定报告进行多重加密打包。\n一份通过内网通道直达网信办举报中心；\n一份发给早已拟定好合同的顶尖维权律师；\n最后一份，我写了一个延时触发的脚本，\n匿名投递给国内三家以绝不妥协著称的媒体主编邮箱。\n做完这一切，天已经亮了。\n早上八点，严寒的微信准时发了过来：\n“考虑得怎么样了？”\n我果断地回复，\n“我考虑过了，我不同意。”\n“别敬酒不吃吃罚酒，得罪我，我保证让你在这个圈子里混不下去！”\n我冷笑一声，\n一边切屏给律师发送行动的指令，一边在对话框里敲下回复：\n“你还是准备好，担心担心你自己吧。”\n\n## 第5章\n“砰！”\n我公寓的防盗门传来一声巨响。\n紧接着，是严寒打来的视频通话。\n我按下接听，画面里，严寒身后的背景赫然是医院重症住院部的走廊！\n“许栀，你敢跟我耍花招？找死！”\n他将镜头对准前方几个黑衣壮汉\n与此同时，我公寓的防盗门锁报废，防盗门倒塌掀起一阵尘土。\n三个提着钢管的壮汉盯着我，步步逼近。\n手机屏幕里，严寒叫嚣的声音震得我耳膜生疼：\n“我让你装！我现在就拔了这老东西的管子！”\n我倚靠在椅背上，嘴角勾起嘲讽：\n“你拔啊。”\n视频中，黑衣人掀开病床上的被子。\n空的。\n严寒震惊地盯着屏幕里的空床。\n“人呢？！”\n“严总，你真以为我会放心把奶奶留在普通重症区？”\n我语气没有一丝起伏，\n“昨晚从会所出来，我就联系了私立医院。”\n“现在我奶奶躺在安保级别最高的特护病房。”\n“别说你的打手，连一只苍蝇都飞不进去。”\n“你想打扰她？下辈子吧。”\n“臭婊子，你敢耍我！”\n严寒在视频那头气急败坏。\n我挂断视频，按下桌上的遥控器，天花板四个角落的摄像头同时亮起红灯。\n“这是我的私人云端实时同步录像。”\n“另外，十分钟前我已经报了警。”\n我晃了晃手机，窗外刚好传来由远及近的警笛声，\n“要试试这钢管砸下来，你们能判几年吗？”\n三人脸色一变，对视一眼，骂骂咧咧地夺门而逃。\n危机解除。\n我跨过一地狼藉，重新坐回电脑前，拨通了律师的电话。\n等待接通时，我瞥见原主日记本摊在桌角，一页被撕掉，夹着张旧照片，背面写着“陈雯，等我红了就去找你”。\n“动手吧。”\n五分钟后，一份盖着公章的律师函发送到了经纪公司高层的邮箱里。\n除了解约声明，里面还附带了一份“大礼包”：\n林姐知情，且纵容协助严寒潜规则旗下艺人的聊天记录和邮件往来。\n另一边，严寒察觉到了部分证据已经开始外泄。\n我的网络监测探针显示，各大平台的敏感词库正在被更新。\n严寒急眼了。\n雷霆大怒之下，他开始疯狂砸钱，动用庞大的公关力量全网删帖。\n热搜榜上，关于他公司的词条迅速被撤下，\n吃瓜群众发出的质疑贴不到一分钟就被删，\n大批高级水军下场，强行把水搅浑。\n叮的一声，严寒的短信发了过来：\n“只要钱到位，互联网就不会有你的记忆！”\n“你奶奶躲得过初一躲不过十五，走着瞧！”\n看着这句狠话，我只觉得可笑。\n我已经切断了他打探病房信息的渠道。\n他现在的威胁，不过是落空后的无能狂怒。\n电脑屏幕右下角，一个红色的倒计时窗口正在安静地跳动。\n“3、2、1……”\n进度条拉满，定时投递脚本触发成功。\n三封加密邮件，滑入了三家深度调查媒体主编的收件箱。\n\n## 第6章\n这三家媒体以不畏强权、死磕真相在业内著称。\n严寒的资本手腕能买通营销号，却买不动这些真正的新闻人。\n两小时后，早上八点整，早高峰通勤的节点。\n原本被严寒水军搅得乌烟瘴气的社交平台，撕开了一道口子。\n没有预热，没有娱乐圈惯用的八卦噱头，\n三家深度调查媒体全网同步推送了一篇万字长文。\n标题字字见血：\n《赛博猎巫的背后：资本胁迫、技术造假与一场完美的网络谋杀》。\n文章开篇，甩出了我那份长达三十页的图像技术鉴定报告。\n作为资深码农，我给出的证据链是降维打击级别的。\n报告里放大了所谓“医美现场图”的所有噪点，详细展示了ELA热力图，\n甚至直接提取了图片底层的EXIF数据，\n将拼接合成的操作痕迹、修改时间和部分硬件特征，展示得清清楚楚。\n这篇报道像一枚深水炸弹，引爆了整个网络。\n“卧槽！作为一个十年后期修图师的我头皮发麻。”\n“这报告太硬了，这根本不是什么吃瓜，这是高技术犯罪啊！”\n“看懂了，图片是P的，就医记录是假的，连所谓的知情人士是虚拟账号。”\n“我去，我们全被当枪使了！”\n“细思极恐……如果许栀拿不出这份报告，她现在是不是已经被逼上绝路了？”\n风向变了。\n原本满屏的荡妇羞辱和谩骂，转变成了对资本只手遮天的恐惧与愤怒。\n这不再是一桩茶余饭后的戏子黑料，\n而是被严肃定性为一桩涉及资本胁迫的网络暴力案件。\n那些原本跟着带节奏的大V们悄悄删除微博，理智的路人成批觉醒。\n严寒慌了。\n后台监测仪上，我看到大量异常流量正在冲击这三家媒体的服务器。\n严寒的水军涌入评论区，试图用以往那种胡搅蛮缠的方式把水再次搅浑。\n他甚至动用了最高级别的公关预案，试图花重金强行撤掉热搜词条。\n但这次，他踢到了铁板。\n这三家硬核媒体背后，是坚不可摧的公信力和新闻底线。\n严寒的团队绝望地发现，他们的资本权限在这里根本不管用。\n不仅文章删不掉，反而因为短时间内触发了平台的异常压制机制，\n被系统判定为重大社会事件，强推上了各大首页的置顶位，全网飘红。\n真相如同决堤的洪水，势不可挡。\n我坐在电脑前，看着数据监控面板。\n代表“许栀澄清”、“资本网暴”的词条指数正在呈指数级狂飙，\n而严寒关联实业公司的网络风评和股市预期，则断崖式暴跌。\n局势逆转，一切都在计算之中。\n我正准备关掉网页，去医院看望奶奶，\n医院护工来电，说奶奶昏迷中喃喃“栀栀左手有疤”。我低头看自己光滑的左手，只当是老人胡话。\n电脑屏幕右下角的监控雷达突然发出一声尖锐的红色警报。\n一条全新的词条，突破了媒体的封锁，空降热搜榜第一。\n词条后面，跟着一个刺眼的的深红色“爆”字。\n许栀主动投怀送抱，会所监控流出\n我盯着这条热搜，眼睛微微眯起。\n\n## 第7章\n鼠标点开那个刺目的“爆”字。\n屏幕上弹出一段三十秒的无声监控视频。\n画面正是我昨晚走进那家私人会所包厢的场景。\n因为角度刁钻，视频里的我看起来像是顺从地交出手机，\n任由保镖搜身后走进了光线昏暗的包厢。\n视频末尾还被恶意剪辑了一段我靠近严寒倒水的画面，\n没有声音，加上模糊处理的滤镜，看起来就像是我在主动投怀送抱。\n营销号的配文更是恶毒：\n“所谓的技术流澄清不过是洗白手段。”\n“事实是许栀早已向资本低头，深夜主动赴约，企图用身体平息风波。”\n严寒这手脏牌打得真是时候。\n他想利用大众对娱乐圈潜规则的固有偏见，\n将我钉死在“当了婊子还立牌坊”的耻辱柱上。\n我没慌，反而笑了。\n等的就是他这步棋。\n现在全网都在盯着我，流量达到了巅峰。\n我打开手机，登上了公司归还的账号，点击开启直播。\n没有预热，开播瞬间直播间涌入了十万人。\n弹幕狂刷，夹杂着不堪入目的词汇。\n我没理会这些，把昨晚那枚胸针摘下来，摆在镜头前。\n“大家都在看严总放出的无声电影。”\n“既然剧情这么精彩，不配点原声怎么行？”\n我将胸针连接电脑，手指敲击回车键。\n我编写的加密程序，绕过防火墙，解压提取音频。\n一段清晰无比的对话，传遍了整个网络。\n“许栀，你是个聪明人。”\n“只要你今晚留下，所有的黑料我十分钟内就能让它们消失。”\n这是严寒的声音，带着不加掩饰的傲慢。\n紧接着，是我冷静的质问：\n“所以，那些医美假照还有买通营销号的造谣，全是你干的？”\n“是我又怎么样？”\n“在这个圈子里，资本就是规矩。\n“不顺从我，你连翻身的机会都没有！”\n“不仅是你，那个躺在医院里的老太婆也别想安生……”\n音频扒下了严寒衣冠楚楚的伪装，露出了他威逼利诱冷血嘴脸。\n弹幕在那一刻，出现了诡异的停顿。\n紧接着，整个直播间炸锅了。\n“草！这男的太恶心了！”\n“这哪里是潜规则，这是黑社会性质的敲诈勒索吧？！”\n“反转了！许栀是去录音取证的！她根本没妥协，她太刚了！”\n我看着飙升的热度，对着镜头开口：\n“严寒，你以为交出手机，搜了身，我就没办法了吗？”\n“这段录音，我已经同步发给了警方。”\n另一边，经纪公司的高层会议室里早已乱作一团。\n林姐和公司高管们看着直播间里引爆的舆论，冷汗直流。\n他们原本还想把原主当成礼物送给严寒，\n但现在事情的性质已经从娱乐八卦升级成了违法犯罪。\n严寒如今玩脱了。\n稍有不慎，公司都会作为拉皮条的从犯被牵连进去。\n“快！把之前所有的通稿全撤了！”\n公司高层在会议室里咆哮，\n“马上发声明，把公司和严寒的关系摘干净！快啊！”\n我的手机屏幕亮了，一条来自林姐的信息弹了出来：\n“小栀，公司决定挺你，严寒的事我们全不知情。”\n“你先下播，我们好好谈谈后续的公关。”\n我对着直播间的镜头，将手机屏幕怼到了镜头前。\n“看，原来落井下石的人，翻脸也可以这么快。”\n众人还在震惊于经纪公司的无耻时，直播间的连麦申请响了起来。\n来电显示，居然是严寒本人。\n\n需要带过来的事实 carried_facts：\n[\n {\n  \"fact\": \"严寒录音曝光后，主角拒绝连麦，宣布证据已发警方，严寒实业股价跌停、合作方解约，警方立案调查。\",\n  \"source_chapter\": 8,\n  \"replant\": \"续写第1章通过主角切断直播后的手机新闻推送和内心独白快速交代。\"\n },\n {\n  \"fact\": \"苏菲代言解约，S级剧换人，水军头子被立案调查。\",\n  \"source_chapter\": 8,\n  \"replant\": \"续写前段通过娱乐新闻或苏菲求饶电话交代。\"\n },\n {\n  \"fact\": \"经纪公司发布致歉信，推责林姐，附无条件解约协议书，主角签字发送。\",\n  \"source_chapter\": 8,\n  \"replant\": \"续写第2章主角收到解约协议邮件，签字后长舒一口气。\"\n },\n {\n  \"fact\": \"奶奶在主角拍完电影后回光返照，识破主角不是原主，感谢她后安详离世。\",\n  \"source_chapter\": 9,\n  \"replant\": \"续写第9-10章重新演绎奶奶临终场景，保留识破身份和感谢的核心情感。\"\n },\n {\n  \"fact\": \"主角扎进剧组大半年，电影公映后获全网好评，撕掉废柴花瓶标签。\",\n  \"source_chapter\": 9,\n  \"replant\": \"续写中段用剧组蒙太奇和影评片段交代。\"\n }\n]\n\n已写的续写章节：\n## 第8章\n直播间里，连麦申请的铃声像催命符一样响个不停。\n\n屏幕上，严寒的头像疯狂闪烁。\n\n弹幕已经刷疯了：\n\n“接啊！看他还有什么话说！”\n\n“严总这是要当众道歉吗？”\n\n“许栀别怂！”\n\n我对着镜头，嘴角扯出一个弧度，鼠标移向那个闪烁的红色按钮。\n\n按了下去。\n\n连麦界面瞬间黑屏，只剩下弹幕区满屏的问号。\n\n“严寒，你以为我会给你一个当众表演的机会？”\n\n我把键盘拉到面前，手指飞快地敲下一行字，同步到直播间公告栏。\n\n“互联网不是法外之地，严总，留着你的话去跟警察解释吧。”\n\n发送。\n\n然后，我点击了关闭直播。\n\n屏幕暗下去的前一秒，弹幕定格在刷屏的问号上。\n\n手机开始疯狂震动，各种推送像洪水一样涌进来。\n\n第一条，来自财经快讯：\n\n【严寒实业股价断崖式跌停，市值蒸发超三十亿。】\n\n第二条，来自娱乐前线：\n\n【严寒名下多家公司遭合作方紧急切割，已有三个品牌方宣布终止合作。】\n\n第三条，来自社会新闻：\n\n【警方已就“网络造谣及资本胁迫案”正式立案，严寒被限制出境。】\n\n我把手机屏幕转向电脑摄像头，录了一小段视频，发到个人主页。\n\n配文只有一行字：\n\n“完整录音与数据证据链，已提交警方。后续进展，依法公开。”\n\n做完这些，我靠在椅背上，长出一口气。\n\n邮箱弹出一封新邮件，是经纪公司法务部发来的。\n\n我点开。\n\n一封致歉信，用词恳切，把所有责任推给了林姐，说她是“个人行为，公司事先并不知情”。\n\n附件里，是一份无条件解约协议书。\n\n我快速扫了一遍条款，确认没有陷阱，签上“许栀”两个字，点击发送。\n\n屏幕弹出“发送成功”的提示时，我盯着那两个字看了很久。\n\n第一次觉得，这个名字，这具身体，真正属于我了。\n\n手机响了，来电显示：苏菲。\n\n我按下接听，没说话。\n\n“许栀……栀姐，之前的事是我不对，我一时糊涂，你大人不记小人过……”\n\n苏菲的声音在发抖，背景里隐约有人在催她，“菲姐，品牌方那边催着要解约函……”\n\n“你代言掉光了，戏也换人了，才想起给我打电话？”\n\n我语气很平。\n\n“不是，你听我说，那些水军都是严寒让我买的，我也是被逼的……”\n\n“你被逼的？”\n\n我笑了一声，\n\n“苏菲，你发给我的私信，我可都存着呢。”\n\n“你……你想怎么样？”\n\n“不想怎么样。”\n\n我挂了电话，顺手把她的号码拖进黑名单。\n\n娱乐新闻的推送紧接着弹出来：\n 么威胁她，她拒绝之后发生了什么。\n\n我退回去，把视频备份了三份。一份存本地加密盘，一份上传私有云端，一份拷进U盘。\n\n做完这些，我点开文件夹里最后一个文件。\n\n是一张聊天截图，时间戳是原主去世前一周。\n\n发信人头像是一片空白，ID是一串乱码。\n\n内容只有一句话：“许栀的行踪我已经发你了，剩下的你自己看着办。”\n\n截图的底部，原主用红笔圈出了发信人的IP地址。\n\n我放大图片，把那串IP抄下来。\n\n然后打开电脑，反查归属地。\n\n城南，一家网吧的公共网络。\n\n网吧监控一般只保留三十天。但原主去世到现在，刚好二十八天。\n\n我深吸一口气，把IP地址和网吧名称记下来。\n\n手机屏幕又闪了一下。\n\n一条新短信，来自林姐。\n\n“许栀，明天上午十点，公司会议室。法务部要你当面解释左手疤痕的事。”\n\n“不来，就默认你放弃所有申辩权利。”\n\n我盯着这条短信，没有回复。\n\n退出短信界面，手机桌面还亮着。\n\n屏保上，原主蹲在奶奶轮椅旁，笑得灿烂。\n\n我把旧手机放进抽屉，锁好。\n\n然后打开电脑，继续追踪那个IP。\n\n网吧的登记系统有漏洞。\n\n我花了二十分钟拿到后台权限，调出二十八天前的上机记录。\n\n那个时间段，只有一个人用了那台机器。\n\n登记的名字是——\n\n陈雯。\n\n## 第13章\n直播开始的时候，我正在煮咖啡。\n\n手机架在料理台上，屏幕里林姐坐在访谈室的沙发上，妆容精致，语气沉痛。\n\n“作为许栀的前经纪人，我本来不想说这些。”\n\n她低头擦了擦眼角。\n\n“但我实在看不下去了。”\n\n陈雯坐在她旁边，低着头，手里攥着一张照片。\n\n主持人把话筒递过去。\n\n“陈女士，您和许栀是孤儿院时期的好友，您能确认什么？”\n\n陈雯抬起头，声音很轻。\n\n“她左手腕上有一道疤，五岁时摔在铁栅栏上缝了七针。”\n\n她举起那张旧照片，镜头推近，疤痕清清楚楚。\n\n“可现在的许栀，左手什么都没有。”\n\n主持人追问：“您是说，现在的许栀不是本人？”\n\n陈雯没回答，只是把手机连上了演播室音响。\n\n奶奶的声音传出来，虚弱，断续。\n\n“你不是我的栀栀……”\n\n“栀栀左手有疤……我记得的……”\n\n演播室安静了两秒。\n\n苏菲适时接话，语气关切：“我们都很担心栀栀的精神状态，如果她真的遇到了什么……”\n\n她顿了顿。\n\n“或者，被什么东西占据了身体，我们希望她能早点回来。”\n\n弹幕疯了。\n\n我关掉直播，咖啡已经凉了。\n\n打开微博，词条挂在热搜第一。\n\n#许栀被夺舍# 后面跟着深红色的“爆”。\n\n评论区置顶是营销号发起的投票：“你相信许栀被夺舍了吗？”\n\n七万人参与，六万三千票投了“相信”。\n\n“让她验疤！验不了就是心虚！”\n\n“这已经不是娱乐圈的事了，这是灵异事件！”\n\n“@网信办 @公安部 建议介入调查。”\n\n手机开始响。\n\n第一个电话是代言品牌方，对方语气为难：“许栀女士，我们总部那边压力很大，合同暂时中止，后续再联系。”\n\n第二个是剧组制片人：“定妆照先不拍了，投资方说要重新评估风险。”\n\n第三个、第四个、第五个。\n\n我把手机调成静音，来电记录截屏存档。\n\n门铃响了。\n\n从猫眼看出去，楼道里挤满了人。长焦镜头、摄像机、举着手机直播的博主。\n\n“许栀！出来说两句！”\n\n“你左手敢不敢伸出来给大家看看！”\n\n“你是不是已经死了？现在是谁在操控你的身体？”\n\n我拉上窗帘，坐回电脑前。\n\n邮箱里躺着一封新邮件，发件人是经纪公司法务部。\n\n“许栀女士，鉴于目前舆论涉及重大公共关切，公司要求您于今日下午三时前提交三甲医院出具的身体检查报告，包括但不限于指纹、疤痕、DNA比对。”\n\n“如拒绝配合，公司将视为您单方面放弃所有申辩权利。”\n\n我敲下回复：“拒绝。”\n\n发送。\n\n王医生的电话打进来，我接了。\n\n“许小姐，老太太今天下午突然心律不齐，刚抢救过来。”\n\n他压低声音。\n\n“她一直在喊你的名字，你方便过来一趟吗？”\n\n“我马上到。”\n\n我抓起大衣和车钥匙，走到门口。\n\n猫眼里，狗仔还堵在楼道。\n\n我拉开门的瞬间，闪光灯像暴雨一样砸过来。\n\n“许栀！说两句吧！”\n\n“你到底是人还是鬼！”\n\n有人把镜头怼到我脸上，有人伸手拽我的包带。\n\n我冷着脸，一个字没说，挤开人群往电梯走。\n\n一个代拍追上来，镜头几乎戳到我鼻尖：“你左手敢伸出来吗？就一下！”\n\n我停下脚步，转头看他。\n\n“让开。”\n\n声音不大，但那人愣了一下，后退半步。\n\n我进了电梯，按下关门键。\n\n医院走廊
