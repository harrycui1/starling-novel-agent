n配图正是我脸色苍白走出医疗大楼的抓拍。\n断章取义，指鹿为马。\n进入客厅，执行经纪林姐正坐在我的沙发上。\n林姐踩着高跟鞋走过来，夺过我的手机拔出电话卡，\n当着我的面，将其折成两半扔进垃圾桶。\n“许栀，公司已经把你所有社交账号退登并修改了密码。”\n“这期间，你休想再上网发一个字。”\n林姐冷笑一声，\n“严总耐心有限。”\n“今晚八点，夜色顶层包厢，这是你最后的机会。”\n“如果今晚你还不识抬举，明天会发生什么，我们也不知道。”\n林姐摔门离开，房间恢复死寂。\n我打开电脑，连上WiFi，微信跳出一条严寒发来的语音：\n“许栀，挣扎好玩吗？今晚打扮得漂亮点。”\n我敲下一行字点击发送：\n“好，今晚见。”\n我起身走到梳妆台前，拿起原主的水钻胸针。\n我用刀片撬开后盖，将一枚指甲盖大小的微型芯片嵌入其中。\n这是我亲自编写的加密录音程序。\n只要开启，音频会实时加密并同步上传至我的私有云端。\n\n我将胸针别在黑色风衣的暗褶处，开车去了夜色。\n\n## 第4章\n夜色会所顶层，安保森严。\n刚出电梯，两个穿黑西装的保镖就拦住了我。\n“许小姐，规矩您懂。”\n“手机交出来，例行搜身。”\n我把手机扔进托盘，张开双臂。\n女保镖上上下下摸索了一遍，随即放行。\n推开包厢门，刺鼻的雪茄味扑面而来。\n严寒坐在真皮沙发里，手里晃着半杯威士忌。\n“终于学乖了？”\n他拍了拍身边的空位，\n“坐过来。”\n我没动，站在离他三步远的地方：\n“网上的那些黑料，你到底要怎样才肯撤掉？”\n严寒冷笑一声：\n“许栀，别装傻。”\n“那几张图，还有你靠奶奶卖惨的通稿，全是我让人放出去的。”\n“只要我一句话，水军立刻停手，你奶奶也能在医院睡个安稳觉。”\n“所以，这一切都是你逼我就范的手段？”\n我暗中调整站姿，确保胸针的麦克风孔正对他。\n“不然呢？”\n他站起身，步步逼近，\n“在这个圈子里，没有我的点头，你寸步难行。”\n“陪我，是你唯一的出路。”\n“只要你乖乖听话，昨天的黑热搜，明天就能变成洗白通稿。”\n他走到我面前，伸手摸向我的脸。\n我侧身抄起桌上的冰水，假装手滑泼在了他的高定西裤上。\n“严总，抱歉。”\n我后退两步，迅速拉开安全距离，\n“这件事太突然了，我需要一晚上的时间考虑。”\n严寒脸色铁青，眼中戾气翻涌。\n但他似乎很享受这种猫捉老鼠的掌控感，拿过纸巾擦了擦手。\n“行，我给你一晚上。”\n“明天早上，我要听到你的回复。”\n“否则，你知道我的手段。”\n回到公寓，我反锁房门，打开电脑。\n切入私有云端，刚才那段长达十五分钟的对话音频已经躺在加密区。\n我敲击键盘输入密钥，将乱码解码为清晰的音频文件。\n接着，我翻出原主之前备份的早期威胁短信截图。\n我明白，利用主流网站揭露这些行不通，\n那我只好采取些非常手段。\n为了避开经纪公司的网络监控，我从口袋里摸出一张电话卡。\n这是今天去医院时，我趁乱从奶奶的旧手机里拔出来的。\n插卡，联网。\n我切入暗网，购买了三个境外的僵尸网络节点作跳板，\n将音频和短信截图，连同图片造假鉴定报告进行多重加密打包。\n一份通过内网通道直达网信办举报中心；\n一份发给早已拟定好合同的顶尖维权律师；\n最后一份，我写了一个延时触发的脚本，\n匿名投递给国内三家以绝不妥协著称的媒体主编邮箱。\n做完这一切，天已经亮了。\n早上八点，严寒的微信准时发了过来：\n“考虑得怎么样了？”\n我果断地回复，\n“我考虑过了，我不同意。”\n“别敬酒不吃吃罚酒，得罪我，我保证让你在这个圈子里混不下去！”\n我冷笑一声，\n一边切屏给律师发送行动的指令，一边在对话框里敲下回复：\n“你还是准备好，担心担心你自己吧。”\n\n## 第5章\n“砰！”\n我公寓的防盗门传来一声巨响。\n紧接着，是严寒打来的视频通话。\n我按下接听，画面里，严寒身后的背景赫然是医院重症住院部的走廊！\n“许栀，你敢跟我耍花招？找死！”\n他将镜头对准前方几个黑衣壮汉\n与此同时，我公寓的防盗门锁报废，防盗门倒塌掀起一阵尘土。\n三个提着钢管的壮汉盯着我，步步逼近。\n手机屏幕里，严寒叫嚣的声音震得我耳膜生疼：\n“我让你装！我现在就拔了这老东西的管子！”\n我倚靠在椅背上，嘴角勾起嘲讽：\n“你拔啊。”\n视频中，黑衣人掀开病床上的被子。\n空的。\n严寒震惊地盯着屏幕里的空床。\n“人呢？！”\n“严总，你真以为我会放心把奶奶留在普通重症区？”\n我语气没有一丝起伏，\n“昨晚从会所出来，我就联系了私立医院。”\n“现在我奶奶躺在安保级别最高的特护病房。”\n“别说你的打手，连一只苍蝇都飞不进去。”\n“你想打扰她？下辈子吧。”\n“臭婊子，你敢耍我！”\n严寒在视频那头气急败坏。\n我挂断视频，按下桌上的遥控器，天花板四个角落的摄像头同时亮起红灯。\n“这是我的私人云端实时同步录像。”\n“另外，十分钟前我已经报了警。”\n我晃了晃手机，窗外刚好传来由远及近的警笛声，\n“要试试这钢管砸下来，你们能判几年吗？”\n三人脸色一变，对视一眼，骂骂咧咧地夺门而逃。\n危机解除。\n我跨过一地狼藉，重新坐回电脑前，拨通了律师的电话。\n等待接通时，我瞥见原主日记本摊在桌角，一页被撕掉，夹着张旧照片，背面写着“陈雯，等我红了就去找你”。\n“动手吧。”\n五分钟后，一份盖着公章的律师函发送到了经纪公司高层的邮箱里。\n除了解约声明，里面还附带了一份“大礼包”：\n林姐知情，且纵容协助严寒潜规则旗下艺人的聊天记录和邮件往来。\n另一边，严寒察觉到了部分证据已经开始外泄。\n我的网络监测探针显示，各大平台的敏感词库正在被更新。\n严寒急眼了。\n雷霆大怒之下，他开始疯狂砸钱，动用庞大的公关力量全网删帖。\n热搜榜上，关于他公司的词条迅速被撤下，\n吃瓜群众发出的质疑贴不到一分钟就被删，\n大批高级水军下场，强行把水搅浑。\n叮的一声，严寒的短信发了过来：\n“只要钱到位，互联网就不会有你的记忆！”\n“你奶奶躲得过初一躲不过十五，走着瞧！”\n看着这句狠话，我只觉得可笑。\n我已经切断了他打探病房信息的渠道。\n他现在的威胁，不过是落空后的无能狂怒。\n电脑屏幕右下角，一个红色的倒计时窗口正在安静地跳动。\n“3、2、1……”\n进度条拉满，定时投递脚本触发成功。\n三封加密邮件，滑入了三家深度调查媒体主编的收件箱。\n\n## 第6章\n这三家媒体以不畏强权、死磕真相在业内著称。\n严寒的资本手腕能买通营销号，却买不动这些真正的新闻人。\n两小时后，早上八点整，早高峰通勤的节点。\n原本被严寒水军搅得乌烟瘴气的社交平台，撕开了一道口子。\n没有预热，没有娱乐圈惯用的八卦噱头，\n三家深度调查媒体全网同步推送了一篇万字长文。\n标题字字见血：\n《赛博猎巫的背后：资本胁迫、技术造假与一场完美的网络谋杀》。\n文章开篇，甩出了我那份长达三十页的图像技术鉴定报告。\n作为资深码农，我给出的证据链是降维打击级别的。\n报告里放大了所谓“医美现场图”的所有噪点，详细展示了ELA热力图，\n甚至直接提取了图片底层的EXIF数据，\n将拼接合成的操作痕迹、修改时间和部分硬件特征，展示得清清楚楚。\n这篇报道像一枚深水炸弹，引爆了整个网络。\n“卧槽！作为一个十年后期修图师的我头皮发麻。”\n“这报告太硬了，这根本不是什么吃瓜，这是高技术犯罪啊！”\n“看懂了，图片是P的，就医记录是假的，连所谓的知情人士是虚拟账号。”\n“我去，我们全被当枪使了！”\n“细思极恐……如果许栀拿不出这份报告，她现在是不是已经被逼上绝路了？”\n风向变了。\n原本满屏的荡妇羞辱和谩骂，转变成了对资本只手遮天的恐惧与愤怒。\n这不再是一桩茶余饭后的戏子黑料，\n而是被严肃定性为一桩涉及资本胁迫的网络暴力案件。\n那些原本跟着带节奏的大V们悄悄删除微博，理智的路人成批觉醒。\n严寒慌了。\n后台监测仪上，我看到大量异常流量正在冲击这三家媒体的服务器。\n严寒的水军涌入评论区，试图用以往那种胡搅蛮缠的方式把水再次搅浑。\n他甚至动用了最高级别的公关预案，试图花重金强行撤掉热搜词条。\n但这次，他踢到了铁板。\n这三家硬核媒体背后，是坚不可摧的公信力和新闻底线。\n严寒的团队绝望地发现，他们的资本权限在这里根本不管用。\n不仅文章删不掉，反而因为短时间内触发了平台的异常压制机制，\n被系统判定为重大社会事件，强推上了各大首页的置顶位，全网飘红。\n真相如同决堤的洪水，势不可挡。\n我坐在电脑前，看着数据监控面板。\n代表“许栀澄清”、“资本网暴”的词条指数正在呈指数级狂飙，\n而严寒关联实业公司的网络风评和股市预期，则断崖式暴跌。\n局势逆转，一切都在计算之中。\n我正准备关掉网页，去医院看望奶奶，\n医院护工来电，说奶奶昏迷中喃喃“栀栀左手有疤”。我低头看自己光滑的左手，只当是老人胡话。\n电脑屏幕右下角的监控雷达突然发出一声尖锐的红色警报。\n一条全新的词条，突破了媒体的封锁，空降热搜榜第一。\n词条后面，跟着一个刺眼的的深红色“爆”字。\n许栀主动投怀送抱，会所监控流出\n我盯着这条热搜，眼睛微微眯起。\n\n## 第7章\n鼠标点开那个刺目的“爆”字。\n屏幕上弹出一段三十秒的无声监控视频。\n画面正是我昨晚走进那家私人会所包厢的场景。\n因为角度刁钻，视频里的我看起来像是顺从地交出手机，\n任由保镖搜身后走进了光线昏暗的包厢。\n视频末尾还被恶意剪辑了一段我靠近严寒倒水的画面，\n没有声音，加上模糊处理的滤镜，看起来就像是我在主动投怀送抱。\n营销号的配文更是恶毒：\n“所谓的技术流澄清不过是洗白手段。”\n“事实是许栀早已向资本低头，深夜主动赴约，企图用身体平息风波。”\n严寒这手脏牌打得真是时候。\n他想利用大众对娱乐圈潜规则的固有偏见，\n将我钉死在“当了婊子还立牌坊”的耻辱柱上。\n我没慌，反而笑了。\n等的就是他这步棋。\n现在全网都在盯着我，流量达到了巅峰。\n我打开手机，登上了公司归还的账号，点击开启直播。\n没有预热，开播瞬间直播间涌入了十万人。\n弹幕狂刷，夹杂着不堪入目的词汇。\n我没理会这些，把昨晚那枚胸针摘下来，摆在镜头前。\n“大家都在看严总放出的无声电影。”\n“既然剧情这么精彩，不配点原声怎么行？”\n我将胸针连接电脑，手指敲击回车键。\n我编写的加密程序，绕过防火墙，解压提取音频。\n一段清晰无比的对话，传遍了整个网络。\n“许栀，你是个聪明人。”\n“只要你今晚留下，所有的黑料我十分钟内就能让它们消失。”\n这是严寒的声音，带着不加掩饰的傲慢。\n紧接着，是我冷静的质问：\n“所以，那些医美假照还有买通营销号的造谣，全是你干的？”\n“是我又怎么样？”\n“在这个圈子里，资本就是规矩。\n“不顺从我，你连翻身的机会都没有！”\n“不仅是你，那个躺在医院里的老太婆也别想安生……”\n音频扒下了严寒衣冠楚楚的伪装，露出了他威逼利诱冷血嘴脸。\n弹幕在那一刻，出现了诡异的停顿。\n紧接着，整个直播间炸锅了。\n“草！这男的太恶心了！”\n“这哪里是潜规则，这是黑社会性质的敲诈勒索吧？！”\n“反转了！许栀是去录音取证的！她根本没妥协，她太刚了！”\n我看着飙升的热度，对着镜头开口：\n“严寒，你以为交出手机，搜了身，我就没办法了吗？”\n“这段录音，我已经同步发给了警方。”\n另一边，经纪公司的高层会议室里早已乱作一团。\n林姐和公司高管们看着直播间里引爆的舆论，冷汗直流。\n他们原本还想把原主当成礼物送给严寒，\n但现在事情的性质已经从娱乐八卦升级成了违法犯罪。\n严寒如今玩脱了。\n稍有不慎，公司都会作为拉皮条的从犯被牵连进去。\n“快！把之前所有的通稿全撤了！”\n公司高层在会议室里咆哮，\n“马上发声明，把公司和严寒的关系摘干净！快啊！”\n我的手机屏幕亮了，一条来自林姐的信息弹了出来：\n“小栀，公司决定挺你，严寒的事我们全不知情。”\n“你先下播，我们好好谈谈后续的公关。”\n我对着直播间的镜头，将手机屏幕怼到了镜头前。\n“看，原来落井下石的人，翻脸也可以这么快。”\n众人还在震惊于经纪公司的无耻时，直播间的连麦申请响了起来。\n来电显示，居然是严寒本人。\n\n需要带过来的事实 carried_facts：\n[\n {\n  \"fact\": \"严寒录音曝光后，主角拒绝连麦，宣布证据已发警方，严寒实业股价跌停、合作方解约，警方立案调查。\",\n  \"source_chapter\": 8,\n  \"replant\": \"续写第1章通过主角切断直播后的手机新闻推送和内心独白快速交代。\"\n },\n {\n  \"fact\": \"苏菲代言解约，S级剧换人，水军头子被立案调查。\",\n  \"source_chapter\": 8,\n  \"replant\": \"续写前段通过娱乐新闻或苏菲求饶电话交代。\"\n },\n {\n  \"fact\": \"经纪公司发布致歉信，推责林姐，附无条件解约协议书，主角签字发送。\",\n  \"source_chapter\": 8,\n  \"replant\": \"续写第2章主角收到解约协议邮件，签字后长舒一口气。\"\n },\n {\n  \"fact\": \"奶奶在主角拍完电影后回光返照，识破主角不是原主，感谢她后安详离世。\",\n  \"source_chapter\": 9,\n  \"replant\": \"续写第9-10章重新演绎奶奶临终场景，保留识破身份和感谢的核心情感。\"\n },\n {\n  \"fact\": \"主角扎进剧组大半年，电影公映后获全网好评，撕掉废柴花瓶标签。\",\n  \"source_chapter\": 9,\n  \"replant\": \"续写中段用剧组蒙太奇和影评片段交代。\"\n }\n]\n\n已写的续写章节：\n## 第8章\n直播间里，连麦申请的铃声像催命符一样响个不停。\n\n屏幕上，严寒的头像疯狂闪烁。\n\n弹幕已经刷疯了：\n\n“接啊！看他还有什么话说！”\n\n“严总这是要当众道歉吗？”\n\n“许栀别怂！”\n\n我对着镜头，嘴角扯出一个弧度，鼠标移向那个闪烁的红色按钮。\n\n按了下去。\n\n连麦界面瞬间黑屏，只剩下弹幕区满屏的问号。\n\n“严寒，你以为我会给你一个当众表演的机会？”\n\n我把键盘拉到面前，手指飞快地敲下一行字，同步到直播间公告栏。\n\n“互联网不是法外之地，严总，留着你的话去跟警察解释吧。”\n\n发送。\n\n然后，我点击了关闭直播。\n\n屏幕暗下去的前一秒，弹幕定格在刷屏的问号上。\n\n手机开始疯狂震动，各种推送像洪水一样涌进来。\n\n第一条，来自财经快讯：\n\n【严寒实业股价断崖式跌停，市值蒸发超三十亿。】\n\n第二条，来自娱乐前线：\n\n【严寒名下多家公司遭合作方紧急切割，已有三个品牌方宣布终止合作。】\n\n第三条，来自社会新闻：\n\n【警方已就“网络造谣及资本胁迫案”正式立案，严寒被限制出境。】\n\n我把手机屏幕转向电脑摄像头，录了一小段视频，发到个人主页。\n\n配文只有一行字：\n\n“完整录音与数据证据链，已提交警方。后续进展，依法公开。”\n\n做完这些，我靠在椅背上，长出一口气。\n\n邮箱弹出一封新邮件，是经纪公司法务部发来的。\n\n我点开。\n\n一封致歉信，用词恳切，把所有责任推给了林姐，说她是“个人行为，公司事先并不知情”。\n\n附件里，是一份无条件解约协议书。\n\n我快速扫了一遍条款，确认没有陷阱，签上“许栀”两个字，点击发送。\n\n屏幕弹出“发送成功”的提示时，我盯着那两个字看了很久。\n\n第一次觉得，这个名字，这具身体，真正属于我了。\n\n手机响了，来电显示：苏菲。\n\n我按下接听，没说话。\n\n“许栀……栀姐，之前的事是我不对，我一时糊涂，你大人不记小人过……”\n\n苏菲的声音在发抖，背景里隐约有人在催她，“菲姐，品牌方那边催着要解约函……”\n\n“你代言掉光了，戏也换人了，才想起给我打电话？”\n\n我语气很平。\n\n“不是，你听我说，那些水军都是严寒让我买的，我也是被逼的……”\n\n“你被逼的？”\n\n我笑了一声，\n\n“苏菲，你发给我的私信，我可都存着呢。”\n\n“你……你想怎么样？”\n\n“不想怎么样。”\n\n我挂了电话，顺手把她的号码拖进黑名单。\n\n娱乐新闻的推送紧接着弹出来：\n\n【苏菲多个代言遭品牌方火速解约，S级古装剧《长歌行》宣布换人，原定女主苏菲被替换。】\n\n我把手机扔到桌上，目光落在桌角那本日记本上。\n\n那页被撕掉的痕迹还在。\n\n我伸手翻到那个缺口，夹层里滑出一张旧照片。\n\n照片上，两个女孩站在孤儿院门口，笑得灿烂。\n\n左边那个，是原主许栀，扎着马尾，左手腕上有一道明显的疤。\n\n右边那个，我不认识，照片背面用圆珠笔写着两个字：\n\n陈雯。\n\n我把照片翻过来，盯着那个名字。\n\n左手有疤。\n\n我想起医院护工白天打来的那通电话，说奶奶昏迷中一直在喃喃“栀栀左手有疤”。\n\n我低头看了看自己的左手，光滑，干净，一道疤都没有。\n\n正想着，手机屏幕又亮了。\n\n一条来自陌生号码的短信，只有一句话：\n\n“许栀，你还记得陈雯吗？”\n\n我攥紧那张旧照片，屏幕的光映在“陈雯”两个字上，格外刺眼。\n\n## 第9章\n水军头子被立案调查的消息上了热搜第三。\n\n词条后面跟着一个橙色的“热”字。\n\n警方通报写得清清楚楚：某营销公司负责人因涉嫌非法经营、寻衅滋事被刑事立案，名下多个账号已封禁。\n\n评论区有人贴出截图，是那家营销公司的内部报价单，明码标价“黑热搜套餐”“控评套餐”。\n\n“原来我们看到的每一个热搜，都是花钱买出来的。”\n\n“复盘了一遍整个事件，越看越头皮发麻。”\n\n风向变了。\n\n我关掉网页，拿起车钥匙出门。\n\n中心医院走廊里，王医生拿着最新的检查报告。\n\n“许小姐，老太太这次挺过来了，但心衰的基础还在。”\n\n他翻到第二页，指了几项指标，\n\n“随时可能反复，你要有心理准备。”\n\n“我明白。”\n\n我点了点头。\n\n“奶奶现在能转院吗？”\n\n“可以，但我建议再观察两天。”\n\n“那就后天。”\n\n从医院出来，我直接开车去了那家私立医院。\n\n签完特护病房的合同，一次性刷了七位数，足够奶奶住很多年。\n\n回到中心医院，我坐在奶奶床边。\n\n她闭着眼睛，呼吸很轻。\n\n我伸手握住她的手腕，枯瘦，皮肤薄得能看见血管。\n\n“栀栀……”\n\n奶奶忽然动了动嘴唇，声音含混不清。\n\n我凑近了些。\n\n“栀栀左手有疤……我记得的……”\n\n我低头看了一眼自己的左手。\n\n光滑，干净，一道疤都没有。\n\n老人糊涂了。\n\n我松开她的手，把被角掖好。\n\n手机在口袋里震了一下。\n\n“许栀女士，陈导新项目《暗河》正式确认由您出演女一号。下周三进组，片酬按S级结算。”\n\n紧跟着又是一条：\n\n“另外三个品牌方发来代言意向，资料已发您邮箱。”\n\n我回了“收到”。\ n\n评论区置顶是营销号发起的投票：“你相信许栀被夺舍了吗？”\n\n七万人参与，六万三千票投了“相信”。\n\n“让她验疤！验不了就是心虚！”\n\n“这已经不是娱乐圈的事了，这是灵异事件！”\n\n“@网信办 @公安部 建议介入调查。”\n\n手机开始响。\n\n第一个电话是代言品牌方，对方语气为难：“许栀女士，我们总部那边压力很大，合同暂时中止，后续再联系。”\n\n第二个是剧组制片人：“定妆照先不拍了，投资方说要重新评估风险。”\n\n第三个、第四个、第五个。\n\n我把手机调成静音，来电记录截屏存档。\n\n门铃响了。\n\n从猫眼看出去，楼道里挤满了人。长焦镜头、摄像机、举着手机直播的博主。\n\n“许栀！出来说两句！”\n\n“你左手敢不敢伸出来给大家看看！”\n\n“你是不是已经死了？现在是谁在操控你的身体？”\n\n我拉上窗帘，坐回电脑前。\n\n邮箱里躺着一封新邮件，发件人是经纪公司法务部。\n\n“许栀女士，鉴于目前舆论涉及重大公共关切，公司要求您于今日下午三时前提交三甲医院出具的身体检查报告，包括但不限于指纹、疤痕、DNA比对。”\n\n“如拒绝配合，公司将视为您单方面放弃所有申辩权利。”\n\n我敲下回复：“拒绝。”\n\n发送。\n\n王医生的电话打进来，我接了。\n\n“许小姐，老太太今天下午突然心律不齐，刚抢救过来。”\n\n他压低声音。\n\n“她一直在喊你的名字，你方便过来一趟吗？”\n\n“我马上到。”\n\n我抓起大衣和车钥匙，走到门口。\n\n猫眼里，狗仔还堵在楼道。\n\n我拉开门的瞬间，闪光灯像暴雨一样砸过来。\n\n“许栀！说两句吧！”\n\n“你到底是人还是鬼！”\n\n有人把镜头怼到我脸上，有人伸手拽我的包带。\n\n我冷着脸，一个字没说，挤开人群往电梯走。\n\n一个代拍追上来，镜头几乎戳到我鼻尖：“你左手敢伸出来吗？就一下！”\n\n我停下脚步，转头看他。\n\n“让开。”\n\n声音不大，但那人愣了一下，后退半步。\n\n我进了电梯，按下关门键。\n\n医院走廊弥漫着消毒水味。\n\n王医生在病房门口等我，表情凝重。\n\n“刚打了镇静，现在睡了。”\n\n他翻开病历，“心衰加重，不能再受刺激。”\n\n“网上的事，病房里有人刷到了？”\n\n王医生沉默两秒。\n\n“隔壁床的家属在看直播，声音外放。”\n\n我推开病房门，奶奶躺在床上，鼻子里插着氧气管，胸口微弱起伏。\n\n床头柜上，一部旧手机屏幕还亮着。\n\n上面正在播放一段视频，标题是“许栀奶奶亲口指认：她不是我孙女”。\n\n播放量已经过百万。\n\n剪辑者把奶奶在病床上的呓语，配上了阴森的背景音乐和字幕特效。\n\n评论区第一条：“连亲奶奶都不认她，这还有什么好说的？”\n\n我伸手关掉视频，把手机扣在桌上。\n\n指节在发抖。\n\n我走到走廊尽头，靠着墙，慢慢滑坐到地上。\n\n消毒水的气味钻进鼻腔，走廊里人来人往，有人推着器械车经过，轮子碾过地砖发出刺耳的声响。\n\n我闭上眼。\n\n原主留下的旧手机还揣在我大衣口袋里，硌着肋骨。\n\n我把它摸出来，握紧。\n\n奶奶的声音还在脑子里转——“你不是我的栀栀”。\n\n我知道她没说错。\n\n我确实不是。\n\n但我不能认。\n\n认了，原主就白死了。\n\n认了，严寒就赢了。\n\n认了，奶奶就没人管了。\n\n我睁开眼，从地上站起来。\n\n走到护士站借了台电脑，连上我的私有云端。\n\n手指在键盘上敲了第一行指令。\n\n林姐的银行流水，我早就爬下来了。之前没动，是因为没到清算的时候。\n\n现在到了。\n\n我调出她近半年的转账记录，按时间排序。\n\n一笔一笔筛。\n\n凌晨两点十七分，一笔大额转出。\n\n收款方是一家注册在维京群岛的空壳公司。\n\n我放大收款账户信息，往下翻。\n\n实控人一栏，清清楚楚写着两个字。\n\n严寒。\n\n## 第14章\n林姐的转账记录不止一笔。\n\n我继续往下翻，收款方那家维京群岛空壳公司，半年内从林姐账户吸走了三百多万。每笔转账的时间节点，都卡在原主拒绝严寒之后的第三天、第五天、一周后。\n\n我调出林姐的邮件备份，之前从经纪公司服务器里一并爬下来的。\n\n搜索关键词：许栀。\n\n三百多封邮件，我按时间倒序排列，筛出她和严寒助理的往来。\n\n第一封，去年十一月。严寒助理发来一份名单，上面列了七个女艺人，许栀排在最后。\n\n林姐回复：“许栀最难搞，奶奶那边可以下手。”\n\n第二封，十二月。严寒助理发来一个压缩包，里面是伪造的医美病历和第一批黑图。\n\n林姐回复：“收到，明天安排营销号发。”\n\n第三封，今年一月。林姐主动发了一组许栀的私人行程表，包括奶奶住院的科室、床号、主治医生。\n\n邮件末尾加了一句：“严总放心，她跑不掉。”\n\n我把所有邮件按时间轴整理，配上转账记录、聊天截图，做成一份完整的证据链文档。\n\n三百七十四页。\n\n做完这些，天已经黑了。\n\n我没有急着发。\n\n现在发出去，最多让林姐进去蹲几年。严寒已经批捕，苏菲掉了代言，这些都不够。\n\n我要等。\n\n等到一个所有目光都聚焦的时刻，一次性清算。\n\n手机震了一下，苏菲发了条微博，配图是她在某品牌活动上的精修照。\n\n“清者自清，浊者自浊。有些人忙着编故事，有些人忙着往前走。”\n\n评论区水军整齐刷屏：“姐姐好美”“不跟糊咖计较”。\n\n我转发了她的微博，只加了四个字：“清者自清。”\n\n评论区瞬间两极分化。\n\n“许栀终于回应了！”\n\n“就四个字？疤的事不解释？”\n\n“人家忙着拍戏，谁像你们天天盯着别人左手看。”\n\n“我信她，那份技术鉴定报告不是一般人能拿出来的。”\n\n“信她个鬼，夺舍实锤！”\n\n我没有再看。舆论稳住了，两边吵得越凶，热度维持得越久。等终局到来，所有的质疑都会变成打向林姐和苏菲的子弹。\n\n第二天早上，一条微信好友申请弹出来。\n\n验证消息：“陈导。”\n\n我通过。\n\n对方直接发来一段语音，声音沙哑，带着片场特有的嘈杂背景音。\n\n“许栀，我看了你那场直播。别人看热闹，我看门道。”\n\n“你对着十万条辱骂，手没抖，声没颤，眼睛里全是算计。这种心理素质，我下部戏的女主角，非你不可。”\n\n紧接着，一份电子合同发过来。\n\n电影项目：《暗河》。\n\n现实主义悬疑题材，女主角是个被诬陷杀人的法医，全片一百二十七场戏，一百零三场有她。\n\n片酬那一栏，填的是S级顶格。\n\n我翻到合同最后一页，导演已经签了字。\n\n我回复：“陈导，我接。”\n\n他秒回：“下周三进组。把你左手的事处理好，别让剧组为难。”\n\n“明白。”\n\n我关掉对话框，把合同转发给律师存档。\n\n下午，我开车去了私立医院。\n\n奶奶躺在特护病房里，鼻氧管换成了面罩，脸色比上次好了一些。\n\n王医生在走廊拦住我。\n\n“许小姐，老太太的情况暂时稳住了。心衰的基础还在，但私立医院这边的设备和护理跟上了，短期内不会有危险。”\n\n他顿了顿。\n\n“不过她清醒的时间越来越少，你要有心理准备。”\n\n“我明白。”\n\n我走进病房，坐在床边。\n\n奶奶的眼皮动了动，没有睁开。嘴唇翕了两下，声音太轻，我听不清。\n\n我握住她的手。\n\n枯瘦，冰凉，指节因为常年输液而泛着青紫。\n\n“奶奶，我要去拍戏了。”\n\n她的手指在我掌心里微微动了动。\n\n“拍完这部戏，我就能洗掉所有脏水。”\n\n“到时候，我推你去看首映。”\n\n奶奶的嘴角好像弯了一下，又好像没有。\n\n我坐了很久，直到护士进来换药，才起身离开。\n\n走出病房，手机屏幕亮了。\n\n一条来自陌生号码的短信，只有六个字：“替身，颁奖礼见。”\n\n号码归属地查不到，但语气我认得。\n\n苏菲。\n\n我把短信截图，存进加密文件夹。\n\n文件夹命名：“终局”。\n\n里面整整齐齐码着林姐的三百七十四页证据链、苏菲的私信截图、陈雯在网吧的上机记录，还有奶奶病房被骚扰那天的监控备份。\n\n我删掉苏菲的短信，打开加密文件夹，最后检查了一遍文件结构。\n\n所有证据分成三份，设置了三个不同的定时触发节点。\n\n第一份，颁奖礼红毯开始前两小时，自动投递给三家媒体。\n\n第二份，颁奖礼最佳女主角揭晓的瞬间，自动上传至网信办举报平台。\n\n第三份，如果前两份被拦截，四十八小时后，自动群发至全网所有主流社交平台。\n\n文件名：终局。\n\n我合上电脑，把旧手机从抽屉里取出来，和加密硬盘一起锁进保险柜。\n\n站起身，走到窗前。\n\n楼下没有狗仔了。\n\n远处，城市的天际线亮起万家灯火。\n\n## 第15章\n进组第一天，陈导没让我试戏。\n\n他把剧本扔给我，指了指监视器旁边的折叠椅。“坐那儿看，看三天。”\n\n我没问为什么。坐下来，翻开剧本。\n\n女主角叫沈遥，法医，被指控伪造尸检报告。全片核心冲突是：她到底有没有篡改数据。\n\n陈导拍戏不用分镜脚本，现场走位全靠演员自己找。第一场审讯戏，他让男主即兴发挥，台词随便说。\n\n监视器里，男主拍桌怒吼：“你改了报告！你收了钱！”\n\n沈遥的台词本上只有一句：“我没有。”\n\n我盯着剧本上那三个字，忽然想到一件事。\n\n原主被全网骂的时候，说过最多的话也是“我没有”。没人信。\n\n我把剧本合上，掏出手机，打开备忘录。\n\n写下一行字：沈遥的动机不是自证清白，是让死者的数据开口说话。\n\n第二天，陈导拍沈遥在停尸房解剖尸体的戏。道具组准备了假人 录音。老人家亲口说，‘你不是我的栀栀’。”\n\n她又指向陈雯。\n\n“这是许栀孤儿院时期的好友，陈雯。她能证明，许栀左手腕上有一道疤，从小就有。但现在的许栀，左手干干净净，一道疤都没有！”\n\n陈雯被推上前，手抖着掏出一张旧照片。大屏幕切到特写，孤儿院门口，两个女孩，左边那个左手腕上疤痕清晰。\n\n“我……我可以作证。”\n\n陈雯的声音在发抖。\n\n“以前的许栀不会用电脑，不会编程，连手工作业都是我帮她做的。但现在的许栀……”\n\n林姐接话，语气陡然拔高。\n\n“现在的许栀会写代码，会搞直播，会查IP，会跟踪资金链！一个连电脑开机都不会的人，一夜之间成了顶级黑客？”\n\n“你们告诉我，她还是许栀吗？”\n\n台下炸了。议论声、惊呼声、直播弹幕滚成一片。\n\n“天哪，所以之前的传闻是真的？”\n\n“左手疤没了怎么解释？？”\n\n“她真的是被夺舍了？！”\n\n主持人慌了，对着耳麦连说了三遍“切广告”。导播手忙脚乱。\n\n我站在台上，奖杯还在手里。\n\n对着主持人方向，我轻轻摇了摇头。然后抬起手，指了指自己，又指了指话筒。\n\n主持人愣了。\n\n“许栀老师，您……”\n\n“不要切。”\n\n我声音很平，通过话筒传遍全场。\n\n“既然大家这么想知道真相，那就一起看。”\n\n全场安静下来。林姐的表情变了，她大概以为我会慌。\n\n我没慌。\n\n我转头看向侧幕。陈导已经站起来，冲后台方向打了个手势。两秒后，舞台后方的大屏幕闪了一下。\n\n我摘下左手腕上的银镯子，举到镜头前。大屏幕特写，镯子内壁刻着两个字：平安。\n\n“这是奶奶留给我的。”\n\n然后我把镯子重新戴好，对着耳麦说了一句话。\n\n“投屏，播放。”\n\n大屏幕画面切换。全场屏息。\n\n画面里，原主许栀坐在一间出租屋的床边，穿着洗旧的睡衣，手里攥着身份证。眼睛红肿，声音在抖。\n\n“我叫许栀，身份证号是……”\n\n她举起身份证，对着镜头。\n\n“如果我出了什么事，请把这个视频交给警方。”\n\n林姐脸色煞白。\n\n“严寒，严寒实业董事长，他一直在逼我——”\n\n原主的声音从大屏幕传出来，清晰，稳定。\n\n“他通过我的经纪人林晓传话，说只要我陪他一次，所有黑料都会消失。我拒绝了。然后，我的医美假照、我奶奶的住院信息、我的私人行程，全被曝光了。”\n\n台下死寂。弹幕停滞了整整两秒。\n\n原主录像继续播放。她翻出一张聊天记录截图，对着镜头展示。\n\n“这是陈雯发给严寒的定位。我住院的楼层、病房号，是她出卖的。”\n\n陈雯瘫坐在台上。\n\n原主录像里，她抬起头，对着镜头笑了一下。笑得很轻，眼睛里有泪。\n\n“我知道我活不长了。”\n\n“但请告诉我的奶奶——”\n\n“她的栀栀，没有做错任何事。”\n\n## 第25章\n录像播完，大屏幕暗下去。\n\n全场静了整整三秒。\n\n然后弹幕炸了。\n\n“她说她没做错任何事……我哭了。”\n\n“所以从头到尾都是严寒和林晓在搞她？”\n\n“等等，陈雯出卖她？那个孤儿院闺蜜？”\n\n“查！把林晓和陈雯的底全给扒出来！”\n\n台下观众席有人喊了一嗓子：“林晓，你还是人吗！”\n\n林姐站在C区第三排，手里的打印纸抖得哗哗响。她抢过话筒，声音劈了叉：“这是合成的！她找人做的假视频！”\n\n我没理她，对着耳麦说了第二句话。\n\n“播放下一段。”\n\n大屏幕亮了。奶奶靠在私立医院特护病房的枕头上，鼻氧管已经撤了，脸色苍白，眼睛却很亮。\n\n“栀栀，奶奶知道你忙。奶奶不怪你。”\n\n林姐的话筒掉在地上，砸出一声尖锐的蜂鸣。\n\n“你替那个孩子做了这么多事，奶奶谢谢你。”\n\n台下有人开始抹眼睛。前排一个女记者捂住嘴，肩膀在抖。\n\n“不管你是谁，你都是我的好孙女。奶奶走了以后，你要好好吃饭，别老熬夜。镯子戴着，保平安。”\n\n奶奶停了一下，喘了两口气。\n\n“还有，别放过那些人。”\n\n视频结束。大屏幕黑了两秒。\n\n弹幕区安静了，然后涌出一片哭脸。\n\n“老太太到最后都在护着她……”\n\n“林晓！陈雯！你们连这种录音都敢剪？”\n\n“把原版放出来！放完整版！”\n\n我拿起话筒。\n\n“林晓发给营销号的录音，是从四分钟里剪出来的四十七秒。原版有护工证词，有时间戳，有设备元数据。我已经交给警方了。”\n\n林姐脸色从白转灰。\n\n陈雯瘫坐在台上，婚纱似的白裙子铺了一地。\n\n我转向她。\n\n“陈雯，你发给严寒的那条定位，时间、IP、设备型号，全在恢复数据里。”\n\n大屏幕切到聊天记录截图。坐标定位精确到医院楼层和病房号。\n\n“你出卖她的时候，她还在医院给奶奶凑靶向药的钱。”\n\n陈雯张了张嘴，没发出声。\n\n“我……我没有……”\n\n“没有？”\n\n我划了一下手机屏幕。第二张截图投上去。陈雯和严寒助理的完整对话，时间线清清楚楚。\n\n陈雯捂住脸，哭出了声。\n\n“我对不起她……我真的对不起她……”\n\n“你的道歉，留给警察。”\n\n我转向林姐。\n\n“林晓，你协助严寒胁迫旗下艺人，三百七十四页证据链，包括你十七笔转账记录、你和严寒助理的往来邮件、你安排营销号和水军的聊天截图。”\n\n大屏幕开始滚动。一笔一笔转账，一封一封邮件，时间、金额、收款账户，全部对得上。\n\n林姐冲上台，伸手要抢话筒。两个保安从侧幕跑出来，一左一右架住她胳膊。\n\n“放开我！你们知道我是谁吗！”\n\n“知道。”我看着她，“严寒的帮凶。”\n\n林姐被按在原地，胸口剧烈起伏。\n\n我拿起手机，划到第三组证据。\n\n“苏菲。”\n\n观众席后排，白色礼服的身影僵住了。\n\n“你买水军的转账记录，你发给我的私信截图，你让营销号带节奏的聊天记录。全部。”\n\n大屏幕切到苏菲的转账流水。一笔一笔，时间节点精确到她发每条阴阳微博的前一天。\n\n苏菲站起来，尖叫声穿透整个场馆：“那是伪造的！你陷害我！”\n\n“警方已经收到完整备份。”\n\n我声音很平。\n\n“伪造不伪造，你进去跟警察解释。”\n\n苏菲脸色刷地白了。她转身想往出口走，高跟鞋踩到裙摆，踉跄了一下。\n\n就在这时，直播镜头切向观众席。\n\n两名警察从侧门走进来，穿过过道，径直走向C区第三排。\n\n全场目光跟着镜头走。\n\n警察停在林姐和苏菲身后。走在前面那个掏出证件，亮了一下。\n\n“林女士，苏女士，请配合调查。”\n\n林姐被保安架着，回头看见警察，腿一软，整个人往下滑。\n\n苏菲站在原地，嘴唇哆嗦着，白色礼服在灯光下晃得刺眼。\n\n弹幕停了一拍，然后疯了。\n\n“警察！真警察！”\n\n“当场带走！直播抓人！”\n\n“大快人心！”\n\n“许栀牛——！！！”\n\n我站在台上，手里还握着奖杯。\n\n镜头切回我脸上，大屏幕映出我的表情。没哭，没笑，就是很平静地看着台下。\n\n主持人终于找回声音，颤着嗓子问：“许、许栀老师，您还有什么想说的吗？”\n\n我低头看了一眼奖杯，然后抬头对着镜头。\n\n“我左手没疤。”\n\n“因为我不是原来的许栀。”\n\n台下倒吸冷气的声音像潮水。\n\n“但我替她活下来了。她的奶奶，我管了。她的脏水，我洗了。她的仇，我报了。”\n\n我把奖杯举起来。\n\n“这个奖，是替她拿的。”\n\n陈雯在台上哭得直不起腰。林姐被警察架着往外走，嘴里还在喊“我要求律师”。苏菲低着头，被女警带着穿过观众席，白裙拖在地上，蹭了一路灰。\n\n弹幕刷得看不清字。\n\n“许栀，你值得。”\n\n“替原主谢谢你。”\n\n“奶奶在天上看到了。”\n\n我把奖杯换到左手，右手摸了一下手腕上的银镯子。\n\n凉的，贴着皮肤。\n\n警察经过我身边时，带队的那个停下来，冲我点了一下头。\n\n“许女士，后续需要您配合做一份笔录。”\n\n“随时。”\n\n他转身跟上队伍，押着林姐和苏菲往出口走。\n\n直播镜头追着他们，弹幕还在刷。\n\n我站在台上没动，等镜头切回主持人。\n\n主持人擦了把汗，刚想开口圆场——\n\n观众席后排突然又站起来一个人。\n\n“我也要报案。”\n\n全场回头。苏菲的助理，举着手机，屏幕亮着。\n\n“苏菲让我删的聊天记录，我全存了备份。”\n\n## 第26章\n警察押着林姐和苏菲往出口走。苏菲的高跟鞋掉了一只，白裙拖在地上蹭了一路灰。她回头看了我一眼，嘴唇翕动，没发出声音。\n\n林姐还在挣扎，被警察按住肩膀。\n\n“老实点。”\n\n直播镜头追着她们一路到侧门。弹幕刷得看不清字，满屏都是“大快人心”“活该”“终于”。\n\n我站在台上，手里握着奖杯。主持人凑过来，声音发颤：“许栀老师，您看这……”\n\n“不用切。”\n\n台下安静了几秒。然后有人开始鼓掌。起初稀稀拉拉，后来越来越响，全场站起来。\n\n陈雯还瘫坐在台上。她抬起头，脸上的妆花成一片。\n\n“许栀……”\n\n她爬了两步，想去够我的裙摆。我后退半步。\n\n“我对不起她。”\n\n陈雯的声音通过话筒传遍全场。\n\n“我不该发定位，不该上节目，不该收林晓的钱。我什么都做错了。”\n\n她跪坐在台上，肩膀一抽一抽地抖。\n\n“我退出圈子。从今天起，我不再出现在任何镜头前。”\n\n她说完自己站起来，踉跄着往台下走。没人扶她。她穿过观众席，消失在侧门。\n\n弹幕停了一拍。\n\n“她道歉了……”\n\n“道歉有用吗？原主已经死了。”\n\n“但至少她认了。”\n\n我转回话筒前。\n\n“我左手没疤，因为我不是原来的许栀。”\n\n台下吸冷气的声音像潮 {name:"细纲生成",s:"S4",render(){
 const rows=detail.map(c=>`<tr><td class="n">第 ${N(c.index)} 章</td><td><b>${esc(c.title)}</b>　<span class="muted">${(c.events||[]).length} 个事件</span><br>${esc(c.core_conflict)}<br><span class="muted">章尾：${esc(c.ending_hook?.content)}</span></td></tr>`).join("");
 return page("细纲生成",`给每一章定写什么、在哪收尾。每章事件数参照原作（平均 ${U.derived?.events_per_chapter} 个）。编辑在这里逐章确认（演示里自动确认）。`,["大纲",`${detail.length} 章细纲`],`<table>${rows}</table>`,D.s4_detail)}},
{name:"伏笔回填",s:"S5a",render(){
 const r=D.s5a_backfill||{},kt=r.kept_text||{};
 const items=(r.applied||[]).map(a=>{const t=kt[a.chapter]||"",i=a.applied?t.indexOf(a.insert_text):-1;
  return `<div class="muted" style="font-size:13px;margin-bottom:6px">第 ${N(a.chapter)} 章${a.applied?"":"（没找到插入位置，未插入）"}</div><div class="ctx">${i<0?esc(a.anchor):"…"+esc(t.slice(Math.max(0,i-120),i))+`<mark>${esc(a.insert_text)}</mark>`+esc(t.slice(i+a.insert_text.length,i+a.insert_text.length+80))+"…"}</div>`}).join("");
 return page("伏笔回填",`续写里新出现的东西，在保留的原文里先补一句暗示（标黄的是补的）。只补在免费的前 ${N(cfg.free_chapters)} 章之后，原文其他地方不动。`,["选中方向的伏笔清单 + 保留的原文","补好伏笔的原文"],r.skipped?`<p class="muted">${esc(r.skipped)}</p>`:items,r)}},
{name:"正文生成",s:"S5b",render(){
 const ws=new Set(written.map(c=>N(c.outline?.index)));
 const btn=(p,i)=>`<button data-ch="${i}" class="${i===cur?"on":""}">第 ${p.i} 章${p.orig?"":" "+esc(p.c.outline?.title||"")}</button>`;
 let toc=`<div class="g">保留的原作</div>`+chs.map((p,i)=>p.orig?btn(p,i):"").join("")+`<div class="g">续写</div>`+chs.map((p,i)=>p.orig?"":btn(p,i)).join("");
 toc+=detail.filter(c=>!ws.has(N(c.index))).map(c=>`<button disabled>第 ${N(c.index)} 章 ${esc(c.title)}</button>`).join("");
 const p=chs[cur];
 return page("正文生成",`按细纲一章一章写，已写 ${written.length} / ${nNew} 章。每章写完由代码对比字数、对话占比、段落长度是否接近原作。`,["保留的原文 + 已写的前几章 + 本章细纲","每章正文"],
 `<div class="reader"><div class="toc">${toc}</div><div class="sheet">${sheet(p)}</div></div>`,p&&!p.orig?p.c:null,p&&!p.orig?p.c.checks:[])}},
];

const kept=D.s5a_backfill?.kept_text||{},inserts=(D.s5a_backfill?.applied||[]).filter(a=>a.applied);
const chs=[...Object.keys(kept).map(N).sort((a,b)=>a-b).map(i=>({i,orig:true,text:kept[i]})),...written.map(c=>({i:N(c.outline?.index),orig:false,text:c.text,c}))];
let cur=Math.max(0,chs.findIndex(p=>!p.orig));
function sheet(p){if(!p)return "";
 const body=paras(p.text).map(s=>{let h=esc(s);inserts.filter(a=>N(a.chapter)===p.i).forEach(a=>h=h.replace(esc(a.insert_text),`<mark>${esc(a.insert_text)}</mark>`));return `<p>${h}</p>`}).join("");
 const s=p.c?.stats||{};
 const meta=p.orig?`原作第 ${p.i} 章`:`续写第 ${p.i} 章 · ${N(s.words)} 字（原作每章约 ${N(base.median_words)}）· 对话 ${pct(s.dialogue_ratio)}（原作 ${pct(base.dialogue_ratio)}）`;
 return `<div class="meta">${meta}</div><div class="prose">${body}</div>`}

let at=0;
function go(i,keep){at=Math.max(0,Math.min(P.length-1,i));
 document.getElementById("nav").innerHTML=P.map((p,j)=>`<button data-go="${j}" class="${j===at?"on":""}"><small>${p.s}</small>${p.name}</button>`).join("");
 document.getElementById("page").innerHTML=P[at].render();
 const pv=document.getElementById("prev"),nx=document.getElementById("next");
 pv.disabled=!at;nx.disabled=at===P.length-1;pv.textContent=at?`← ${P[at-1].name}`:"";nx.textContent=at<P.length-1?`${P[at+1].name} →`:"";
 if(!keep)document.getElementById("stage").scrollTop=0}
document.addEventListener("click",e=>{const g=e.target.closest("[data-go]");if(g)return go(N(g.dataset.go));const c=e.target.closest("[data-ch]");if(c){cur=N(c.dataset.ch);go(at,true)}});
document.getElementById("prev").onclick=()=>go(at-1);document.getElementById("next").onclick=()=>go(at+1);
document.addEventListener("keydown",e=>{if(e.metaKey||e.ctrlKey||e.altKey)return;if(e.key==="ArrowRight")go(at+1);if(e.key==="ArrowLeft")go(at-1)});
document.getElementById("book").textContent=s0.title||"";
document.getElementById("summary").textContent=`原作 ${origN} 章，保留前 ${cut} 章，续写 ${nNew} 章（已写 ${written.length} 章）`;
go(0);
</script>
</body>
</html>
